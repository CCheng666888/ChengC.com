和 FPGA（查找表 + 可编程互连，适合大规模并行逻辑）。","formula":"PLD 基本结构 = 可编程与阵列 + 可编程或阵列（PROM/PLA/PAL/GAL 区别在可编程部分不同）","example":"例：用 GAL16V8 一片芯片实现一个译码器+几个门，替代一堆 74 系列小芯片。","keywords":["PLD","PROM","PLA","PAL","GAL","CPLD","FPGA","可编程"],"related":["dc9-2","dc9-3"]},{"bk":"digital","bkt":"数字电子技术基础（第六版）","id":"dc9-2","ch":"附录 可编程逻辑器件与硬件描述语言","tag":"可编程器件","t":"CPLD和FPGA有什么区别？","answer":"CPLD 和 FPGA 是大规模可编程器件的两大流派：CPLD 基于乘积项（与-或阵列），结构类似 PAL/GAL，时序确定、上电即工作、适合组合逻辑和中小规模设计（如地址译码、接口扩展）；FPGA 基于查找表（LUT）+ 触发器，可以搭大规模并行逻辑（CPU、信号处理、AI 加速），但配置存于 SRAM，掉电丢失，需要外挂配置芯片在启动时加载。","formula":"CPLD：乘积项结构；FPGA：LUT（查找表）+ 触发器 + 可编程互连","example":"例：电路板上的逻辑转换常用 CPLD（上电就跑）；做图像处理、软核 CPU 用 FPGA（加载配置后运行）。","keywords":["CPLD","FPGA","查找表","硬件描述语言","可编程"],"related":["dc9-1","dc9-4"]},{"bk":"digital","bkt":"数字电子技术基础（第六版）","id":"dc9-3","ch":"附录 可编程逻辑器件与硬件描述语言","tag":"HDL","t":"Verilog HDL基础语法是什么？","answer":"Verilog 是用\"写代码\"的方式描述电路的语言。核心结构：module（模块名）…endmodule 定义一个电路单元；端口用 input/output/inout 声明；用 assign 描述组合逻辑（相当于连线），用 always @(posedge clk) 描述时序逻辑（时钟边沿触发）；reg 表示存储变量、wire 表示连线。代码写的是\"硬件结构\"，不是顺序执行程序。","formula":"module 名(端口); input …; output …; assign y = a & b; always @(posedge clk) q <= d; endmodule","example":"例：与门模块——module and2(a,b,y); input a,b; output y; assign y = a&b; endmodule。","keywords":["Verilog","HDL","硬件描述语言","module","always"],"related":["dc9-2","dc9-4"]},{"bk":"digital","bkt":"数字电子技术基础（第六版）","id":"dc9-4","ch":"附录 可编程逻辑器件与硬件描述语言","tag":"HDL","t":"怎么用Verilog描述组合与时序电路？","answer":"组合电路用 assign 或 always@(*)（组合 always 块）描述，给什么输入马上出什么输出，比如 assign y = a^b 是异或、assign y = (a>b) ? a : b 是二选一。时序电路用 always @(posedge clk) 块：时钟上升沿才更新 reg，比如计数器和 D 触发器：q <= d（非阻塞赋值，多个赋值同时更新，符合硬件行为）。阻塞赋值 =、非阻塞赋值 <= 的区别是 Verilog 最重要也最易错的概念。","formula":"时序：always @(posedge clk) q <= d;（非阻塞）；组合：always @(*) 或 assign","example":"例：4 位计数器：always @(posedge clk) if(rst) cnt <= 0; else cnt <= cnt + 1;","keywords":["Verilog","组合逻辑","时序逻辑","always","RTL"],"related":["dc9-2","dc9-3"]}],"dim":512,"scale":0.3840242624282837,"vec":[-15,10,0,5,1,1,-35,-1 /* ===== 工具 ===== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function cleanMark(s){return s.replace(/\*\*(.+?)\*\*/g,'$1');}
function setBadge(t,cls){var b=document.getElementById('modelBadge');b.textContent=t;b.className=cls||'';}
var DL={lastBytes:0,lastTime:0,speed:0};
function fmtMB(b){return (b/1048576).toFixed(1);}
function clearProgText(){var st=document.getElementById('progText');if(st)st.textContent='';}
function handleProg(p,base,span){
  var prog,loaded=0,total=0;
  if(p&&typeof p==='object'){
    prog=(p.progress!==undefined?p.progress:(p.percent||0));
    loaded=p.loaded||0;total=p.total||0;
  }else{prog=p||0;}
  if(prog<0.95)setProg(base+Math.round(prog*span));
  if(total>0){
    var now=Date.now();
    if(DL.lastTime&&now>DL.lastTime){
      var dt=(now-DL.lastTime)/1000;
      if(dt>0)DL.speed=Math.max(0,(loaded-DL.lastBytes)/dt);
    }
    DL.lastBytes=loaded;DL.lastTime=now;
    var txt='语义引擎加载 '+fmtMB(loaded)+' / '+fmtMB(total)+' MB · '+DL.speed.toFixed(1)+' MB/s';
    var st=document.getElementById('progText');if(st)st.textContent=txt;
    var bd=document.getElementById('modelBadge');
    if(bd&&prog<1)bd.textContent='语义引擎下载中 '+fmtMB(loaded)+'/'+fmtMB(total)+' MB · '+DL.speed.toFixed(1)+' MB/s';
  }
}
function setProg(p){document.getElementById('progressBar').style.width=p+'%';}
function showProg(v){document.getElementById('progress').style.display=v?'block':'none';}
function tokenize(s){
  s=String(s).toLowerCase();var out=[];
  var m=s.match(/[\u4e00-\u9fa5]{2,}/g)||[];
  for(var i=0;i<m.length;i++){var c=m[i];
    if(c.length===2){out.push(c);continue;}
    for(var j=0;j<c.length-1;j++)out.push(c.slice(j,j+2));}
  var w=s.match(/[a-z0-9]+/g)||[];
  for(var k=0;k<w.length;k++)if(w[k].length>=2)out.push(w[k]);
  return out;
}
function buildIndex(){
  var N=items.length,dfs={},dl=0;
  DOC_TOKS=items.map(function(it){
    var txt=(it.t+' '+(it.keywords?it.keywords.join(' '):'')+' '+it.answer+' '+(it.formula||'')+' '+(it.example||'')).toLowerCase();
    var toks=tokenize(txt),seen={};
    for(var i=0;i<toks.length;i++){var tk=toks[i];if(!seen[tk]){seen[tk]=1;dfs[tk]=(dfs[tk]||0)+1;}}
    dl+=toks.length;
    return toks;
  });
  AVGDL=dl/N;
  DICT={};var ks=Object.keys(dfs);
  for(var i=0;i<ks.length;i++)DICT[ks[i]]=i;
  IDF=new Array(ks.length);
  for(var k in DICT)IDF[DICT[k]]=Math.log(1+(N-dfs[k]+0.5)/(dfs[k]+0.5));
}
function bm25(q){
  if(!DICT)buildIndex();
  var qt=tokenize(q),k1=1.2,b=0.75,res=[];
  for(var i=0;i<items.length;i++){
    if(CUR!=='all'&&items[i].bk!==CUR)continue;
    var f={},doc=DOC_TOKS[i];
    for(var j=0;j<doc.length;j++)f[doc[j]]=(f[doc[j]]||0)+1;
    var s=0,dl=doc.length||1;
    for(var m=0;m<qt.length;m++){
      var t=qt[m];
      if(!(t in DICT)||!f[t])continue;
      var idf=IDF[DICT[t]];
      s+=idf*(f[t]*(k1+1))/(f[t]+k1*(1-b+b*dl/AVGDL));
    }
    if(s>0)res.push({i:i,s:s});
  }
  res.sort(function(a,b){return b.s-a.s;});
  return res.slice(0,5);
}
function cos(a,b){
  var s=0,aa=0,bb=0;
  for(var i=0;i<dim;i++){var x=a[i],y=b[i];s+=x*y;aa+=x*x;bb+=y*y;}
  var n=Math.sqrt(aa)*Math.sqrt(bb);
  return n>0?s/n:0;
}
function qvec(i){
  var o=i*dim,r=new Float32Array(dim);
  for(var j=0;j<dim;j++)r[j]=(vec[o+j]/127)*scale;
  return r;
}
async function retrieveSem(q){
  var txt='为这个句子生成表示以用于检索相关文章：'+q;
  var out=await EMB(txt,{pool:'cls',normalize:true});
  var r=Array.from(out.data),scored=[];
  for(var i=0;i<items.length;i++){
    if(CUR!=='all'&&items[i].bk!==CUR)continue;
    scored.push({i:i,s:cos(r,qvec(i))});
  }
  scored.sort(function(a,b){return b.s-a.s;});
  return scored.slice(0,5);
}

async function loadEmb(){

  /* 必须用绝对 URL：transformers.js 文件探测只接受 http/https 协议，相对路径会判定文件不存在 */
  env.remoteHost=new URL('models',location.href).href.replace(/\/$/,'');
  try{env.backends.onnx.wasm.wasmPaths={mjs:'./lib/ort-wasm-simd-threaded.asyncify.mjs',wasm:'./lib/ort-wasm-simd-threaded.asyncify.wasm'};}catch(e){}
  EMB=await pipeline('feature-extraction','Xenova/bge-small-zh-v1.5',{dtype:'q8',device:'wasm'});
  setProg(30);showProg(false);clearProgText();

}

/* ===== 智能组装回答 ===== */
function relLabel(r){
  for(var i=0;i<items.length;i++)if(items[i].id===r)return items[i].t;
  return String(r);
}
function assembleAnswer(q,hits){
  var it=items[hits[0].i];
  var s='<div class="ans">';
  s+='<div class="lead">'+esc(q)+'</div>';
  s+='<div class="p">'+esc(it.answer)+'</div>';
  if(it.formula)s+='<div class="frm">公式：'+esc(it.formula)+'</div>';
  if(it.example)s+='<div class="ex">举例：'+esc(it.example)+'</div>';
  var added=0;
  for(var i=1;i<hits.length&&added<2;i++){
    var o=items[hits[i].i];
    if(o.id===it.id||(o.ch===it.ch&&o.bkt===it.bkt))continue;
    s+='<div class="sup"><div class="h">延伸 · '+esc(o.t)+'（'+esc(o.ch)+'）</div><div class="b">'+esc(o.answer.slice(0,88))+'…</div></div>';
    added++;
  }
  if(it.related&&it.related.length){
    s+='<div class="rel">想进一步了解：</div><div class="rel">';
    for(var j=0;j<it.related.length&&j<4;j++){
      var r=relLabel(it.related[j]).replace(/'/g,'');
      s+='<span class="q-chip" onclick="window.__api.askText(\''+esc(r)+'\')">'+esc(r)+'</span>';
    }
    s+='</div>';
  }
  s+='</div>';
  return s;
}
function buildCite(hits){
  var c=document.createElement('div');c.className='cite';
  var b=document.createElement('b');b.textContent='回答依据（检索命中 · 点击展开全文）';
  c.appendChild(b);
  hits.forEach(function(h){
    var it=items[h.i];
    var d=document.createElement('div');d.className='c';
    var short=(it.answer+(it.formula?'（公式：'+it.formula+'）':'')).slice(0,140)+'…';
    d.innerHTML='<div class="h">'+esc(it.bkt+' · '+it.ch+' · '+it.t)+'</div><div class="b">'+esc(short)+'</div>';
    d.onclick=function(){
      d.querySelector('.b').textContent=it.answer+(it.formula?'（公式：'+it.formula+'）':'')+(it.example?'（例：'+it.example+'）':'');
    };
    c.appendChild(d);
  });
  return c;
}

/* 极简 markdown 渲染：代码块 / 粗体 / 换行 */
function renderMd(s){
  s=String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/```([\s\S]*?)```/g,function(m,c){return '<pre>'+c.replace(/\n/g,'<br>')+'</pre>';});
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');

  return s;
}

        var o=JSON.parse(d);
        var tok=o.choices&&o.choices[0]&&o.choices[0].delta&&o.choices[0].delta.content;
        if(tok)onToken(tok);
      }catch(e){}
    }
  }
}

/* ===== 问答 ===== */
function addMsg(role,html){
  var d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML=html;
  var qa=document.getElementById('qa');
  qa.appendChild(d);qa.scrollTop=qa.scrollHeight;
  return d;
}
async function ask(){
  var q=document.getElementById('q').value.trim();
  if(!q)return;
  addMsg('user',esc(q));
  document.getElementById('q').value='';
  var hint=addMsg('bot','正在检索知识库…');
  var hits;
  var usedLex=!EMB;
  if(usedLex){
    hint.innerHTML='正在检索（语义引擎首次准备中，先用词法匹配立即作答）…';
  }
  try{
    hits=EMB?await retrieveSem(q):bm25(q);
  }catch(e){hint.innerHTML='检索出错：'+esc(e.message||e);return;}
  if(!hits.length){
    hint.innerHTML='知识库中没有检索到相关内容，换个问法试试。';
    return;
  }
  var qa=document.getElementById('qa');
  /* 低分拦截：语义检索命中分数过低 → 判定知识库无对应内容，不让 AI 发挥 */
  if(!usedLex && hits[0].s < 0.42){
    hint.innerHTML=assembleAnswer(q,hits);
    var low=document.createElement('div');
    low.className='upgrade';
    low.textContent='检索相关度较低（与知识库内容匹配不足），未启用 AI 生成；以上为知识库中最接近的原文，仅供参考。';
    hint.appendChild(low);
    qa.appendChild(buildCite(hits));
    qa.scrollTop=qa.scrollHeight;
    return;
  }
  /* 已接入 Worker 代理：DeepSeek 流式生成 */
  if(dsReady()){
    hint.innerHTML='<div class="gen"><div class="thinking">已检索到 '+hits.length+' 条相关知识点，AI 正在组织回答…</div></div>';
    qa.scrollTop=qa.scrollHeight;
    var ok=false;
    try{
      await chatDS(q,buildCtx(hits),function(tok){
        ok=true;
        var g=hint.querySelector('.gen');
        if(!g){return;}
        var st=g.querySelector('.stream');
        if(!st){st=document.createElement('div');st.className='stream';g.appendChild(st);}
        st.innerHTML=renderMd(st.textContent+tok);
        qa.scrollTop=qa.scrollHeight;
      },null);
      var g2=hint.querySelector('.gen');
      if(g2&&ok){
        var sn=document.createElement('div');
        sn.className='srcnote';
        sn.innerHTML='<b>来源</b>：'+hits.map(function(h){return esc(items[h.i].t);}).join(' · ');
        g2.appendChild(sn);
      }
    }catch(e){
      hint.innerHTML=assembleAnswer(q,hits);
      var em=document.createElement('div');
      em.className='errmsg';
      em.textContent='AI 生成失败（'+(e&&e.message||e)+'），已改用知识库原文组装回答。';
      hint.appendChild(em);
    }
  }else{
    /* 未接入代理：知识库原文组装（降级） */
    hint.innerHTML=assembleAnswer(q,hits);
    var nt=document.createElement('div');
    nt.className='upgrade';
    nt.textContent='以上为知识库原文组装回答；AI 通道部署后自动启用完整回答。';
    hint.appendChild(nt);
  }
  qa.appendChild(buildCite(hits));
  qa.scrollTop=qa.scrollHeight;
  /* 若语义引擎尚未就绪：后台加载完成后自动升级检索结果 */
  if(usedLex){
    var up=document.createElement('div');
    up.className='upgrade';up.textContent='语义引擎加载中…完成后本回答将自动升级';
    hint.appendChild(up);
    loadEmb().then(function(){
      if(EMB&&document.contains(hint)){
        return retrieveSem(q).then(function(newHits){
          if(!newHits.length)return;
          var better=newHits[0].i!==hits[0].i;
          if(better){
            hint.innerHTML='<div class="upgrade">检索已升级为语义检索，请重新提问获取更精准回答。</div>';
            var qa3=document.getElementById('qa');
            qa3.appendChild(buildCite(newHits));
            qa3.scrollTop=qa3.scrollHeight;
            setBadge('语义引擎已就绪','ok');
          }
        });
      }
    }).catch(function(){});
  }
}

/* ===== UI 初始化 ===== */
(function(){
  var bl=document.getElementById('bkList');
  window.DATA.books.forEach(function(b){
    var d=document.createElement('button');
    d.className='bk-item'; d.dataset.bk=b.key; d.textContent=b.title;
    d.onclick=function(){pickBook(b.key,d)};
    bl.appendChild(d);
  });
  var chips=[['完全剩余类','什么是完全剩余类？'],['RSA 加密解密','RSA怎么加密解密？'],['卡诺图化简','卡诺图怎么化简逻辑函数？'],['SQL注入原理','SQL注入攻击的原理是什么？'],['Cache 映射','Cache的映射方式有哪些？'],['冯诺依曼','冯·诺依曼结构计算机是什么？']];
  var cd=document.getElementById('chips');
  chips.forEach(function(c){
    var s=document.createElement('span'); s.className='q-chip'; s.textContent=c[0];
    s.onclick=function(){document.getElementById('q').value=c[1];ask();};
    cd.appendChild(s);
  });
  /* 打开页面即后台预加载语义引擎（无需用户操作） */
  loadEmb().then(function(){refreshBadge();}).catch(function(){
    setBadge('词法检索模式（语义引擎加载失败，可刷新重试）','');
  });
  refreshBadge();
})();
function pickBook(k,el){
  CUR=k;
  var all=document.querySelectorAll('.bk-item');
  for(var i=0;i<all.length;i++)all[i].classList.remove('on');
  if(el)el.classList.add('on');
  else{var m=document.querySelector('.bk-item[data-bk="'+k+'"]'); if(m)m.classList.add('on');}
}

window.__api={ask:ask,bm25:bm25,pickBook:pickBook,items:items,
  askText:function(t){document.getElementById('q').value=t;ask();},
  get state(){return {EMB:!!EMB,ds:dsReady(),badge:document.getElementById('modelBadge').textContent}}};
</script>
