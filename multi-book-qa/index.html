<style>
:root{
  --bg:#16263f; --bg2:#1d314d; --card:#223855; --line:#2e4a6d;
  --tx:#e8eef6; --tx2:#9fb3cc; --acc:#4da3ff; --acc2:#7cc0ff; --ok:#56c271; --warn:#f0a63c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{background:linear-gradient(135deg,#10202f,#1b3a5c);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h-title{font-size:19px;font-weight:700;letter-spacing:1px}
.h-title small{display:block;font-size:11px;color:var(--tx2);font-weight:400;letter-spacing:0;margin-top:2px}
#modelBadge{margin-left:auto;font-size:12px;color:var(--tx2);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:20px;white-space:nowrap}
#modelBadge.ok{color:var(--ok);border-color:var(--ok)}
#modelBadge.busy{color:var(--warn);border-color:var(--warn)}
main{flex:1;display:flex;min-height:0}
aside{width:230px;border-right:1px solid var(--line);padding:14px;overflow:auto;flex-shrink:0}
aside h3{font-size:12px;color:var(--tx2);margin-bottom:10px;letter-spacing:2px}
.bk-item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--tx);padding:8px 10px;border-radius:8px;margin-bottom:7px;font-size:13px;cursor:pointer;transition:.15s}
.bk-item:hover{border-color:var(--acc)}
.bk-item.on{background:var(--acc);border-color:var(--acc);color:#0b1626;font-weight:600}
.q-chip{display:inline-block;background:var(--card);border:1px solid var(--line);color:var(--tx2);padding:5px 10px;border-radius:16px;font-size:12px;margin:3px 4px 0 0;cursor:pointer;transition:.15s}
.q-chip:hover{color:var(--acc);border-color:var(--acc)}
.sec{margin-top:16px}
section.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.qa{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:80%;padding:12px 16px;border-radius:12px;font-size:14.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--acc);color:#0b1626;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.cite{background:#16304a;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px;max-width:80%;align-self:flex-start;font-size:13px}
.cite b{color:var(--acc2);font-size:12px;display:block;margin-bottom:6px}
.cite .c{background:var(--bg2);border-left:3px solid var(--acc);padding:6px 10px;border-radius:0 6px 6px 0;margin:5px 0;cursor:pointer}
.cite .c .h{color:var(--acc2);font-size:13px;margin-bottom:2px}
.cite .c .b{color:var(--tx2);font-size:12.5px;line-height:1.7;white-space:pre-wrap}
/* 智能组装回答样式 */
.ans{display:flex;flex-direction:column;gap:10px}
.ans .lead{font-size:16px;font-weight:700;color:var(--acc2);border-bottom:1px solid var(--line);padding-bottom:8px}
.ans .p{font-size:14.5px;line-height:1.9}
.ans .frm{background:#12324e;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-family:Consolas,"Courier New",monospace;font-size:13.5px;color:#a8d4ff}
.ans .ex{background:#123322;border:1px solid #1f4d35;border-radius:8px;padding:8px 12px;font-size:13.5px;color:#b7e4c0}
.ans .sup{border-left:3px solid var(--acc);background:var(--bg2);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13.5px}
.ans .sup .h{color:var(--acc2);font-weight:600;margin-bottom:3px}
.ans .sup .b{color:var(--tx2);line-height:1.7}
.ans .rel{margin-top:4px;font-size:13px;color:var(--tx2)}
.ans .rel .q-chip{margin-top:6px}
.upgrade{font-size:12px;color:var(--warn);margin-top:8px}
/* DeepSeek 生成回答样式 */
.gen{display:flex;flex-direction:column;gap:8px}
.gen .thinking{color:var(--tx2);font-size:13px}
.gen .stream{font-size:14.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word}
.gen .stream b{color:var(--acc2)}
.gen .stream code{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:Consolas,monospace;font-size:13px}
.gen .stream pre{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;font-size:13px;line-height:1.6}
.gen .stream pre code{background:none;border:0;padding:0}
.gen .srcnote{font-size:12px;color:var(--tx2)}
.gen .srcnote b{color:var(--ok)}
.gen .srcnote.err b{color:#e05c5c}
.errmsg{color:#e05c5c;font-size:13px;margin-top:6px}
/* 设置面板 */
.mask{position:fixed;inset:0;background:rgba(6,12,20,.62);display:none;align-items:center;justify-content:center;z-index:50}
.mask.on{display:flex}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(480px,92vw)}
.panel h3{margin:0 0 6px;font-size:16px}
.panel .sub{color:var(--tx2);font-size:12.5px;line-height:1.7;margin-bottom:14px}
.panel input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:10px 12px;font-size:13.5px;outline:none;margin-bottom:12px;font-family:Consolas,monospace}
.panel input:focus{border-color:var(--acc)}
.panel .btns{display:flex;gap:8px}
.panel .btns button{flex:1}
.panel .btns button.ghost{flex:0 0 auto}
.ds-ok{color:var(--ok)}.ds-off{color:var(--warn)}
.inputbar{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg2)}
#q{flex:1;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:12px 14px;font-size:14.5px;outline:none}
#q:focus{border-color:var(--acc)}
button{background:var(--acc);color:#0b1626;border:0;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.1)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx2);font-weight:400}
#progress{height:4px;background:var(--line);border-radius:2px;overflow:visible;display:none;position:relative;z-index:9}#progText{position:absolute;top:9px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--acc);font-weight:600;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .3s}
.empty{color:var(--tx2);font-size:13.5px;line-height:1.9;text-align:center;padding:40px 20px}
footer{font-size:11px;color:#5e7290;text-align:center;padding:8px}
a{color:var(--acc2)}
@media(max-width:760px){aside{display:none}.msg{max-width:94%}.cite{max-width:94%}}
</style>

window.DATA = {"books":[{"key":"info-math","title":"信息安全数学基础（姜正涛）"},{"key":"crypto","title":"密码学——基础理论与应用（第2版）"},{"key":"websec","title":"Web安全程序设计与实践（第二版）"},{"key":"db","title":"数据库原理及应用教程（第5版·微课版）"},{"key":"coc","title":"计算机组成原理——基于MIPS结构"},{"key":"digital","title":"数字电子技术基础（第六版）"}],"items":[{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch6-group","ch":"第6章 群","tag":"代数结构","t":"群","answer":"群是一套\"有规矩的运算\"：一个集合配上一种运算，满足四条规则——封闭（算完还在集合里）、结合律、有单位元（像 0 或 1）、每个元素有逆元（能\"抵消\"回去）。满足交换律的叫交换群（阿贝尔群）。密码学最关心的是\"在一个群里做运算很难逆向\"，比如椭圆曲线上的点就构成一个群。","formula":"(G,·) 满足：封闭、结合、(a·e=e·a=a)、∀a∃a⁻¹","example":"例：整数 Z 配上加法是群（单位元 0，逆元是 −a）；正整数配上乘法不是群（没有逆元）。","keywords":["群","group","封闭","结合律","单位元","逆元","交换群","阿贝尔"],"related":["ch6-cycle","ch6-coset","ch9-finite","ch10-ecc"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch6-coset","ch":"第6章 群","tag":"代数结构","t":"子群、陪集与 Lagrange 定理","answer":"子群是\"群里面的小群\"：取一部分元素，它们自己仍满足群的规则。陪集就是\"用子群的元素去平移得到的集合\"。Lagrange 定理说：子群的大小一定能整除整个群的大小——这是群论最重要的计数结果。它的推论（元素阶整除群阶）直接就是费马小定理的群论版本。","formula":"H ≤ G ⇒ |H| ∣ |G|；aH = {ah | h∈H} 是左陪集","example":"","keywords":["子群","陪集","lagrange","拉格朗日","整除","群阶"],"related":["ch6-group","ch6-hom","ch2-fermat"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch6-hom","ch":"第6章 群","tag":"代数结构","t":"正规子群、商群与同态定理","answer":"正规子群是\"位置固定\"的子群（用任何元素平移它都回到自己）。有了它才能构造商群——把群\"折叠\"成更小的群。同态是两个群之间保持运算的映射，同态基本定理说\"群除以核等于像\"（G/ker φ ≅ im φ）。这套语言用于把复杂的密码结构约化成可分析的形式。","formula":"N ◁ G 时 G/N 是商群；G/ker φ ≅ im φ（第一同构定理）","example":"","keywords":["正规子群","商群","同态","同构","同态定理","kernel"],"related":["ch6-group","ch6-cycle"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch6-cycle","ch":"第6章 群","tag":"代数结构","t":"循环群","answer":"循环群是\"由一个元素反复运算就能生成整个群\"的群，那个元素叫生成元。有限循环群一定同构于整数加法群 Z_n，结构完全已知。密码学里选的群几乎都是循环群或它的子群（比如模 p 乘法群、椭圆曲线点群），因为结构清楚、容易验证安全性。","formula":"⟨g⟩ = {g⁰, g¹, g², …} 是循环群；有限循环群 ≅ Z_n","example":"例：Z₇ 的非零元素 {1,…,6} 配乘法是循环群，生成元是 3。","keywords":["循环群","生成元","cyclic","由g生成","循环"],"related":["ch6-group","ch4-prim","ch9-finite"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch7-ring","ch":"第7章 环","tag":"代数结构","t":"环","answer":"环是\"同时有加减乘\"的结构（不要求除法）。按性质分：交换环（乘法可交换）、含幺环（有 1）、整环（无零因子）、域（每个非零元都能除）。整数 Z 是最典型的环。密码学里，环是很多新密码的舞台：比如 NTRU 用多项式环，格密码用多项式商环。","formula":"(R,+,·)：加法成群，乘法满足结合与分配","example":"例：整数 Z、模 n 的剩余类 Z_n、多项式环 Z[x] 都是环。","keywords":["环","ring","交换环","整环","含幺","分配律"],"related":["ch7-zero","ch7-ideal","ch7-ntru"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch7-zero","ch":"第7章 环","tag":"代数结构","t":"零因子与环的特征","answer":"零因子是两个非零元素相乘却得到 0（如 2×3≡0 (mod 6)，2 和 3 都是模 6 的零因子）。没有零因子的环叫整环。环的特征是最小的 n 使 n 个 1 相加等于 0。关键事实：有限整环的特征一定是素数 p——这为有限域的构造埋下了伏笔（域的加法结构就来自这个素数 p）。","formula":"a·b = 0 且 a,b ≠ 0 ⇒ a、b 是零因子；有限整环的特征为素数","example":"例：模 6 的环有零因子 2、3；模 7 的环没有零因子（7 是素数）。","keywords":["零因子","特征","characteristic","整环无零因子"],"related":["ch7-ring","ch8-field","ch9-finite"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch7-ideal","ch":"第7章 环","tag":"代数结构","t":"理想与商环（*）","answer":"理想是环里\"吸收乘法\"的特殊子集：环里任何元素乘以理想里的元素，结果还在理想里。理想的作用和正规子群类似——可以用它造商环。特别重要的两种：主理想（由一个元素生成）、极大理想（商环变成域）。\"多项式环除以极大理想\"正是构造有限域的标准方法。","formula":"F[x]/(f(x)) 是域 ⇔ f(x) 是不可约多项式（极大理想）","example":"","keywords":["理想","ideal","商环","主理想","极大理想","素理想"],"related":["ch7-ring","ch9-construct"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch7-ntru","ch":"第7章 环","tag":"经典密码","t":"NTRU 公钥密码","answer":"NTRU 是\"抗量子计算\"的公钥密码候选：它工作在截断多项式环 Z[x]/(x^N−1) 上，加密解密就是多项式乘加，速度很快。它的安全不是靠\"分解大数\"，而是靠格上的难题（最短向量问题）——这类问题连量子计算机也拿它没办法。NIST 后量子标准中的 Kyber 等方案和它同属\"格密码\"家族。","formula":"R = Z[x]/(x^N − 1)，密文 = 公钥多项式 × 随机小多项式 + 消息","example":"","keywords":["ntru","格密码","后量子","多项式环","截断多项式","rlwe","kyber"],"related":["ch7-ring","ch7-ideal","ch12-npc"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch8-field","ch":"第8章 域","tag":"代数结构","t":"域","answer":"域是\"加减乘除都能做\"的结构：在环的基础上，每个非零元都有乘法逆元。有理数、实数、复数都是域。密码学关心的是\"有限域\"——元素个数有限但四则运算齐全的域（如模素数域 F_p）。域是有限域理论的母结构，AES、ECC、DH 的运算都发生在某个域上。","formula":"F 是域 ⇔ 非零元集合 F* 构成乘法群，且乘法对加法分配","example":"例：Q（有理数）、R、F_p（模素数）都是域；Z 不是域（除不尽）。","keywords":["域","field","除环","四则运算","有理数","实数"],"related":["ch7-ring","ch9-finite","ch8-poly"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch8-poly","ch":"第8章 域","tag":"代数结构","t":"域上的多项式与不可约多项式","answer":"在域 F 上，多项式像整数一样可以带余除法、求最大公因子、做扩展欧几里得。不可约多项式（不能再分解）扮演\"素数\"的角色：用它作模，多项式环除以它就得到一个域。判断多项式是否不可约、找到不可约多项式，是构造有限域的第一步。","formula":"F[x] 是主理想整环；f(x) 不可约 ⇒ F[x]/(f(x)) 是域","example":"","keywords":["多项式","不可约多项式","域上多项式","本原多项式"],"related":["ch8-field","ch9-construct"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch8-extension","ch":"第8章 域","tag":"代数结构","t":"域的扩张与单扩域","answer":"域的扩张就是\"在已有域上加新元素，得到更大的域\"。比如实数域上加入 √−1 得到复数域。单扩域 F(α) 是由加入一个元素 α 生成的扩张，它等价于多项式环除以 α 的极小多项式。密码学用这套理论从 F_p 出发构造 F_p^n——得到任意大小的有限域，AES 的 GF(2^8) 就是这样来的。","formula":"[K:F] = K 作为 F-向量空间的维数；F(α) ≅ F[x]/(f(x))","example":"","keywords":["域扩张","扩域","单扩域","代数扩张","分裂域","extension"],"related":["ch8-field","ch9-construct"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch9-finite","ch":"第9章 有限域","tag":"代数结构","t":"有限域 GF(pⁿ)","answer":"有限域是\"元素有限但四则运算齐全\"的域，也叫伽罗瓦域，记作 GF(pⁿ)。关键定理：有限域的元素个数必是素数幂 pⁿ，且同构意义下唯一。它的乘法群一定是循环群（一定有生成元）。现代密码几乎都跑在有限域上：AES 用 GF(2⁸)，ECC 和 DH 用大素数的 GF(p)。","formula":"|F| = pⁿ 且唯一（同构意义）；GF(pⁿ)* 是 pⁿ−1 阶循环群","example":"","keywords":["有限域","gf","galois","伽罗瓦","特征","p的n次方","gf2"],"related":["ch9-construct","ch9-dh","ch8-field"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch9-construct","ch":"第9章 有限域","tag":"代数结构","t":"有限域的构造","answer":"构造有限域 GF(pⁿ) 的方法是：在 F_p 上找一个 n 次不可约多项式 f(x)，然后取\"模 f 的多项式集合\"。元素是有 n 个系数的多项式，乘法是\"先乘再对 f 取余\"。比如 AES 的运算域 GF(2⁸) 就是用 x⁸+x⁴+x³+x+1 这个不可约多项式构造的。","formula":"GF(pⁿ) ≅ F_p[x]/(f(x))，f(x) 是 n 次不可约多项式","example":"例：GF(2³) 可用 f=x³+x+1 构造，8 个元素是 0,1,x,x+1,…,x²+x+1。","keywords":["构造有限域","不可约多项式构造","模多项式","gf(2^8)","aes域"],"related":["ch9-finite","ch8-poly","ch9-aes"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch9-primpoly","ch":"第9章 有限域","tag":"代数结构","t":"本原多项式","answer":"本原多项式是\"根能生成整个乘法群\"的不可约多项式：它的根的阶达到最大 pⁿ−1。它的用处很大——用本原多项式构造的有限域，乘法群由一个元素完全覆盖；它还是 LFSR 能产生最长周期序列（m 序列）的判据（见第11章）。","formula":"f 本原 ⇔ 其根的阶 = pⁿ − 1","example":"","keywords":["本原多项式","primitive polynomial","生成元多项式","原根多项式"],"related":["ch9-construct","ch11-lfsr","ch4-prim"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch9-dh","ch":"第9章 有限域","tag":"经典密码","t":"Diffie-Hellman 密钥协商","answer":"Diffie-Hellman（DH）让两个人隔着不安全网络也能共同商量出一个秘密密钥。做法：公开素数 p 和生成元 g；Alice 选私密数 a 发出 g^a，Bob 选 b 发出 g^b；两人各自计算 (g^b)^a 和 (g^a)^b，得到同一个 g^(ab) 作为共享密钥。窃听者只看到 g、g^a、g^b，却算不出 g^ab——这就是离散对数难题。","formula":"共享密钥 = g^(ab) = (g^a)^b = (g^b)^a (mod p)","example":"","keywords":["diffie","hellman","dh","密钥协商","密钥交换","共享密钥","g的ab次方"],"related":["ch4-dlog","ch9-finite","ch10-ecdh"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch9-aes","ch":"第9章 有限域","tag":"经典密码","t":"AES 中的有限域运算","answer":"AES（高级加密标准）整个就是一台\"有限域机器\"：每个字节看成 GF(2⁸) 里的一个元素。S 盒 = 在 GF(2⁸) 里求乘法逆元再做个仿射变换（非线性就来自求逆）；列混合 = 列向量在 GF(2⁸) 上与固定多项式相乘。理解了有限域，就理解了 AES 为什么这样设计。","formula":"GF(2⁸) = GF(2)[x]/(x⁸+x⁴+x³+x+1)；S盒 = 逆元 + 仿射变换","example":"","keywords":["aes","s盒","sbox","列混合","mixcolumns","字节运算","高级加密"],"related":["ch9-construct","ch9-finite","ch8-extension"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch10-ec","ch":"第10章 有限域上的椭圆曲线","tag":"代数结构","t":"椭圆曲线","answer":"椭圆曲线是满足特定方程的点组成的曲线（不是椭圆！名字来自计算椭圆周长的积分）。密码学用有限域上的椭圆曲线：曲线上的点（连同\"无穷远点\"）构成一个群。它最大的价值是：在同样的安全强度下，椭圆曲线密钥比 RSA 短得多——256 位椭圆曲线 ≈ 3072 位 RSA。","formula":"y² = x³ + ax + b（判别式 Δ ≠ 0）＋ 无穷远点 O","example":"","keywords":["椭圆曲线","weierstrass","weierstrass方程","ec","曲线"],"related":["ch10-ecadd","ch10-ecdlp","ch10-ecc"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch10-ecadd","ch":"第10章 有限域上的椭圆曲线","tag":"代数结构","t":"椭圆曲线的群加法","answer":"椭圆曲线上的点有自己的一套\"加法\"：过两点 P、Q 作直线，与曲线交于第三点，取它关于 x 轴的对称点就是 P+Q（P=Q 时用切线）。这套加法让曲线上的点构成一个群，单位元是无穷远点。反复加同一个点 P 就得到\"标量乘法\" k·P——正算快，逆算（由 P、kP 求 k）难，这正是椭圆曲线密码的根基。","formula":"P+Q 用弦切法定义；k·P 用 double-and-add 快速计算","example":"","keywords":["点加","倍点","群加法","弦切法","scalar","标量乘法"],"related":["ch10-ec","ch10-ecdlp","ch10-ecc"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch10-ecdlp","ch":"第10章 有限域上的椭圆曲线","tag":"代数结构","t":"椭圆曲线离散对数（ECDLP）","answer":"椭圆曲线离散对数问题是：已知曲线上两点 P 和 kP，求 k。目前没有任何亚指数算法能解它，比普通离散对数（在数域筛法面前更顽强）更难。正因为\"正算容易逆算难\"，ECDH 密钥协商、ECDSA 签名才能安全。这是 ECC 安全性假设的核心。","formula":"已知 P、kP ∈ E(F_p)，求 k ⇒ ECDLP，目前无亚指数算法","example":"","keywords":["ecdlp","椭圆曲线离散对数","椭圆曲线难题"],"related":["ch10-ec","ch10-ecadd","ch4-dlog"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch10-ecc","ch":"第10章 有限域上的椭圆曲线","tag":"经典密码","t":"椭圆曲线密码（ECC / ECDH / ECDSA / SM2）","answer":"椭圆曲线密码（ECC）是公钥密码的主流：ECDH 做密钥协商（双方共享曲线上同一个点），ECDSA 做数字签名（区块链、TLS 都在用），SM2 是我国国密的椭圆曲线标准。优势是密钥短、速度快、带宽省。比特币/以太坊的地址体系也建立在椭圆曲线密码之上。","formula":"私钥 k（随机大数），公钥 Q = k·G（G 是基点）","example":"","keywords":["ecc","ecdh","ecdsa","sm2","椭圆曲线密码","数字签名","ed25519","比特币地址","钱包"],"related":["ch10-ec","ch10-ecdlp","ch9-dh"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch1-div","ch":"第1章 整数的整除与唯一分解","tag":"数论基础","t":"整除与带余除法","answer":"整除就是\"一个整数能正好被另一个整数除尽\"。比如 12 能被 3 整除，因为 12=3×4；但 12 不能被 5 整除。带余除法说的是：任何整数 a 除以 b，都能唯一地写成\"商 × 除数 + 余数\"的形式，而且余数一定比除数小。这个看似简单的事实是所有整数运算的地基。","formula":"a = qb + r，其中 0 ≤ r &lt; |b|（q 是商，r 是余数）","example":"例：17 ÷ 5 = 3 余 2，即 17 = 3×5 + 2。","keywords":["整除","带余除法","余数","商","除法"],"related":["ch1-gcd","ch1-unique","ch2-congruence"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch1-gcd","ch":"第1章 整数的整除与唯一分解","tag":"数论基础","t":"最大公因子与辗转相除法","answer":"最大公因子（gcd）是两个数共有的最大因子，例如 gcd(12,18)=6。辗转相除法（欧几里得算法）是求 gcd 的高效方法：反复用\"大的减小的取余数\"，直到余数为 0。它还有个\"加强版\"（扩展欧几里得），能同时算出系数 x、y 使 ax+by=gcd(a,b)——这正是求\"模逆元\"的工具，而模逆元是 RSA 等密码算法的核心运算。","formula":"gcd(a,b) = gcd(b, a mod b)；扩展：ax + by = gcd(a,b)","example":"例：gcd(48,18)：48=2×18+12，18=1×12+6，12=2×6+0 → gcd=6。","keywords":["最大公因子","最大公约数","gcd","辗转相除","欧几里得","互素","互质","模逆"],"related":["ch1-div","ch2-inverse","ch2-rsa"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch1-unique","ch":"第1章 整数的整除与唯一分解","tag":"数论基础","t":"算术基本定理（唯一分解）","answer":"算术基本定理说：任何大于 1 的整数，都能唯一地写成若干个素数相乘（不计顺序）。比如 60 = 2²×3×5，只有这一种分解。这个定理保证了\"分解是唯一的\"，也正因如此，把一个大合数分解回素数才成为密码学里的\"困难问题\"——RSA 的安全性就建立在\"大数分解很难、但验证很容易\"上。","formula":"n = p₁^e₁ · p₂^e₂ · … · pₖ^eₖ（唯一，不计顺序）","example":"例：300 = 2² × 3 × 5²。","keywords":["算术基本定理","唯一分解","质因数分解","素因数","因子分解","分解"],"related":["ch1-prime","ch2-rsa"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch1-prime","ch":"第1章 整数的整除与唯一分解","tag":"数论基础","t":"素数、梅森数与费马数","answer":"素数是只能被 1 和自身整除的大于 1 的整数，如 2、3、5、7。欧几里得证明了素数有无穷多个。两个特殊的素数家族在密码与计算机中有用：梅森数 M=2^p−1（p 为素数，常用来找超级大的素数），费马数 F=2^(2^n)+1（与正多边形作图相关）。","formula":"梅森数 M_p = 2^p − 1；费马数 F_n = 2^(2ⁿ) + 1","example":"例：M₃=7、M₅=31 都是素数；F₀=3、F₁=5、F₂=17 都是素数。","keywords":["素数","质数","梅森","费马数","无穷多","素数定理"],"related":["ch1-unique","ch5-test"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch2-inverse","ch":"第1/2章 同余式","tag":"数论基础","t":"模逆元（扩展欧几里得）","answer":"模逆元是\"模算术里的倒数\"：若 a×x ≡ 1 (mod m)，则 x 是 a 模 m 的逆元，记作 a⁻¹。它存在的条件是 a 与 m 互素。求模逆元的标准方法是扩展欧几里得算法（也可以用费马小定理）。RSA 生成私钥、解密、以及几乎所有公钥密码里都要反复用到模逆元。","formula":"a · a⁻¹ ≡ 1 (mod m)，当且仅当 gcd(a,m)=1 时存在","example":"例：3 模 7 的逆是 5，因为 3×5=15≡1 (mod 7)。","keywords":["模逆","逆元","扩展欧几里得","a的逆","模倒数"],"related":["ch1-gcd","ch2-rsa","ch2-congruence"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch2-congruence","ch":"第2章 同余式","tag":"数论基础","t":"同余","answer":"同余是\"余数相同\"的数学写法：如果两个数除以 m 余数相同，就称它们模 m 同余，写成 a ≡ b (mod m)。比如 17 和 5 除以 6 都余 5，所以 17 ≡ 5 (mod 6)。同余的好处是：加、减、乘都可以\"先取模再算\"，结果不变——这让大数运算可以拆成小块计算，是密码学里所有计算的基本方式。","formula":"m ∣ (a−b) ⇔ a ≡ b (mod m)；同余式满足加减乘的相容性","example":"例：17 ≡ 5 (mod 6)，两边同乘 3：51 ≡ 15 (mod 6) 依然成立。","keywords":["同余","模","mod","整除的余数","同余式"],"related":["ch2-class","ch2-euler","ch2-crt"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch2-class","ch":"第2章 同余式","tag":"数论基础","t":"剩余类","answer":"剩余类就是把\"余数相同的数\"归成一类。模 m 一共恰好有 m 个剩余类（余数 0 到 m−1）。从每个类各取一个数组成的集合叫完全剩余系；只取与 m 互素的类组成的叫既约剩余系。既约剩余系的大小就是欧拉函数 φ(m)，它是理解\"乘法群\"和 RSA 密钥空间的入口。","formula":"模 m 有 m 个剩余类；既约剩余系含 φ(m) 个元素","example":"例：模 4 的剩余类是 {0,1,2,3}；既约剩余系是 {1,3}（与 4 互素），φ(4)=2。","keywords":["剩余类","剩余系","完全剩余系","既约剩余系","同余类"],"related":["ch2-congruence","ch2-euler"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch2-euler","ch":"第2章 同余式","tag":"数论基础","t":"欧拉函数 φ(n)","answer":"欧拉函数 φ(n) 统计 1 到 n 之间与 n 互素的整数个数。比如 φ(10)=4（1、3、7、9）。它有两条关键性质：φ(p)=p−1（素数），φ(pq)=(p−1)(q−1)（两个不同素数之积）。RSA 的密钥空间、加密解密正确性，全都由欧拉函数决定。","formula":"φ(p) = p−1；φ(pq) = (p−1)(q−1)；φ 是积性函数","example":"例：n=15=3×5，φ(15)=(3−1)(5−1)=8，即 1~15 中与 15 互素的数有 8 个。","keywords":["欧拉函数","phi","φ","欧拉","互素个数"],"related":["ch2-congruence","ch2-class","ch2-rsa"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch2-fermat","ch":"第2章 同余式","tag":"数论基础","t":"费马小定理与费马-欧拉定理","answer":"费马小定理说：如果 p 是素数且 a 不被 p 整除，那么 a 的 p−1 次方除以 p 余 1。推广到任意模 n（a 与 n 互素时）就是费马-欧拉定理：a^φ(n) ≡ 1 (mod n)。它有两个大用处：快速计算模幂（先降指数），以及证明 RSA 加解密\"绕一圈能还原\"。它还是很多素性检测方法的出发点。","formula":"a^(p−1) ≡ 1 (mod p)（p 素数）；a^φ(n) ≡ 1 (mod n)（gcd(a,n)=1）","example":"例：p=7，2^6=64≡1 (mod 7) 成立。","keywords":["费马小定理","费马","欧拉定理","a的p-1","费马欧拉"],"related":["ch2-euler","ch2-rsa","ch5-psp"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch2-crt","ch":"第2章 同余式","tag":"数论基础","t":"中国剩余定理（CRT）","answer":"中国剩余定理解决\"一组同余方程\"：已知一个数除以 m₁ 余 a₁、除以 m₂ 余 a₂……在模数两两互素时，这个数在模 M（所有 m 的乘积）下存在且唯一。它最早见于中国古代《孙子算经》\"物不知数\"问题。现实中它最著名的用途是加速 RSA 解密——把模 n 的大运算拆成模 p 和模 q 的小运算，速度能提升好几倍。","formula":"x ≡ Σ aᵢ·Mᵢ·Mᵢ⁻¹ (mod M)，Mᵢ = M/mᵢ","example":"例：x≡2 (mod 3)，x≡3 (mod 5)。x=8 满足：8÷3 余 2，8÷5 余 3。","keywords":["中国剩余定理","crt","孙子定理","同余方程组","一次同余组"],"related":["ch2-congruence","ch2-rsa"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch2-rsa","ch":"第2章 同余式","tag":"经典密码","t":"RSA 公钥密码","answer":"RSA 是最经典的公钥密码：加密用公钥，解密用私钥，两者不同。做法是选两个大素数 p、q，令 n=pq，再选加密指数 e，求解密指数 d 使 ed≡1 (mod φ(n))。公钥是 (n,e)，私钥是 d。别人能加密但只有你能解密，因为从 n 反推出 p、q（即分解 n）在计算上做不到。它的正确性靠费马-欧拉定理保证。","formula":"加密 c ≡ m^e (mod n)；解密 m ≡ c^d (mod n)；ed ≡ 1 (mod φ(n))","example":"例（教学用）：p=11，q=13 → n=143，φ=120，取 e=7，d=103。明文 m=42 → 密文 c=42⁷ mod 143=81 → 解密 81¹⁰³ mod 143=42。","keywords":["rsa","公钥密码","公钥","私钥","加密","解密","数字签名","签名","大数分解","非对称"],"related":["ch2-euler","ch2-inverse","ch2-crt","ch12-npc"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch3-residue","ch":"第3章 二次剩余","tag":"数论进阶","t":"二次剩余","answer":"二次剩余就是\"在模 p 下能开平方的数\"：如果 x² ≡ a (mod p) 有解，a 就是模 p 的二次剩余。比如模 7 下，1²=1、2²=4、3²=2，所以 1、2、4 是二次剩余，其余 3、5、6 不是。恰有一半（(p−1)/2 个）是二次剩余。它和\"求平方根\"的难度差异，被用在 Rabin 密码等方案中。","formula":"a 是二次剩余 ⇔ ∃x：x² ≡ a (mod p)","example":"例：模 7 的二次剩余是 {1,2,4}。","keywords":["二次剩余","平方剩余","平方根","二次同余"],"related":["ch3-legendre","ch3-rabin"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch3-legendre","ch":"第3章 二次剩余","tag":"数论进阶","t":"勒让德符号与欧拉判别准则","answer":"勒让德符号 (a/p) 是判断 a 是不是模 p 二次剩余的\"快捷记号\"：是剩余记为 1，不是记为 −1，a 被 p 整除记为 0。欧拉判别准则给出了计算方法：算 a^((p−1)/2) 模 p，结果正好就是 (a/p)。它把一个\"开平方问题\"变成了\"快速幂问题\"，在很多密码协议里是标准操作。","formula":"(a/p) ≡ a^((p−1)/2) (mod p)，取值 1 或 −1","example":"例：判断 5 是否是模 7 的二次剩余：5³=125≡6≡−1 (mod 7)，所以不是。","keywords":["勒让德","legendre","欧拉判别","二次互反","判别准则"],"related":["ch3-residue","ch3-recip","ch3-rabin"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch3-recip","ch":"第3章 二次剩余","tag":"数论进阶","t":"二次互反律与雅可比符号","answer":"二次互反律是数论的\"皇冠明珠\"：它把\"p 模 q 的二次剩余\"和\"q 模 p 的二次剩余\"联系起来，让判断二次剩余变得非常快（不用分解因子）。雅可比符号把这个记号从素数推广到合数模，但有个\"陷阱\"：雅可比符号为 1 不代表一定是二次剩余。这个陷阱反而被利用来设计素性检测（Solovay-Strassen）。","formula":"(p/q)·(q/p) = (−1)^((p−1)(q−1)/4)（p、q 为奇素数）","example":"","keywords":["二次互反律","互反律","雅可比","jacobi"],"related":["ch3-legendre","ch5-psp"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch3-rabin","ch":"第3章 二次剩余","tag":"经典密码","t":"Rabin 公钥密码","answer":"Rabin 密码是 RSA 的\"近亲\"：加密就是把明文平方，c ≡ m² (mod n)，公钥只有 n，加密速度快到极致。解密要开平方根，在合数模下开方会产生 4 个候选答案，需要靠消息里的冗余信息挑出正确的一个。它的特别之处在于：数学上已严格证明\"破解 Rabin = 分解 n\"，安全性承诺比 RSA 更硬。","formula":"加密 c ≡ m² (mod n)；解密 = 求 4 个平方根 + 按冗余选出明文","example":"","keywords":["rabin","平方加密","开方","平方根加密"],"related":["ch3-residue","ch2-rsa","ch3-legendre"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch4-order","ch":"第4章 原根与阶","tag":"数论进阶","t":"阶（模运算的循环周期）","answer":"阶描述的是\"一个数在模运算下多久循环一次\"：a 模 m 的阶是使 a^k ≡ 1 (mod m) 的最小正整数 k。比如 2 模 7 的阶是 3，因为 2¹=2、2²=4、2³=8≡1，到第 3 次才回到 1。阶一定整除 φ(m)。阶的概念是理解原根、循环群和离散对数的第一步。","formula":"ord_m(a) = 最小的 k &gt; 0 使 a^k ≡ 1 (mod m)；且 ord_m(a) ∣ φ(m)","example":"例：3 模 7 的阶是 6：3¹=3,3²=2,3³=6,3⁴=4,3⁵=5,3⁶=1。","keywords":["阶","order","周期","ord","最小指数"],"related":["ch4-prim","ch4-dlog"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch4-prim","ch":"第4章 原根与阶","tag":"数论进阶","t":"原根","answer":"原根是\"阶最大\"的数：它的阶等于 φ(m)，也就是说它的幂能生成所有与 m 互素的数。比如 3 是模 7 的原根，因为 3 的各次幂 3,2,6,4,5,1 正好覆盖 1 到 6。有原根的模只有 1、2、4、p^k、2p^k 这几类。原根保证了密钥空间\"铺满\"，是 Diffie-Hellman 等协议能安全运行的前提。","formula":"g 是模 m 的原根 ⇔ ord_m(g) = φ(m)，且 g 的幂遍历全部既约剩余系","example":"例：3 是模 7 的原根（3⁶=1 且 3¹~3⁶ 互不相同）；2 不是（阶只有 3）。","keywords":["原根","primitive","生成元","generator","本原"],"related":["ch4-order","ch4-dlog","ch9-dh"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch4-dlog","ch":"第4章 原根与阶","tag":"数论进阶","t":"离散对数（DLP）","answer":"离散对数就是\"模运算里的对数\"：已知底 g 和结果 y，求指数 x 使 g^x ≡ y (mod m)。正向算 g^x 很容易（快速幂），但反过来由 y 求 x 目前没有任何高效算法——这就是著名的\"单向性\"。Diffie-Hellman、ElGamal、DSA 这些密码全都建立在\"离散对数难解\"这个假设上。","formula":"y = g^x (mod m)，x = log_g(y) 称为离散对数","example":"例：模 7 下 3^x ≡ 6 的解是 x=3（因为 3³=27≡6），这个 3 就是离散对数。","keywords":["离散对数","dlog","dlp","指数","对数"],"related":["ch4-prim","ch9-dh","ch12-npc"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch5-test","ch":"第5章 素性检测","tag":"数论进阶","t":"素性检测（试除与确定性方法）","answer":"素性检测是判断一个大数\"是不是素数\"。最朴素的是试除法：从 2 试到 √n，能整除就是合数——正确但对大数慢到不可用。确定性方法（如 Pocklington、Lucas-Lehmer）利用 n−1 的部分分解能给出\"确定证明\"，但需要额外信息。密码学里生成大素数时，实际用的是概率检测（见 Miller-Rabin）加确定性兜底。","formula":"试除法：检查 2 到 √n 的所有整数","example":"","keywords":["素性检测","素数判定","试除法","确定性","判定素数","素数测试"],"related":["ch5-mr","ch5-psp","ch5-aks"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch5-psp","ch":"第5章 素性检测","tag":"数论进阶","t":"费马伪素数（拟素数）与 Carmichael 数","answer":"费马小定理说素数一定满足 a^(n−1)≡1 (mod n)，反过来用：如果不满足就一定是合数；但满足了却不一定是素数——这种\"欺骗\"费马检测的合数叫伪素数。更麻烦的是 Carmichael 数（如 561）：它对所有底 a 都满足费马条件，彻底骗过费马检测。所以费马检测不能单独使用，要用更强的 Miller-Rabin。","formula":"a^(n−1) ≡ 1 (mod n) 但 n 是合数 ⇒ n 是底 a 的伪素数","example":"例：341 = 11×31 是合数，但 2³⁴⁰ ≡ 1 (mod 341)，是伪素数。","keywords":["伪素数","拟素数","carmichael","卡迈克尔","费马检测","伪素数检测"],"related":["ch5-test","ch5-mr","ch2-fermat"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch5-mr","ch":"第5章 素性检测","tag":"数论进阶","t":"Miller-Rabin 素性检测","answer":"Miller-Rabin 是目前生成大素数的事实标准。它把 n−1 写成 2^s·t（t 为奇数），检查 a^t、a^(2t)、a^(4t)…这一串数是否出现 1 或 −1 的特定模式。合数通过一次随机检测的概率不超过 1/4，做 k 次后误判率 ≤ 4^(−k)。它快、随机、实用——RSA 生成密钥时就用它反复筛掉合数。","formula":"k 次随机底测试后：合数误判概率 ≤ 4^(−k)","example":"","keywords":["miller","rabin","强伪素数","强素性检测","概率检测","米勒"],"related":["ch5-psp","ch5-test","ch5-aks","ch2-rsa"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch5-aks","ch":"第5章 素性检测","tag":"数论进阶","t":"AKS 素性检测（*）","answer":"AKS（2002 年）是第一个\"无条件多项式时间\"的确定性素性判定算法，从理论上证明了素性判定属于 P 类问题——不需要任何未证假设，也绝无误判。它主要解决理论问题；因为常数因子太大，工程上仍用 Miller-Rabin 这类概率方法。","formula":"","example":"","keywords":["aks","多项式时间","确定性素性","agrawal"],"related":["ch5-mr","ch12-pnp"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch11-lfsr","ch":"第11章 线性反馈移位寄存器","tag":"序列与流密码","t":"线性反馈移位寄存器（LFSR）","answer":"LFSR 是流密码的\"心脏\"：一个 n 位寄存器，每拍把最右边一位作为输出，同时按固定的异或规则算一个新位填进左边。它硬件极简、速度快。缺点也很致命：输出序列有线性结构，数学家 Berlekamp-Massey 只需要连续 2n 个输出位就能完全重构它——所以纯 LFSR 不能直接当密码用，必须加非线性部件。","formula":"s_(t+n) = c0*s_t xor c1*s_(t+1) xor ... xor c_(n-1)*s_(t+n-1)","example":"","keywords":["lfsr","移位寄存器","反馈","线性反馈","流密码","序列"],"related":["ch11-mseq","ch11-bm","ch11-snow","ch9-primpoly"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch11-mseq","ch":"第11章 线性反馈移位寄存器","tag":"序列与流密码","t":"m 序列与特征多项式","answer":"LFSR 输出序列的周期由它的特征多项式决定。当特征多项式是\"本原多项式\"时，序列达到最大周期 2 的 n 次方减 1，这样的序列叫 m 序列。m 序列有很好的统计性质（0/1 平衡、游程分布合理、自相关尖锐），\"看起来\"很随机——但随机性好不等于安全，它依然是线性的、可预测的。","formula":"f(x) 本原，则输出序列周期 = 2^n - 1（m 序列）","example":"","keywords":["m序列","特征多项式","最大长度序列","本原多项式lfsr","周期"],"related":["ch11-lfsr","ch9-primpoly"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch11-bm","ch":"第11章 线性反馈移位寄存器","tag":"序列与流密码","t":"Berlekamp-Massey 算法（线性复杂度）","answer":"BM 算法是流密码分析的\"杀手锏\"：给定一个序列的连续 2L 个比特，它能反推出产生这个序列的最短 LFSR（长度 L）。这意味着任何\"纯线性\"的序列都可以被完全预测——这直接判了纯 LFSR 的死刑。密码设计者的对策是让序列的线性复杂度 L 大到天文数字（用非线性组合），让 BM 算法需要不切实际的连续比特数。","formula":"连续 2L 个比特，即可重构线性复杂度为 L 的 LFSR","example":"","keywords":["berlekamp","massey","bm算法","线性复杂度","重构序列","可预测"],"related":["ch11-lfsr","ch11-snow","ch12-pnp"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch11-snow","ch":"第11章 线性反馈移位寄存器","tag":"序列与流密码","t":"流密码与 SNOW 算法","answer":"流密码的思想是\"生成一串伪随机密钥流，和明文逐位异或\"。SNOW 3G 是 3G/4G 移动通信标准里的流密码：它用 16 级 LFSR 提供长周期和速度，再接一个有限状态机提供非线性——两者结合就避开了 BM 算法。同类的还有 GSM 的 A5/1、轻量级标准 Trivium。","formula":"密钥流 XOR 明文 = 密文；LFSR（快）+ 非线性 FSM（安全）","example":"","keywords":["流密码","snow","snow3g","a5","trivium","密钥流","序列密码"],"related":["ch11-lfsr","ch11-bm","ch11-mseq"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch12-pnp","ch":"第12章 计算复杂度","tag":"理论与安全","t":"P 与 NP 问题","answer":"计算复杂度用\"输入变大时，运算量怎么涨\"来给问题分类：P 类 = 能在多项式时间内解出（简单，如排序）；NP 类 = 解出来难，但给个答案能快速验证（如大数分解：分解很难，但验证\"这确实是因子\"很容易）。密码学最关心的就是\"NP 类里那些难解的问题\"，比如大整数分解和离散对数。","formula":"P 包含于 NP；P != NP 尚未证明，但密码学依赖难解问题的假设","example":"","keywords":["p问题","np问题","np","p和np","p与np","多项式时间","pnp","复杂度类","图灵机"],"related":["ch12-npc","ch2-rsa","ch4-dlog"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch12-npc","ch":"第12章 计算复杂度","tag":"理论与安全","t":"NPC 与 NP-hard（最难的问题）","answer":"NPC（NP 完全）是 NP 里\"最难\"的一族：只要其中一个能被快速解出，整个 NP 类都能快速解出。典型的 NPC 问题有 SAT（逻辑公式可满足性）、子集和、背包、图着色等。密码学从中汲取教训：Merkle-Hellman 背包密码曾被设计成基于 NPC 的背包问题，结果被格攻击破解——说明\"最坏情形难\"不等于\"能当密码用\"。","formula":"Cook-Levin 定理：SAT 是第一个 NPC 问题；NPC 属于 NP-hard","example":"","keywords":["npc","np完全","np困难","sat","3sat","归约","cook","背包","子集和"],"related":["ch12-pnp","ch12-knapsack"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch12-knapsack","ch":"第12章 计算复杂度","tag":"理论与安全","t":"背包公钥密码（Merkle-Hellman）","answer":"Merkle-Hellman 背包密码是公钥密码早期尝试：私钥是一个\"超递增序列\"（每项大于前面所有项之和），加密就是把消息映射成子集和。它曾被认为基于 NPC 的背包问题而安全，但 1982 年 Shamir 用格基约化算法攻破了——\"伪装\"后的公钥泄漏了私钥结构。教训：安全问题必须建立在有充分证据的困难性假设上。","formula":"","example":"","keywords":["背包密码","merklehellman","hellman背包","超递增","shamir","格攻击","lll"],"related":["ch12-npc","ch12-pnp","ch7-ntru"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch13-graph","ch":"第13章 图论","tag":"理论与安全","t":"图论基础","answer":"图就是\"点和连线\"的抽象：顶点表示对象，边表示关系。图论给密码学提供工具：邻接矩阵可以算路径数，连通性刻画网络的健壮性，Dijkstra 算法求最短路径（用于网络路由）。更重要的，二叉树的结构是 Merkle 树签名的基础。","formula":"握手定理：所有顶点的度之和 = 2|E|","example":"","keywords":["图论","图","顶点","边","邻接矩阵","连通","最短路","dijkstra"],"related":["ch13-tree","ch13-merkle"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch13-tree","ch":"第13章 图论","tag":"理论与安全","t":"树与二叉树","answer":"树是\"连通且没有圈\"的图，二叉树是每个节点最多两个孩子的树。树在密码中的意义：n 个节点的树需要 n-1 条边，深度和平衡性决定查找/聚合的代价。哈希树（Merkle 树）正是利用二叉树结构把海量数据压缩成一个根哈希——区块链和文件完整性校验都在用它。","formula":"树：n 个顶点 n-1 条边；二叉树深度不小于 log2(n+1) 减 1","example":"","keywords":["树","二叉树","生成树","遍历","哈希树"],"related":["ch13-graph","ch13-merkle"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch13-merkle","ch":"第13章 图论","tag":"理论与安全","t":"Merkle 树与哈希树签名","answer":"Merkle 树把大量数据的哈希两两合并成一棵树，根哈希代表全部数据，验证任何一块数据只需要\"从叶子到根的兄弟节点路径\"。基于它的 Merkle 签名方案：先用一次性签名（Lamport）签一条消息，再用树把海量一次性公钥聚合成一个根公钥。它只用哈希函数，抗量子计算，是后量子签名（XMSS、SPHINCS+）的源头。","formula":"根 = Hash(Hash(h1,h2), Hash(h3,h4))...；认证路径长 = 树高","example":"","keywords":["merkle树","哈希树","merkle签名","lamport","一次性签名","认证路径","xMSS","sphincs"],"related":["ch13-tree","ch13-graph","ch11-snow"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch14-entropy","ch":"第14章 信息论与编码","tag":"理论与安全","t":"信息熵","answer":"信息熵衡量\"不确定性\"或\"平均信息量\"：一个事件越不确定（概率越均匀），熵越大。均匀的 2 选 1 的熵是 1 比特；k 位均匀随机密钥的熵就是 k 比特。熵是压缩的极限（香农第一定理：任何无损压缩至少需要熵这么长的码），也是理解\"密钥空间多大才算安全\"的基础。","formula":"H(X) = - sum p(x) log2 p(x)；均匀分布时 H = log2 n","example":"","keywords":["熵","entropy","信息量","自信息","香农","shannon","不确定性"],"related":["ch14-mutual","ch15-perfect","ch14-channel"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch14-mutual","ch":"第14章 信息论与编码","tag":"理论与安全","t":"条件熵与互信息","answer":"条件熵 H(X|Y) 是\"已知 Y 之后 X 还剩多少不确定性\"，互信息 I(X;Y) 是\"观测 Y 平均获得多少关于 X 的信息\"（= H(X) - H(X|Y)）。互信息为 0 表示完全独立、没有泄漏；互信息越大，越能从一个推知另一个。密码学用它精确度量\"密文泄漏了多少明文信息\"——完善保密性就是互信息为 0。","formula":"I(X;Y) = H(X) - H(X|Y) >= 0，等号当且仅当 X、Y 独立","example":"","keywords":["条件熵","互信息","联合熵","相关","信息泄漏"],"related":["ch14-entropy","ch15-perfect"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch14-channel","ch":"第14章 信息论与编码","tag":"理论与安全","t":"信道容量与信源编码","answer":"信道容量是\"信道能可靠传输的最大信息率\"，比如二进制对称信道的容量是 1-H(p)（p 是误码率）。香农第一定理（无失真信源编码定理）说：无损压缩的极限就是熵——任何编码的平均码长不小于 H(X)，Huffman 编码就是逼近这个极限的经典方法。这套理论是通信与加密压缩的基石。","formula":"C = max I(X;Y)；无损压缩下界 = H(X)","example":"","keywords":["信道容量","信源编码","香农第一定理","huffman","压缩","可靠传输"],"related":["ch14-entropy","ch14-mutual"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch15-perfect","ch":"第15章 信息论与保密","tag":"理论与安全","t":"完善保密性（OTP 一次性密码本）","answer":"完善保密性是\"信息论意义上绝对安全\"：密文不泄漏明文的任何信息——窃听者拿到密文和没拿到一样。香农证明要达到它，密钥长度必须大于等于明文长度。唯一达到完善保密性的实用方案是一次性密码本（OTP）：用和明文等长的随机密钥逐位异或，且密钥只用一次。代价是密钥管理太贵，实际只用于极高安全场景（如量子密钥分发后的加密）。","formula":"I(M;C) = 0，即 H(M|C) = H(M)；密钥熵 >= 明文熵","example":"例：密钥 1010 与明文 1100 异或得密文 0110；若密钥均匀随机且只用一次，密文无法泄漏任何明文信息。","keywords":["完善保密","绝对安全","otp","一次性密码本","一次性便签","信息论安全","香农保密"],"related":["ch14-mutual","ch15-distance","ch14-entropy"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"ch15-distance","ch":"第15章 信息论与保密","tag":"理论与安全","t":"唯一解距离","answer":"唯一解距离回答\"多少个密文字符才够破译\"：n0 = H(K)/D，H(K) 是密钥熵，D 是明文语言的冗余度。拿到 n0 个字符之后，原则上只有唯一一个密钥能产生\"有意义\"的明文，密码就\"原则上可破\"了。英文的冗余度较高，所以经典密码的唯一解距离通常只有二三十个字符。这解释了为什么先压缩（降低冗余）再加密会更安全。","formula":"n0 = H(K) / D（D = 明文冗余度）","example":"","keywords":["唯一解距离","unicity","冗余度","破译所需密文","密钥熵"],"related":["ch15-perfect","ch14-entropy"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"chx-why","ch":"全书导览","tag":"综合","t":"为什么密码学需要数学","answer":"一句话：密码学的一切安全性，都建立在\"某些数学问题很难反过来算\"上。全书的主线就是这些困难问题背后的数学——数论给出 RSA 和离散对数，代数结构（群环域）统一描述密码运算的舞台，有限域和椭圆曲线支撑 AES 与 ECC，复杂度理论定义\"难\"的精确含义，信息论给出\"绝对安全\"的判据。理解数学，才能理解密码为什么可信、又为什么会被攻破。","formula":"","example":"","keywords":["为什么学数学","数学和密码","密码数学","学习目的","全书结构","知识脉络"],"related":["chx-roadmap","ch2-rsa","ch10-ecc"]},{"bk":"info-math","bkt":"信息安全数学基础（姜正涛）","id":"chx-roadmap","ch":"全书导览","tag":"综合","t":"三阶段学习路线","answer":"建议按书的三阶段推进：①数论基础（第1-5章：整除、同余、二次剩余、原根、素性）——能推导 RSA/Rabin 的正确性；②代数结构与有限域（第6-10章：群环域、有限域、椭圆曲线）——能构造 GF(2^8) 并理解 ECC 为何密钥短；③序列、复杂度与信息论（第11-15章：LFSR、复杂度、图论、信息论、保密）——能解释 LFSR 为何要加非线性、完善保密性为何需要足够长的密钥。","formula":"","example":"","keywords":["学习路线","怎么学","学习顺序","先学什么","入门","复习"],"related":["chx-why","ch2-rsa","ch9-aes"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c1-1","ch":"c1","tag":"crypto","t":"什么是密码学？","answer":"密码学是研究如何把信息（明文）变换成只有授权者能读的乱码（密文），以及如何反过来恢复、如何破解这门技术的学科。它分两大分支：密码编码学（研究怎么加密，负责“造锁”）和密码分析学（研究怎么破译，负责“开锁”）。现代密码学不只是保密，还解决完整性、身份认证、不可否认等问题，是信息安全的理论基石。","formula":"","example":"你给朋友发消息“明天八点见”，用密码本变成“Gdngw 台cv rbqp”，朋友有密钥能还原，别人拿到也看不懂——这就是一次加解密。","keywords":["密码学","密码编码学","密码分析学","密码术","cryptology","信息安全数学"],"related":["c1-2","c1-3"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c1-2","ch":"c1","tag":"crypto","t":"密码体制（五元组）是什么？","answer":"一个密码体制由五个要素组成：明文空间 M、密文空间 C、密钥空间 K、加密算法 E 和解密算法 D。用密钥加密明文得到密文：C=E(K,M)；用密钥解密密文恢复明文：M=D(K,C)。关键要求是：有密钥的人能顺利解密，没有密钥的人即使看到算法和密文也几乎无法还原明文。","formula":"C = E_k(M)　　M = D_k(C)　　D_k(E_k(M)) = M","example":"凯撒密码：把每个字母向后移3位。明文 HELLO，密钥 k=3，密文 KHOOR。加密 E 是“移位”，解密 D 是“反向移位”，它们互为逆运算。","keywords":["密码体制","五元组","明文","密文","密钥","加密算法","解密算法","密码系统"],"related":["c1-1","c1-3","c1-5"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c1-3","ch":"c1","tag":"crypto","t":"对称密码与非对称密码有什么区别？","answer":"对称密码：加密和解密用同一个密钥（或能互相推出的密钥），速度快、适合加密大量数据，代表有 DES、AES、SM4。非对称密码（公钥密码）：用一对密钥——公钥公开用来加密，私钥保密用来解密；或私钥签名、公钥验证。安全建立在数学难题（大数分解、离散对数、椭圆曲线）之上，速度慢，通常只用来加密少量关键数据（如交换对称密钥）、做数字签名。","formula":"对称：C=E_k(M), M=D_k(C)，同一 k。\n非对称：C=E_{pub}(M), M=D_{priv}(C)，公私钥配对。","example":"对称像“一把钥匙开一把锁”；非对称像“一个信箱”：任何人都能把信投进公共信箱（公钥加密），只有邮局有钥匙（私钥）能打开取出。","keywords":["对称密码","非对称密码","公钥密码","私钥","密钥","对称体制","非对称体制"],"related":["c1-4","c7-33","c7-35"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c1-4","ch":"c1","tag":"crypto","t":"什么是Kerckhoffs原则？","answer":"柯克霍夫原则：一个密码系统的安全性不应依赖于算法保密，而应只依赖于密钥保密。也就是说，即使攻击者完全知道你的加密算法，只要不知道密钥，系统依然安全。现代密码学都遵循这一原则——算法（如AES、RSA）公开透明、接受全世界审查，真正要保护的是密钥。任何靠“算法保密”来保证安全的做法（安全通过隐蔽），都被认为不可靠。","formula":"","example":"AES 算法是完全公开的，任何人都能查到它的详细步骤，但这不影响它安全——只要你的密钥是随机且保密的，别人就无法破解你的数据。","keywords":["kerckhoffs","柯克霍夫","原则","算法公开","保密","密钥保密"],"related":["c1-1","c1-5"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c1-5","ch":"c1","tag":"crypto","t":"密码分析有哪几种类型？","answer":"按攻击者掌握的信息从少到多分四类：①唯密文攻击——只有密文，最难；②已知明文攻击——有一批明文和对应密文；③选择明文攻击——攻击者能挑任意明文让系统加密，看对应密文；④选择密文攻击——攻击者能挑密文让系统解密。攻击者掌握的信息越多越容易得手。另外按目标还可分为彻底破解（拿到密钥）、部分破解（还原部分明文）等。","formula":"","example":"二战中盟军通过“已知明文”破译德军密码：英军会故意派飞机在固定位置投弹，让德军发报，从而掌握明文-密文对来帮助分析。","keywords":["密码分析","唯密文","已知明文","选择明文","选择密文","攻击类型","破译"],"related":["c1-1","c2-8","c3-16"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c1-6","ch":"c1","tag":"crypto","t":"信息安全的目标（CIA）是什么？","answer":"信息安全的三大基本目标：①机密性——信息不被未授权的人看到（靠加密）；②完整性——信息在传输、存储中不被篡改（靠哈希、消息认证码）；③可用性——授权者随时能正常访问（靠备份、抗攻击）。后来还常加上真实性（确认身份）和不可否认性（无法抵赖做过的事，靠数字签名）。密码学就是实现这些目标的核心工具。","formula":"","example":"网购付款：卡号要加密传输（机密性）、金额不能被中途改（完整性）、支付系统不能瘫痪（可用性）、商家要能确认是你本人下单（真实性+不可否认性）。","keywords":["cia","机密性","完整性","可用性","安全目标","信息安全属性"],"related":["c1-1","c11-50","c13-57"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c2-7","ch":"c2","tag":"crypto","t":"凯撒密码怎么加解密？","answer":"凯撒密码是最古老的移位密码：把每个字母在字母表中向后（或向前）移动固定的位数 k。加密：每个字母向后移 k 位；解密：向前移 k 位。因为只有 26 种可能的密钥（k=0~25），暴力穷举即可轻松破解，属于最不安全的古典密码。","formula":"加密：C = (P + k) mod 26\n解密：P = (C − k) mod 26","example":"k=3：HELLO → KHOOR。攻击者只需试 26 次就能找到能解出通顺英文的那个 k。","keywords":["凯撒","caesar","移位密码","古典密码","替换"],"related":["c2-8","c2-9"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c2-8","ch":"c2","tag":"crypto","t":"单表替换与多表替换密码的区别？","answer":"单表替换：整个明文用同一个替换表（每个字母固定映射到另一个字母），如凯撒、仿射、Hill。缺点是保留了字母频率特征，容易被频率分析攻破。多表替换：使用多个替换表轮换使用（如维吉尼亚密码，用关键词决定每位移多少位），让同一个明文字母在不同位置变成不同密文字母，掩盖频率特征，安全性比单表高得多。","formula":"","example":"“苹果苹果”按单表替换后是“AAAA AAAA”的固定模式；按维吉尼亚（关键词 ABC）替换则可能变成“APRCPRCQ”，模式被打破。","keywords":["单表替换","多表替换","替换密码","维吉尼亚","频率分析","homophonic"],"related":["c2-9","c2-13"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c2-9","ch":"c2","tag":"crypto","t":"维吉尼亚密码是什么？","answer":"维吉尼亚密码是多表替换的代表：选择一个关键词，把关键词的每个字母对应的位移量（A=0，B=1…）作为一组密钥流，加密时明文的第 i 个字母用密钥流第 i 个位移量去移位，密钥流循环使用。由于同一明文字母在不同位置被不同位移加密，字母频率被摊平，比凯撒密码难破，但用卡西斯基测试等方法仍可被攻破。","formula":"C_i = (P_i + k_{i mod L}) mod 26\nL 为关键词长度","example":"关键词 KEY（位移 10,4,24）：明文 HELLO → 第1位H+10=R，第2位E+4=I，第3位L+24=J，第4位L+10=V，第5位O+4=S，得密文 RIJVS。","keywords":["维吉尼亚","vigenere","多表替换","关键词","古典密码"],"related":["c2-8","c2-13"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c2-10","ch":"c2","tag":"crypto","t":"仿射密码怎么加密？","answer":"仿射密码是凯撒密码的推广：把字母映射成数字（A=0…Z=25）后，用线性函数 C = (a·P + b) mod 26 加密，其中 a 必须与 26 互素（保证一一映射，可逆）。解密用逆变换 P = a⁻¹(C − b) mod 26。密钥是 (a, b) 对，共 12×26=312 种，仍很容易被穷举或频率分析破解。","formula":"C = (a·P + b) mod 26，gcd(a,26)=1\n解密：P = a⁻¹·(C − b) mod 26","example":"a=5, b=8：字母 H(7) → 5×7+8=43 → 43 mod 26=17 → R。因为 5 与 26 互素，才能找到逆元 5⁻¹≡21 用于解密。","keywords":["仿射密码","affine","线性变换","模运算","古典密码"],"related":["c2-7","c2-9"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c2-11","ch":"c2","tag":"crypto","t":"Hill密码（矩阵加密）是什么？","answer":"Hill 密码是第一个把字母分组用矩阵运算加密的古典密码：把明文按 n 个一组写成向量，乘以一个 n×n 可逆密钥矩阵 K（模 26），得到密文向量。解密时乘 K 的逆矩阵。它把一组字母的统计特征混合起来，抗简单频率分析，但本质仍是线性变换，已知明文攻击下很容易求解出密钥矩阵。","formula":"C = K·P mod 26（P、C 为 n 维向量）\nP = K⁻¹·C mod 26","example":"2×2 密钥矩阵 K=[[3,3],[2,5]]，明文 PAIR 分成 (15,0)、(8,17)，分别乘 K 得密文对，再取模 26。","keywords":["hill","矩阵密码","线性变换","分组古典密码"],"related":["c2-8","c2-10"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c2-12","ch":"c2","tag":"crypto","t":"什么是频率分析攻击？","answer":"频率分析是破译古典替换密码最有效的方法：任何语言中字母的出现频率是有统计规律的（英文中最常见的是 E，中文中“的”“一”等字高频）。单表替换会把“频率最高的密文字母”对应到“明文中频率最高的字母”，所以只要统计密文里各字母出现次数并排序，就能猜出替换关系，再结合常见词逐步完善。多表替换通过摊平频率来对抗这种攻击。","formula":"","example":"密文里 X 出现次数最多，英文里 E 最常见，先猜 X→E，再猜常见两字母词、三字母词，像拼图一样还原整篇明文。","keywords":["频率分析","词频","统计攻击","破译古典密码","英文字母频率"],"related":["c2-8","c2-9"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c2-13","ch":"c2","tag":"crypto","t":"古典密码与现代密码的根本区别？","answer":"古典密码（凯撒、维吉尼亚、Hill 等）：①面向字母/文字做替换、移位，没有比特概念；②安全性常依赖算法保密和“人脑可算”的简单操作；③密钥空间小，容易被穷举或频率分析攻破；④不区分加密和认证。现代密码：①面向二进制比特流，用计算机执行复杂数学运算；②遵循 Kerckhoffs 原则，算法公开、密钥保密；③密钥空间巨大（AES-128 有 2¹²⁸ 个密钥），穷举不可行；④不仅能保密，还提供完整性、认证、签名等功能。","formula":"","example":"凯撒密码 26 个密钥，一秒钟试完；AES-128 密钥数比宇宙原子数还多，穷举需要几十亿年。","keywords":["古典密码","现代密码","区别","计算机","算法公开"],"related":["c1-1","c1-4","c3-15"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-14","ch":"c3","tag":"crypto","t":"分组密码的原理是什么？","answer":"分组密码把明文按固定长度分成一块一块（如 64 位、128 位），每一块用同一个密钥做复杂变换得到同长度的密文块。相同明文块+相同密钥永远得到相同密文块，所以还需要配合“工作模式”来处理长数据和抵抗模式泄露。典型代表：DES（64位块）、AES（128位块）、SM4（128位块）。","formula":"C = E_k(P)，P、C 为固定长度块","example":"AES 把明文切成 128 位（16 字节）一块，每块独立做 10 轮（AES-128）混合运算后输出 16 字节密文块。","keywords":["分组密码","块密码","block","分组加密","固定长度"],"related":["c3-16","c3-19","c3-23"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-15","ch":"c3","tag":"crypto","t":"分组密码的两大结构：Feistel与SPN","answer":"Feistel 结构：把数据分成左右两半，每轮只变换一半，用轮函数 F 与子密钥混合，另一半直接交换；加解密结构相同（倒过来用子密钥即可），硬件实现简单，DES、SM4 采用。SPN（代换-置换网络）结构：每轮先做非线性代换 S 盒（把小块映射成另一小块），再做线性置换/扩散 P 层，把影响扩散到全块；AES 采用，单轮扩散更充分，轮数通常更少。","formula":"Feistel 轮：L'=R, R'=L⊕F(R,k)\nSPN 轮：X=S(X); X=P(X); X=X⊕k","example":"DES 是 16 轮 Feistel，每轮 64 位拆左右 32 位；AES 是 10/12/14 轮 SPN，字节代换(SubBytes)→行移位→列混合→轮密钥加。","keywords":["feistel","spn","网络结构","代换","置换","des","aes","结构"],"related":["c3-19","c3-21","c3-22"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-16","ch":"c3","tag":"crypto","t":"什么是扩散与混淆？","answer":"香农提出的两大设计原则：扩散——让明文的每一个比特（一位）尽量影响密文的许多比特，使明文统计特征被抹平（常靠置换、移位实现）；混淆——让密文和密钥之间的关系非常复杂，无法从密文反推密钥的规律（常靠非线性 S 盒实现）。两者的理想体现是“雪崩效应”：明文或密钥改变 1 比特，密文约一半比特都改变。","formula":"","example":"AES 里一个明文字节改变，经过 10 轮后密文 16 个字节几乎全部不同——这就是扩散的效果。","keywords":["扩散","混淆","diffusion","confusion","香农","雪崩效应"],"related":["c3-15","c3-19"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-17","ch":"c3","tag":"crypto","t":"DES算法是什么？","answer":"DES（数据加密标准）是 1977 年公布的分组密码：分组 64 位，密钥 56 位（加校验位共 64 位），采用 16 轮 Feistel 结构。每轮包括扩展置换、S 盒代换、P 置换并与子密钥异或。由于密钥只有 56 位，1999 年被专用硬件在 22 小时内暴力破解，已不安全，后被 AES 取代，但其 S 盒和 Feistel 设计思想深刻影响了后来算法。","formula":"16 轮 Feistel，密钥经 PC-1/PC-2 置换生成 16 个 48 位子密钥","example":"1998年电子前沿基金会花 25 万美元造出“Deep Crack”机器，56 小时破 DES；1999 年分布式.net + Deep Crack 22 小时破 DES，宣告 DES 退役。","keywords":["des","数据加密标准","对称密码","feistel","56位"],"related":["c3-15","c3-18","c3-19"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-18","ch":"c3","tag":"crypto","t":"什么是三重DES（3DES）？","answer":"3DES 是为了延长 DES 寿命而设计的：用两个或三个密钥对数据做三次 DES——加密-解密-加密（EDE）。用两个密钥 K1、K2 时有效密钥 112 位（K1 加密→K2 解密→K1 加密），用三个密钥时 168 位。它比 DES 安全得多，但因软件上要跑三遍 DES，速度慢，最终被 AES 取代，目前主要用于兼容旧系统（如金融 IC 卡）。","formula":"C = E_{K1}(D_{K2}(E_{K3}(P)))","example":"老式银行卡磁条、部分 POS 交易仍用 3DES（双密钥版），新系统则迁移到 AES。","keywords":["3des","三重des","triple des","加密","ede","有效密钥长度"],"related":["c3-17","c3-19"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-19","ch":"c3","tag":"crypto","t":"AES算法（高级加密标准）是什么？","answer":"AES（高级加密标准）是 2001 年取代 DES 的分组密码，由比利时学者 Rijndael 设计：分组固定 128 位，密钥 128/192/256 位，轮数 10/12/14。采用 SPN 结构，每轮做：字节代换（S盒）、行移位、列混合、轮密钥加。AES 至今未被有效攻破，是全世界使用最广的对称加密算法（TLS、WiFi、磁盘加密都在用）。","formula":"AES-128：10 轮；AES-192：12 轮；AES-256：14 轮","example":"浏览网页时 HTTPS 的对称加密部分、WinRAR 加密、安卓全盘加密，用的都是 AES。","keywords":["aes","高级加密标准","rijndael","分组密码","sm4对比","128位"],"related":["c3-15","c3-17","c3-22"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-20","ch":"c3","tag":"crypto","t":"分组密码的填充方式是什么？","answer":"分组密码要求明文长度是分组的整数倍，不足时要填充。常见方式：①PKCS#7——差几个字节就补几个值为“缺的字节数”的字节（差 3 字节就补 3 个 0x03）；②ANSI X.923——补 0 再加一个“长度”字节；③ISO 10126——补随机字节加长度字节；④Zero padding——全补 0（无法区分真实末尾的 0）。填充方式对 CBC 等模式的安全性有影响（如填充预言攻击）。","formula":"缺 n 字节 → 补 n 个字节，每字节值 = n","example":"AES 块 16 字节，明文 20 字节 = 一块(16) + 4 字节，需补 12 个 0x0C。","keywords":["填充","padding","pkcs","补位","分组边界"],"related":["c3-14","c3-23"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-21","ch":"c3","tag":"crypto","t":"SM4国密分组密码是什么？","answer":"SM4 是我国国家商用密码管理局发布的对称分组密码（原称 SMS4），分组 128 位、密钥 128 位、32 轮 Feistel 结构。每轮用非线性 S 盒和线性变换 L 做轮函数，加密和解密使用相同的轮变换（解密时密钥反序）。SM4 是我国自主可控的商用标准，广泛用于电子政务、金融、移动通信（TD-LTE 就曾内置）等领域，安全性经受了长期公开分析。","formula":"32 轮 Feistel，轮密钥由 128 位主密钥经密钥扩展生成","example":"银行网上银行、电子政务系统、物联网安全芯片中常见 SM4 的身影，与 SM2（公钥）、SM3（哈希）合称“国密算法”。","keywords":["sm4","国密","分组密码","sms4","对称算法"],"related":["c3-15","c3-19","c7-42"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-22","ch":"c3","tag":"crypto","t":"国密算法体系（SM2/SM3/SM4/SM9）有哪些？","answer":"我国国家商用密码算法家族：SM2——椭圆曲线公钥密码（加密、签名、密钥交换），对标 ECC；SM3——密码杂凑算法，输出 256 位，对标 SHA-256；SM4——分组密码，对标 AES；SM9——基于标识（身份）的公钥密码，不需要证书；ZUC（祖冲之）——序列密码，用于移动通信（4G/5G 国际标准也采纳）。国密算法是我国实现密码自主可控、满足等级保护/密评要求的基础。","formula":"","example":"商用密码应用安全性评估（密评）要求关键信息系统使用国密算法：HTTPS 里用 SM2 证书 + SM3 摘要 + SM4 加密。","keywords":["国密","sm2","sm3","sm4","sm9","商用密码","zuc","祖冲之"],"related":["c3-21","c5-31","c7-41","c11-53"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-23","ch":"c3","tag":"crypto","t":"ECB与CBC工作模式有什么区别？","answer":"ECB（电子密码本）：每块明文独立加密，相同明文块→相同密文块，会泄露明文模式，图片加密后轮廓仍可见，不推荐。CBC（密码分组链接）：加密前先把当前明文块与上一块密文异或（第一块与随机初始向量 IV 异或），再加密，使相同明文块在不同位置得到不同密文，需串行加密但安全性好，是最常用的模式之一。","formula":"ECB：C_i = E_k(P_i)\nCBC：C_i = E_k(P_i ⊕ C_{i-1})，C_0 = IV","example":"用 ECB 加密企鹅图片，加密后仍能看出企鹅轮廓（模式泄露）；用 CBC 加密则完全花屏。","keywords":["ecb","cbc","工作模式","分组模式","电子密码本","密码分组链接","iv"],"related":["c3-24","c3-20"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-24","ch":"c3","tag":"crypto","t":"CFB/OFB/CTR工作模式有什么特点？","answer":"这三种模式把分组密码变成“流密码”式使用，明文可以逐位/逐字节处理，不需要填充：CFB（密文反馈）——用上一块密文加密后与明文异或；OFB（输出反馈）——用前一轮的输出反复加密生成密钥流；CTR（计数器）——用计数器值+密钥加密生成密钥流，各块相互独立、可并行、随机访问，是 TLS 等现代协议的首选。CTR 和 OFB 中同一个 (密钥, 随机数) 绝不能复用两次，否则密钥流重复会泄露明文。","formula":"CTR：C_i = P_i ⊕ E_k(counter_i)","example":"HTTPS 的 TLS 1.2 默认用 AES-CTR 或 AES-GCM（GCM 是 CTR+认证），文件加密软件常用 CTR 模式。","keywords":["cfb","ofb","ctr","工作模式","流模式","计数器","反馈"],"related":["c3-23","c5-27"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c3-25","ch":"c3","tag":"crypto","t":"差分分析与线性分析是什么？","answer":"两种针对分组密码的经典分析方法：差分分析——观察大量“特定明文对”的异或差值如何传播到密文差值，利用 S 盒的差分不均匀性猜测密钥；线性分析——找明文、密文、密钥位之间的线性近似关系，用大量样本统计逼近真实密钥。两者都属“已知/选择明文”攻击，需要海量数据（对 DES 需 2⁴⁷ 个选择明文对），现代算法（AES 等）设计时就保证 S 盒对这两种攻击足够抵抗。","formula":"","example":"对老式分组密码 FEAL，差分分析曾以很少样本攻破；对 AES，这两种经典方法至今没有有效威胁。","keywords":["差分分析","线性分析","侧信道","攻击分组密码","differential","linear"],"related":["c3-16","c3-19"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c4-26","ch":"c4","tag":"crypto","t":"分组密码的安全性如何评估？","answer":"评估分组密码安全性主要看：①密钥长度——暴力破解所需工作量 2^k，128 位以上视为安全；②算法结构——抗差分/线性/代数/侧信道等攻击的能力；③有效密钥长度——某些攻击能把破解复杂度降到低于穷举，如 2^112 攻击使 3DES 实际强度只有 112 位；④模式与实现安全——错误使用（ECB、密钥重用、IV 重用）即使算法安全也会被攻破。安全强度按“破解所需操作数”衡量，AES-128 强度 128 位、AES-256 强度 256 位。","formula":"","example":"2^128 次尝试是天文数字：即使每秒试 10 亿个密钥，也要 10^22 年，远超宇宙年龄，所以 AES-128 被视为安全底线。","keywords":["分组密码安全性","安全强度","密钥长度","有效密钥","攻击复杂度","评估"],"related":["c3-23","c3-25","c7-35"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c5-27","ch":"c5","tag":"crypto","t":"序列密码（流密码）的原理是什么？","answer":"序列密码把密钥扩展成一条与明文等长的“密钥流”（随机比特串），逐位（或逐字节）与明文异或得到密文。它速度快、无错误传播，适合实时性强的场景（移动通信）。核心是密钥流生成器：给定短种子密钥，产出看似随机但可复现的密钥流。安全性取决于密钥流是否足够“随机”且不可预测——绝不能重复使用同一条密钥流（OTP 特性）。","formula":"C = P ⊕ KS，KS 为密钥流","example":"手机 4G/5G 通话加密用祖冲之 ZUC 算法生成密钥流，语音数据逐比特加密，延迟极低。","keywords":["序列密码","流密码","stream","密钥流","逐位加密"],"related":["c5-28","c5-29","c5-31"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c5-28","ch":"c5","tag":"crypto","t":"同步序列密码与自同步序列密码？","answer":"同步序列密码：密钥流只由密钥（和计数器）决定，与明文/密文无关，收发双方只要保持同步就能正确解密；但一旦中间丢了一位，后续全部错位（无自恢复能力），且明文被篡改无法被发现。自同步序列密码：密钥流依赖前面若干位密文，解密端只要连续收到一定长度密文就能自动恢复同步，但错误会传播有限几位，且密钥流状态受密文影响（对密文篡改有一定检测性）。","formula":"","example":"ZUC 是同步序列密码；早期部分卫星通信使用自同步密码，靠密文反馈自动对齐同步。","keywords":["同步","自同步","序列密码","同步流密码","密钥流依赖"],"related":["c5-27","c5-31"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c5-29","ch":"c5","tag":"crypto","t":"LFSR线性反馈移位寄存器是什么？","answer":"LFSR 是序列密码中最基础的密钥流生成部件：一个移位寄存器，每个时钟把最右位输出，最左位由若干抽头位做异或（模2加）后填入。其输出序列的周期取决于反馈多项式；若多项式是本原多项式，周期达到最大 2ⁿ−1，称为 m 序列，统计特性接近随机。但纯 LFSR 是线性的，已知 2n 个连续输出就能用线性方程组解出反馈结构，所以实用中必须用非线性部件（非线性组合、非线性滤波、钟控）来“搅乱”。","formula":"反馈：a_{n+k} = c_1·a_{n+k−1} ⊕ … ⊕ c_n·a_k（模2）","example":"3 级 LFSR 若反馈抽头是第 1、3 位，初始 101，输出序列周期最长可达 2³−1=7。","keywords":["lfsr","线性反馈移位寄存器","序列密码","m序列","本原多项式"],"related":["c5-27","c5-31","c6-32"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c5-30","ch":"c5","tag":"crypto","t":"什么是m序列？","answer":"m 序列（最长线性反馈移位寄存器序列）是指：当 LFSR 的反馈多项式为本原多项式时，输出序列达到该级数下的最大周期 2ⁿ−1。它有良好的平衡性（一个周期内 1 和 0 的个数只差 1）、游程分布和自相关特性，像“伪随机”，因此在扩频通信、测量、序列密码中广泛应用。但它毕竟是线性序列，预测性差，单独使用不安全。","formula":"n 级本原多项式 → 周期 T = 2ⁿ − 1","example":"4 级 LFSR 配本原多项式 x⁴+x+1，输出序列周期 15，一个周期内 1 出现 8 次、0 出现 7 次。","keywords":["m序列","最长线性序列","本原多项式","lfsr","周期"],"related":["c5-29","c5-31"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c5-31","ch":"c5","tag":"crypto","t":"祖冲之序列密码算法（ZUC）是什么？","answer":"祖冲之算法是我国自主设计的序列密码，2011 年被 3GPP 采纳为国际移动通信标准加密算法（128-EEA3 加密、128-EIA3 完整性），用于 4G LTE 和 5G。它由三部分构成：线性反馈移位寄存器（16 个 31 位单元）、比特重组层、非线性函数 F。输入 128 位密钥和 128 位初始向量，输出 32 位密钥流，再经特定方式逐字加密数据。ZUC 经受住长期国际分析，是国密序列密码的代表。","formula":"","example":"你用手机打电话、发消息，通话数据在基站与手机之间就是用 ZUC（或国际算法）加密传输的。","keywords":["zuc","祖冲之","序列密码","国密","4g","5g","128位"],"related":["c5-27","c5-29","c3-22"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c6-32","ch":"c6","tag":"crypto","t":"序列密码与分组密码怎么选？","answer":"序列密码：逐位加密，速度快、延迟低、错误不扩散，适合实时数据流（语音、视频、无线通信）；缺点是同步要求高、密钥流不能重用，硬件/软件设计难度较大。分组密码：按块加密，处理任意长度数据，与工作模式配合能提供认证等功能，应用最广（文件、网络协议）；缺点是速度略慢、错误会传播到整个块（CBC）。现代趋势：用分组密码的 CTR/GCM 模式模拟流加密，兼顾速度与安全。","formula":"","example":"流媒体、手机通话适合序列密码；网页 HTTPS、磁盘加密、数据库加密普遍用分组密码（AES）。","keywords":["序列密码","分组密码","选择","区别","流密码","块密码"],"related":["c5-27","c3-23","c3-24"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-33","ch":"c7","tag":"crypto","t":"公钥密码的原理（单向陷门函数）？","answer":"公钥密码的核心是单向陷门函数：正向计算（加密）很容易，逆向（解密）极其困难；但掌握“陷门信息”（私钥）的人可以轻松逆算。把函数公开就是公钥，把陷门保密就是私钥。常见困难问题：大整数分解（RSA 依赖）、有限域/椭圆曲线离散对数（ElGamal、ECC 依赖）、格上的 LWE 问题（后量子密码依赖）。公钥密码解决了对称密码的密钥分发问题，但速度慢，通常只加密少量数据。","formula":"","example":"两个大素数相乘（p×q）一秒钟算完，但给你一个 2048 位的合数要分解回两个素数，需要天文时间——这就是 RSA 的陷门：知道 p、q 能解密，不知道则无法。","keywords":["公钥密码","非对称","单向陷门","陷门函数","原理","one-way"],"related":["c1-3","c7-34","c7-35"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-34","ch":"c7","tag":"crypto","t":"RSA算法是怎么工作的？","answer":"RSA 是 1978 年提出的第一个实用公钥密码：①选两个大素数 p、q，n=pq；②算 φ(n)=(p−1)(q−1)；③选 e 与 φ(n) 互素，公钥 (n,e)；④算 d=e⁻¹ mod φ(n)，私钥 d。加密 C=M^e mod n，解密 M=C^d mod n。安全性基于大整数分解困难。实际使用要求 n≥2048 位、p、q 随机且差距适中，并配合 OAEP 填充防止结构性攻击。","formula":"n=pq，φ(n)=(p−1)(q−1)，e·d ≡ 1 (mod φ(n))\nC = M^e mod n　M = C^d mod n","example":"p=61, q=53 → n=3233, φ=3120；选 e=17，d=17⁻¹ mod 3120=2753。明文 M=65：65¹⁷ mod 3233=2790（密文），2790²⁷⁵³ mod 3233=65（还原）。","keywords":["rsa","公钥密码","加密","解密","大数分解","欧拉函数","模幂"],"related":["c7-33","c7-35","c7-36"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-35","ch":"c7","tag":"crypto","t":"RSA 安全吗？密钥要多长？","answer":"RSA 的安全性建立在“大整数分解是困难的”这一假设上，但并未被证明；目前没有能分解大合数的多项式时间算法（经典计算机上）。随算力增长：768 位 RSA 于 2009 年被分解（历时约两年），1024 位已被认为不安全；当前标准是 2048 位（相当于 112 位对称安全强度），高安全场景用 3072/4096 位。注意：量子计算机出现后 Shor 算法可在多项式时间内分解大整数，RSA/ECC 届时全部失效，这正是后量子密码兴起的动因。","formula":"","example":"2025 年前后全球主流 HTTPS 证书普遍是 RSA-2048；若换用 ECC（P-256）只需 256 位密钥就达到同等安全强度。","keywords":["rsa安全","密钥长度","2048","大整数分解","量子","安全强度"],"related":["c7-34","c7-36","c10-43"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-36","ch":"c7","tag":"crypto","t":"Diffie-Hellman密钥交换是什么？","answer":"DH 让两个人不事先共享密钥，也能在公开信道商量出一个只有双方知道的共享密钥：①双方公开选大素数 p 和生成元 g；②甲选私密数 a，发 A=g^a mod p；乙选私密数 b，发 B=g^b mod p；③甲算 B^a、乙算 A^b，得到同一个值 g^ab mod p 作为会话密钥。窃听者只看到 g、p、A、B，要算出 a 或 b 需要解离散对数问题（困难）。但 DH 不验证对方身份，易受中间人攻击，需配合签名/证书。","formula":"K = (g^b)^a = (g^a)^b = g^{ab} mod p","example":"甲 a=6、乙 b=15、p=23、g=5：甲发 5⁶ mod 23=8，乙发 5¹⁵ mod 23=19，双方各自算出 19⁶≡8¹⁵≡2 mod 23，共享密钥 2，窃听者算不出。","keywords":["diffie-hellman","dh","密钥交换","离散对数","迪菲赫尔曼"],"related":["c7-37","c7-38","c15-68"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-37","ch":"c7","tag":"crypto","t":"ElGamal密码算法是什么？","answer":"ElGamal 是 1985 年基于离散对数问题的公钥加密算法：系统参数是大素数 p 和生成元 g。私钥 x，公钥 y=g^x mod p。加密：发方选随机数 k，算 c1=g^k、c2=m·y^k，密文为 (c1,c2)；解密：m=c2·c1^(−x) mod p。因为每次加密都引入随机 k，同一明文每次密文都不同（概率加密），安全强度取决于 p 的位数（标准 p 为 2048 位）。其变形广泛用于数字签名（DSA 就是它的变体）。","formula":"C = (c1, c2) = (g^k, m·y^k)\n解密：m = c2·(c1^x)⁻¹ mod p","example":"p=11, g=2, x=3 → y=8。加密 m=7：取 k=4，c1=2⁴=16≡5，c2=7·8⁴=7·(8²)² mod 11…最终得密文对，解密还原 7。","keywords":["elgamal","离散对数","公钥加密","随机化","加密算法"],"related":["c7-36","c13-58"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-38","ch":"c7","tag":"crypto","t":"椭圆曲线密码（ECC）是什么？","answer":"ECC 用椭圆曲线点群上的离散对数问题（ECDLP）构造密码：曲线上点之间的“加法”满足群结构，已知点 P 和倍数 k，算 kP 容易；反之已知 P、kP 求 k 极难。优点是：同样安全强度下密钥短得多——256 位 ECC ≈ 3072 位 RSA ≈ 128 位对称强度，运算快、带宽小，适合移动设备、智能卡。实际使用必须选安全曲线（如 secp256k1、SM2 曲线），避免用不安全参数。","formula":"点乘：Q = k·P（k 为私钥，Q 为公钥）","example":"比特币地址就是基于 secp256k1 曲线：私钥 256 位随机数，公钥是私钥乘以基点得到的曲线点。","keywords":["ecc","椭圆曲线","椭圆曲线密码","ecdlp","密钥短","sm2"],"related":["c7-39","c7-41","c10-46"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-39","ch":"c7","tag":"crypto","t":"ECDH与ECDSA是什么？","answer":"ECDH 是椭圆曲线版 Diffie-Hellman 密钥交换：双方各自生成随机私钥 d，交换公钥 dG，再各自用对方公钥乘自己私钥得到共享点 d1·d2·G，取其坐标作为会话密钥。ECDSA 是椭圆曲线数字签名算法：用私钥对消息哈希签名，验证方用公钥验签，具有签名短、速度快的特点。两者是 TLS 握手、区块链交易的核心部件。","formula":"共享密钥：K = d_A·(d_B·G) = d_B·(d_A·G)","example":"手机 App 与服务器建立 HTTPS：握手时用 ECDHE 协商会话密钥（前向保密），证书用 ECDSA 签名验证服务器身份。","keywords":["ecdh","ecdsa","密钥交换","数字签名","椭圆曲线","密钥协商"],"related":["c7-38","c7-36","c13-59"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-41","ch":"c7","tag":"crypto","t":"SM2公钥密码算法是什么？","answer":"SM2 是我国国家标准的椭圆曲线公钥密码算法（GB/T 32918），基于 256 位素域上的安全曲线，提供三合一能力：加密、数字签名、密钥交换。它在一组参数下用不同协议实现：SM2 签名（对标 ECDSA 但改进了防止篡改攻击）、SM2 加密（C1C3C2 结构）、SM2 密钥交换。国密 SSL 证书、税务发票、银行网银等大量使用 SM2。","formula":"曲线：y² = x³ + ax + b (mod p)，p 为 256 位素数","example":"国密 HTTPS：服务器证书用 SM2 签名，握手时用 SM2 密钥交换协商 SM4 会话密钥，整个链路全部国密算法。","keywords":["sm2","国密公钥","椭圆曲线","加密","签名","密钥交换","国产"],"related":["c7-38","c7-42","c13-59","c15-69"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c7-42","ch":"c7","tag":"crypto","t":"SM9标识密码算法是什么？","answer":"SM9 是基于标识的密码算法（国标 GB/T 38635）：直接用用户身份（如手机号、邮箱）作为公钥，不需要数字证书和 CA；私钥由密钥生成中心（KGC）根据主私钥和用户标识计算并安全下发给用户。它省去证书管理，适合物联网、邮件加密等场景。使用前提是必须信任 KGC（它能生成任何用户的私钥，称为“密钥托管”），并解决私钥分发安全问题。","formula":"","example":"给 alice@example.com 发加密邮件，无需先申请证书：直接以邮箱作为公钥加密，Alice 向 KGC 领取对应私钥后解密。","keywords":["sm9","标识密码","ibc","id-based","无证书","国密"],"related":["c7-41","c14-66"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c8-43","ch":"c8","tag":"crypto","t":"量子计算对密码的威胁（Shor算法）？","answer":"1994 年 Shor 提出量子算法：在足够大的量子计算机上，能以多项式时间分解大整数、求解离散对数——这意味着 RSA、ECC、DH、ElGamal 等主流公钥密码将全部被攻破。Grover 算法还能把对称密码的密钥搜索加速到平方根：AES-128 从 2¹²⁸ 降到 2⁶⁴ 次，因此建议新系统用 AES-256。当前量子计算机距离攻破 RSA-2048 还有很大距离，但“先收集后解密”的威胁促使各国推进后量子密码迁移（美国 NIST 已发布标准）。","formula":"","example":"攻击者现在截获并存储加密流量，等未来量子计算机成熟后批量解密——所以金融、政务等长期敏感数据现在就要用后量子算法。","keywords":["量子","shor","大数分解","离散对数","威胁","后量子","量子计算"],"related":["c10-44","c10-48","c7-35"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c8-44","ch":"c8","tag":"crypto","t":"格密码是什么？","answer":"格（Lattice）是 n 维空间中由一组线性无关基向量生成的所有整数线性组合点集。格上的困难问题（最短向量问题 SVP、最近向量问题 CVP、容错学习 LWE）目前没有已知的经典或量子算法能有效求解，因此被选为后量子密码的主要数学基础。格密码优势：①抗量子；②基于 LWE 还能构造全同态加密等高级密码；③运算以矩阵/向量为主，实现高效。NIST 已选定 Kyber（KEM）和 Dilithium（签名）为后量子标准。","formula":"格：L = { Σ x_i·b_i | x_i ∈ Z }","example":"想象二维平面上无限个点组成网格，给你一个不在格点上的点，找离它最近的格点——格点稀疏时极难，这就是 CVP，格密码的困难之一。","keywords":["格","格密码","lattice","lwe","后量子","向量空间"],"related":["c10-45","c10-47","c10-48"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c8-45","ch":"c8","tag":"crypto","t":"LWE（容错学习）问题是什么？","answer":"LWE（Learning With Errors，容错学习）问题是后量子密码最核心的困难假设：给定矩阵 A 和“近似解” b = A·s + e（s 是秘密向量，e 是小的随机噪声向量），要求恢复秘密 s。由于噪声的存在，用线性代数无法直接求解，而被认为计算上不可行（包括量子）。Kyber、Dilithium 等 NIST 标准算法全部建立在 LWE 及其变体（模块-LWE）之上。","formula":"b = A·s + e（e 为小噪声）","example":"就像在嘈杂的房间里听人报一串数字：单听一次能猜个大概，但精确恢复原数几乎不可能——LWE 就是把“噪声”故意加入方程，让破解者无法精确求解。","keywords":["lwe","learning with errors","容错学习","格问题","后量子","噪声"],"related":["c10-44","c10-47"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c8-46","ch":"c8","tag":"crypto","t":"NTRU密码体制是什么？","answer":"NTRU 是早期格密码公钥加密方案：在截断多项式环上运算，加密是多项式乘法和模约减，非常快；安全性基于在格中找短向量的困难性。NTRU 家族经历多轮改进（NTRUEncrypt、NTRU-HRSS），并演化出 NTRU Prime，曾进入 NIST 后量子决赛圈。它结构简单、密钥短、运算快，适合资源受限设备。","formula":"密文：e = r·h + m（h 为公钥多项式，r 为随机多项式）","example":"NTRU 只需整数多项式乘法和模运算，手机上也能飞快运行——这是它比 RSA 类算法更适合后量子时代的优势。","keywords":["ntru","格密码","多项式环","公钥加密","后量子"],"related":["c10-44","c10-47"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c8-47","ch":"c8","tag":"crypto","t":"Kyber和Dilithium是什么？","answer":"Kyber（现名 ML-KEM）和 Dilithium（现名 ML-DSA）是 NIST 在 2024 年正式标准化的后量子算法：Kyber 是基于模块-LWE 的密钥封装机制（KEM，用于密钥协商，对标 ECDH），Dilithium 是基于模块-LWE 的格签名算法（对标 ECDSA）。两者都有多档安全强度（256/384/512 位对称级别），密钥和签名长度适中、性能好，已成为 Chrome、TLS 混合后量子部署（X25519+ML-KEM）的主力。","formula":"","example":"Chrome 浏览器访问支持后量子的网站时，TLS 握手里同时用 X25519 和 ML-KEM768 协商密钥，防“先收集后解密”。","keywords":["kyber","dilithium","nist","后量子标准","kem","数字签名","ml-kem","ml-dsa"],"related":["c10-45","c10-46","c10-48"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c8-48","ch":"c8","tag":"crypto","t":"后量子密码迁移要注意什么？","answer":"后量子密码迁移的核心原则：①优先采用 NIST 标准化算法（ML-KEM、ML-DSA、SLH-DSA）；②现阶段普遍用“混合方案”——经典算法+后量子算法同时使用（如 X25519+ML-KEM768），任何一方被攻破都不影响整体安全；③按数据敏感度分级迁移，长期敏感数据优先；④关注性能影响（后量子密钥/签名体积大、握手慢）和协议兼容性；⑤对称算法侧升级到 AES-256 以抵抗 Grover 加速。","formula":"","example":"企业 TLS 网关启用“经典 ECDHE + ML-KEM”混合套件：老客户端照常工作，新客户端获得抗量子保护。","keywords":["后量子","迁移","混合","pqc","兼容","迁移策略"],"related":["c10-43","c10-47"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c11-49","ch":"c11","tag":"crypto","t":"哈希函数要满足哪些性质？","answer":"哈希函数把任意长度消息压缩成固定长度摘要（如 SHA-256 输出 256 位），必须满足：①抗原像（单向性）——给摘要，找不出任何能产生它的消息；②抗第二原像——给一条消息，找不出另一条产生相同摘要的消息；③抗碰撞——找不出任意两条不同消息产生相同摘要（比②更难）。此外还要求雪崩效应（改 1 比特摘要面目全非）和高效计算。","formula":"H(m) = h，|h| 固定（如 256 位）","example":"下载软件时官方给出 SHA-256 校验值，你本地算一遍对比：值不同说明文件被篡改或下载损坏。","keywords":["哈希","hash","杂凑","抗原像","抗碰撞","单向","摘要"],"related":["c11-50","c11-51","c11-54"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c11-50","ch":"c11","tag":"crypto","t":"什么是生日攻击？哈希要多长？","answer":"生日攻击利用“生日悖论”找碰撞：约 √N 个样本中就有两两相同的概率过半（N 为摘要空间大小）。所以哈希安全强度只有摘要长度的一半：SHA-256 摘要 256 位，抗碰撞强度仅 128 位；要抵抗 2^128 次计算，摘要至少 256 位。这也解释了为什么 MD5（128位，强度64位）早已不安全、SHA-1（160位，强度80位）已被 Google 用碰撞攻击演示攻破——现代标准是 SHA-256/384/512 或 SM3。","formula":"碰撞所需样本 ≈ 2^(n/2)","example":"会议室 23 个人就有超过一半概率出现两个人生日相同——2^64 次尝试就能找到 MD5 碰撞，今天用普通集群几天即可完成。","keywords":["生日攻击","碰撞","birthday","哈希长度","安全强度"],"related":["c11-49","c11-52","c11-53"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c11-51","ch":"c11","tag":"crypto","t":"MD5和SHA-1为什么不安全？","answer":"MD5（1992，摘要128位）和 SHA-1（1995，摘要160位）都基于 Merkle-Damgård 结构，其设计强度已随密码学进步被突破：MD5 的碰撞可在秒级构造（2004 年王小云团队提出差分攻击，2009 年攻击者造出伪造 SSL 证书的碰撞）；SHA-1 的碰撞在 2017 年由 Google 与 CWI 用 SHAttered 攻击实现（约 2^63 次计算）。两者都已被各大机构禁用，证书签名、Git 默认改用 SHA-256。","formula":"","example":"2008 年攻击者用 MD5 碰撞伪造了 CA 证书（火焰病毒事件）；如今任何系统都不应再用 MD5/SHA-1 做安全用途。","keywords":["md5","sha-1","不安全","碰撞攻击","弱化","淘汰"],"related":["c11-50","c11-52","c11-53"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c11-52","ch":"c11","tag":"crypto","t":"SHA-256哈希算法是什么？","answer":"SHA-256 是 SHA-2 家族成员（美国 NIST 标准，2001 年发布）：输入任意长度消息，输出 256 位摘要。采用 Merkle-Damgård 结构：消息按 512 位分块，每块经 64 轮压缩函数（含 32 位字的逻辑运算）迭代处理。抗碰撞强度 128 位，至今无可行的经典或量子攻击，是 TLS 证书、数字签名、区块链（比特币工作量证明）、口令散列中的事实标准。SHA-2 家族还有 SHA-224/384/512 等变体。","formula":"输出 256 位；分块 512 位；64 轮压缩","example":"比特币“挖矿”就是对区块头反复做 SHA-256，找到满足难度条件的摘要；HTTPS 证书的指纹也是 SHA-256。","keywords":["sha-256","sha2","哈希","sha-2","美国标准"],"related":["c11-49","c11-53","c13-57"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c11-53","ch":"c11","tag":"crypto","t":"SM3密码杂凑算法是什么？","answer":"SM3 是我国国密密码杂凑算法（GB/T 32905）：输出 256 位摘要，结构类似 SHA-256 的 Merkle-Damgård 设计但压缩函数细节不同（消息字按 512 位分块、64 轮迭代，含消息扩展）。抗碰撞强度 128 位，安全性经国家密码管理局组织长期审查。SM3 是国密体系的重要组成：SM2 签名中先用 SM3 对消息做摘要，国密 HTTPS、电子政务、数字人民币等都使用 SM3。","formula":"输出 256 位；分块 512 位；64 轮","example":"国密 SSL 握手、电子签名印章平台中，SM3 承担消息摘要与完整性校验的角色，与 SM2、SM4 配套使用。","keywords":["sm3","国密哈希","杂凑","256位","国产标准"],"related":["c11-52","c3-22","c13-59"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c11-54","ch":"c11","tag":"crypto","t":"HMAC消息认证码是什么？","answer":"HMAC 是带密钥的哈希：把密钥与消息按特定方式组合后做两次哈希（内层 ipad、外层 opad），输出固定长度的认证码。它能同时提供完整性和数据源认证——只有持有同一密钥的双方才能验证，防止攻击者篡改消息或伪造消息。HMAC 的强度取决于底层哈希（HMAC-SHA256 是 TLS、API 签名、会话 cookie 的标准选择）。","formula":"HMAC = H( (K ⊕ opad) ‖ H( (K ⊕ ipad) ‖ m ) )","example":"网站登录接口返回的签名 header、GitHub API 的 token 签名，都常用 HMAC-SHA256 防止请求被篡改。","keywords":["hmac","mac","消息认证码","完整性","密钥哈希"],"related":["c11-49","c11-52","c15-68"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c12-55","ch":"c12","tag":"crypto","t":"哈希函数的实际应用有哪些？","answer":"哈希函数的应用遍布安全领域：①完整性校验——比对文件/消息摘要发现篡改；②口令存储——数据库只存“口令+盐”的哈希（如 bcrypt/scrypt/argon2，抗彩虹表），明文口令绝不落库；③数字签名与证书——先哈希后签名，提高效率、固定长度；④区块链——区块头哈希链、Merkle 树汇总交易；⑤消息认证（HMAC）、密钥派生（HKDF）、随机数生成、布隆过滤器等。","formula":"","example":"网站数据库泄露时，攻击者拿到的是一堆哈希值而不是明文密码——只要口令用了加盐慢哈希（如 argon2），暴力破解成本极高。","keywords":["哈希应用","完整性","口令存储","区块链","数字指纹","应用"],"related":["c11-49","c11-54","c12-56"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c12-56","ch":"c12","tag":"crypto","t":"Merkle-Damgård结构与长度扩展攻击","answer":"Merkle-Damgård（M-D）结构把消息分块后依次迭代压缩，是 MD5/SHA-1/SHA-2 的共同骨架。其隐患是“长度扩展攻击”：知道 H(m) 后，无需知道 m 就能算出 H(m‖padding‖附加数据)，导致用“H(密钥‖消息)”做认证码不安全（应改用 HMAC）。SHA-3（Keccak）改用海绵结构，天然免疫长度扩展。另外 M-D 结构对碰撞攻击的抵抗力也不如理想哈希，这也是 SHA-3 出现的原因之一。","formula":"h_i = f(h_{i−1}, m_i)","example":"老式 Web 框架若用 MD5(secret+message) 做签名，攻击者可伪造带任意后缀的合法签名——修复方式是改用 HMAC-MD5。","keywords":["merkle-damgard","长度扩展","md结构","哈希结构","海绵"],"related":["c11-50","c11-52","c11-54"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c13-57","ch":"c13","tag":"crypto","t":"数字签名是什么？为什么需要？","answer":"数字签名是用私钥对消息（或其哈希）进行特定运算，形成任何人都能用公钥验证的“签名”。它提供三大保证：①真实性——证明消息确实来自私钥持有者；②完整性——消息被改动则签名验证失败；③不可否认性——签名者无法抵赖自己签过。流程：签名方对消息哈希用私钥签名，验证方用公钥验证。它与加密方向相反：加密用公钥、解密用私钥；签名用私钥、验签用公钥。","formula":"签名：s = Sign(sk, H(m))\n验证：Verify(pk, m, s) = 真/假","example":"银行转账电子回单、软件安装包的数字签名（如微软签名）：双击前系统验证签名，确认发布者身份且文件未被篡改。","keywords":["数字签名","签名","不可否认","完整性","认证","签名原理"],"related":["c13-58","c13-59","c14-64"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c13-58","ch":"c13","tag":"crypto","t":"DSA与RSA签名有什么区别？","answer":"DSA（数字签名算法，DSS 标准）基于离散对数问题，签名生成依赖随机数 k，签名是两个数 (r,s)；RSA 签名本质是“私钥加密”式运算——对哈希做模幂，验签用公钥模幂还原。区别：①数学基础不同（离散对数 vs 大数分解）；②DSA 必须使用高质量随机数（k 泄露即可恢复私钥）；③RSA 签名验证快、签名生成慢，DSA 相反；④DSA 的签名长度固定（320 位起），RSA 签名长度等于模长。实际中两者都被 ECDSA、SM2 等椭圆曲线方案逐步取代。","formula":"","example":"政府电子政务、金融文档签名早期常用 RSA-2048 签名或 DSA-2048；新系统普遍迁移到 ECDSA/SM2（签名更短、更快）。","keywords":["dsa","dss","rsa签名","签名算法","数字签名标准"],"related":["c13-57","c13-59","c7-38"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c13-59","ch":"c13","tag":"crypto","t":"SM2数字签名算法怎么工作？","answer":"SM2 数字签名（国标 GB/T 32918.2）基于 256 位椭圆曲线，签名时先对消息计算 SM3 摘要，再结合用户 ID 等参数（ZA 值）参与签名，输出 (r, s) 两个 256 位数。与 ECDSA 相比，SM2 在签名方程中加入了消息摘要本身，修复了 ECDSA 的某些安全隐患（如篡改 r 值攻击），且签名稍短、实现要求更严（随机数不能重用）。国密 SSL 证书、电子合同、发票查验等场景大量使用。","formula":"签名：(r, s)，验证：由公钥与摘要验 r' = r","example":"税务发票的电子签名、银行 U 盾的证书登录，底层签名算法常为 SM2——你插上 U 盾输密码，系统就是用 SM2 完成认证的。","keywords":["sm2签名","国密签名","数字签名","sm2","ecdsa"],"related":["c13-57","c7-41","c11-53"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c13-60","ch":"c13","tag":"crypto","t":"什么是盲签名、环签名、群签名？","answer":"三种扩展签名：盲签名——签名者在不知道消息内容的情况下签名（先“盲化”再签，用于电子现金、匿名投票，RSA 盲签为代表）；环签名——签名者用一组公钥中的任意一个签名，验证者只知“圈内某一人签的”，无法定位具体签名者，实现完全匿名（门罗币用环签名）；群签名——组内成员可匿名签名，但群管理员能追踪到具体成员（有问责能力的匿名，用于可信匿名举报）。","formula":"","example":"电子投票：选民把选票盲化后交给计票中心签名，中心无法看到内容但确认“有资格的人投了票”，事后仍可验证。","keywords":["盲签名","环签名","群签名","特殊签名","匿名","隐私"],"related":["c13-57","c14-65"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c14-61","ch":"c14","tag":"crypto","t":"身份认证与授权有什么区别？","answer":"认证（Authentication）回答“你是谁”——确认用户/设备的真实身份，手段有口令、动态口令、U 盾证书、生物特征、零知识证明等；授权（Authorization）回答“你能干什么”——身份确认后决定其访问权限（读/写/执行），靠访问控制策略（ACL、RBAC 角色权限）实现。先认证后授权。","formula":"","example":"登录银行 App：输入密码+指纹是“认证”；登录后能转账但不能修改利率，是“授权”在起作用。","keywords":["身份认证","授权","authentication","authorization","访问控制"],"related":["c14-62","c14-63","c14-64"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c14-62","ch":"c14","tag":"crypto","t":"口令认证为什么会被攻破？怎么防护？","answer":"口令认证易被攻破的原因：①弱口令/默认口令被猜测（暴力破解）；②撞库——一处泄露的密码批量试其他网站；③钓鱼与键盘记录；④数据库明文存储泄露。防护：强制复杂度与长度、加盐慢哈希存储（argon2/bcrypt）、限制尝试次数与验证码、多因素认证（MFA：口令+动态码/生物）、防撞库（异地登录检测）、不重用口令（密码管理器）。","formula":"","example":"123456 这类口令在泄露数据库中一查就有；正确姿势是 16 位随机口令 + 密码管理器 + 开启两步验证（2FA）。","keywords":["口令","密码认证","弱口令","暴力破解","撞库","防爆破"],"related":["c14-61","c14-63","c12-55"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c14-63","ch":"c14","tag":"crypto","t":"什么是挑战-响应认证？","answer":"挑战-响应认证避免口令在信道中传输：服务器发一个随机“挑战”（challenge），客户端用共享秘密（如口令、密钥、令牌）对挑战做运算（哈希、HMAC、加密）返回“响应”，服务器用同样秘密验证。攻击者截获的响应每次不同，无法重放。典型应用：动态口令（TOTP 基于时间）、挑战握手认证协议（CHAP）、银行 U 盾签名。","formula":"响应 = F(秘密, 挑战)","example":"微信/支付宝的动态验证码本质是 TOTP：服务器和手机共享种子，按当前时间各算一个 6 位码，对上了就认证成功。","keywords":["挑战响应","challenge","动态口令","随机数","双向认证"],"related":["c14-62","c14-64","c11-54"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c14-64","ch":"c14","tag":"crypto","t":"什么是零知识证明？","answer":"零知识证明：证明者向验证者证明“我知道某个秘密”，但完全不泄露秘密的任何信息。三个性质：完备性（真话一定能通过）、可靠性（假话几乎不可能通过）、零知识性（验证者学不到任何关于秘密的信息）。现代 ZKP（zk-SNARK、zk-STARK）基于椭圆曲线、多项式承诺等技术，用于区块链隐私（隐私币）、匿名登录、数据合规证明（证明年龄够而不泄露出生日期）等。","formula":"","example":"向酒吧证明自己已满 18 岁但不暴露生日、姓名——出示一张“可验证的凭证”就是零知识证明的现实应用。","keywords":["零知识证明","zkp","知识证明","匿名","证明"],"related":["c14-61","c14-65"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c14-65","ch":"c14","tag":"crypto","t":"数字证书与PKI体系是什么？","answer":"数字证书（X.509）把“公钥”与“身份”绑定：由可信的证书颁发机构 CA 用其私钥对（用户公钥+身份信息）签名，形成证书。PKI（公钥基础设施）是管理证书全生命周期的体系：CA 签发、注册机构 RA 审核、证书吊销列表 CRL/OCSP 查询、证书链验证。浏览器信任内置的根 CA，验证服务器证书链，从而确认你连接的是真网站。国密体系中的证书用 SM2/SM3 签发（国密 TLS）。","formula":"","example":"你访问 https://example.com 时，浏览器验证其证书由可信 CA 签发、域名匹配、未过期未吊销——通过才显示锁形图标。","keywords":["证书","pk","x509","ca","证书链","公钥基础设施"],"related":["c14-64","c13-57","c15-68"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c15-66","ch":"c15","tag":"crypto","t":"密钥管理的基本概念是什么？","answer":"密钥管理是密码系统安全的根基——算法再强，密钥泄露一切白搭。核心内容：①密钥分类与分级（主密钥、密钥加密密钥、会话密钥，分级保护）；②密钥生命周期（生成→分发→使用→更新→备份→归档→销毁）；③密钥保护（硬件安全模块 HSM、可信平台模块 TPM 存储主密钥）；④密钥分配（对称用 KDC 分发或非对称协商）；⑤密钥使用策略（定期更换、分离存储、紧急销毁）。","formula":"","example":"银行的加密体系：根密钥存在 HSM 硬件里，派生的会话密钥加密交易数据，按日更换；主密钥终身极少动用。","keywords":["密钥管理","密钥分类","密钥生命周期","密钥分级","密钥保护"],"related":["c15-67","c15-69","c14-65"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c15-67","ch":"c15","tag":"crypto","t":"对称密钥分配有哪几种方式？","answer":"对称密钥分配方式：①人工配送——面对面或可信渠道传递，安全但成本高；②密钥分发中心 KDC（如 Kerberos）：每个用户与 KDC 共享长期密钥，KDC 为用户签发短期会话票据（票证），双方凭票据获得会话密钥；③基于公钥密码协商——用对方公钥加密会话密钥发送（混合加密），或 DH/ECDH 协商，兼顾安全与效率，是最常用方式（HTTPS 即如此）。","formula":"","example":"公司内部用 Kerberos 登录域：用户向 KDC 要票证，KDC 验证后发会话密钥，用户拿它访问文件服务器，无需逐台配置密码。","keywords":["密钥分配","kdc","密钥分发中心","对称密钥","密钥托管"],"related":["c15-66","c7-36","c15-69"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c15-68","ch":"c15","tag":"crypto","t":"混合加密（HTTPS如何工作）？","answer":"HTTPS/TLS 采用混合加密，兼顾安全与速度：①握手阶段用非对称算法完成身份认证和密钥协商——服务器出示证书（RSA/ECDSA/SM2 签名）证明身份，双方用 ECDHE/RSA/SM2 密钥交换协商出一次性会话密钥；②数据传输阶段用对称算法（AES/SM4 + GCM/CTR 模式 + HMAC）高速加解密。每次会话的密钥都是新鲜的，即使被窃取也无法用于其他会话。","formula":"","example":"你浏览网页时：前几百毫秒做 ECDHE 握手协商 AES 会话密钥，之后整页内容都用 AES 加密传输，肉眼看不到过程但全程加密。","keywords":["混合加密","https","tls","会话密钥","对称加密","握手"],"related":["c15-67","c7-39","c7-41"]},{"bk":"crypto","bkt":"密码学——基础理论与应用（第2版）","id":"c15-69","ch":"c15","tag":"crypto","t":"SM2/SM9密钥交换协议是什么？","answer":"SM2 密钥交换协议（国标 GB/T 32918.3）：通信双方各自持有 SM2 公私钥对，通过两轮消息交换各自的临时公钥与摘要，最终协商出相同的共享密钥，且协议自带双方身份的相互认证（能检测中间人）。SM9 密钥交换则基于标识密码：双方用对方的身份标识作为公钥参与协商，无需证书。两者都输出一次性的会话密钥，供 SM4 等对称算法使用，是国密体系密钥协商的标准做法。","formula":"","example":"国密 SSL 网关建立 VPN：客户端与网关用 SM2 密钥交换协商出会话密钥，再用 SM4 加密后续流量。","keywords":["sm2密钥交换","sm9密钥交换","密钥协商","国密","双向认证"],"related":["c15-66","c7-41","c7-42"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w1-1","ch":"w1","tag":"websec","t":"Web安全主要威胁有哪些？","answer":"Web 应用面临的主要威胁按 OWASP Top 10 划分：注入类（SQL注入、命令注入）、失效的身份认证与会话管理、XSS 跨站脚本、CSRF 跨站请求伪造、敏感数据泄露、访问控制缺陷、安全配置错误、文件上传/下载漏洞、不安全的反序列化、日志与监控不足等。本书按三类组织：SQL 注入、前端攻击（会话/XSS/CSRF/验证码）、文件漏洞（上传/下载/解析/包含）。本质都是“未充分验证和过滤用户输入”或“信任了不该信任的数据”。","formula":"","example":"一个搜索框直接拼接用户输入进 SQL 语句、一个留言板直接输出用户 HTML——这两处小疏漏就可能被升级为数据库脱库和窃取管理员会话。","keywords":["web安全","威胁","owasp","注入","xss","csrf","攻击分类"],"related":["w1-2","w2-9","w3-24"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w1-2","ch":"w1","tag":"websec","t":"什么是LAMP/WAMP架构？","answer":"LAMP 指 Linux+Apache+MySQL+PHP 这一经典 Web 开发技术栈；本书用 Windows 系统，即 WAMP：Windows Server 2016（或 Win10）+ Apache + MySQL + PHP。分工：Apache 是 Web 服务器，接收 HTTP 请求、托管静态文件、把 .php 文件交给 PHP 解释执行；PHP 处理业务逻辑、操作 MySQL 数据库、动态生成 HTML；MySQL 存储数据。这套组合支撑了全球 70% 以上的动态网站，也是练习 Web 攻击与防御的标准靶场。","formula":"","example":"你访问 example.com/index.php：Apache 收到请求 → PHP 执行脚本 → 查 MySQL 取数据 → 拼成 HTML 返回浏览器。","keywords":["lamp","wamp","apache","php","mysql","服务器架构","环境"],"related":["w1-3","w1-5","w1-6"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w1-3","ch":"w1","tag":"websec","t":"Apache服务器配置要注意哪些安全项？","answer":"Apache 常见安全配置项：①关闭目录浏览（Options -Indexes），防止列目录；②正确设置 DocumentRoot 和 Directory 权限，禁止访问敏感目录；③隐藏版本号（ServerTokens Prod），防止针对版本漏洞的攻击；④禁用危险模块（如 mod_info、mod_status 公开访问）；⑤配置.htaccess 做访问控制；⑥日志开启并定期轮转；⑦处理解析漏洞（多后缀名）。","formula":"","example":"服务器若开了 Indexes，访问 /uploads/ 就能看到目录里的所有文件名，攻击者可据此找上传的马文件。","keywords":["apache","服务器配置","目录列表","安全配置","httpd"],"related":["w1-2","w4-37","w4-35"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w1-4","ch":"w1","tag":"websec","t":"PHP开发中常见的安全误区？","answer":"PHP 常见安全误区：①直接拼接用户输入进 SQL（注入根源）；②直接 echo 用户输入（XSS 根源）；③弱类型比较（== 与 === 混淆，如 \"0e123\"==0 为真，可绕过校验）；④使用已废弃函数（ereg、mysql_* 等）；⑤错误信息直接暴露给用户（泄露表结构、路径）；⑥include 用户可控路径（文件包含漏洞）；⑦上传文件名、路径直接信任用户输入。安全编码原则：输入过滤/校验、输出编码、参数化查询、最小权限、错误信息脱敏。","formula":"","example":"if ($_GET[\"id\"] == \"admin\") 用 == 比较，攻击者传 id=0 可能绕过某些判断（PHP 弱类型陷阱）。","keywords":["php安全","编码规范","误用","register_globals","弱类型","安全编码"],"related":["w1-1","w2-9","w4-38"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w1-5","ch":"w1","tag":"websec","t":"HTTP协议的基本结构是什么？","answer":"HTTP 是 Web 的请求-响应协议。请求由请求行（方法+URL+版本）、请求头、空行、请求体组成；方法常见 GET（查询，参数在 URL）、POST（提交，参数在请求体）、PUT、DELETE 等。响应由状态行（如 200 OK、302 Found、404 Not Found）、响应头、空行、响应体组成。关键头：Cookie、Referer、User-Agent、Content-Type、Location、Set-Cookie。理解 HTTP 是分析一切 Web 漏洞的基础。","formula":"","example":"GET /user.php?id=1 HTTP/1.1 → 服务器返回 200 和页面；若 id 拼进 SQL 就成了 Get 型注入的入口。","keywords":["http","请求","响应","get","post","状态码","协议"],"related":["w1-6","w1-7","w2-10"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w1-6","ch":"w1","tag":"websec","t":"Cookie和Session是怎么工作的？","answer":"HTTP 是无状态的，靠 Cookie/Session 维持登录状态：用户登录后，服务器创建 Session 并生成随机的 SessionID，通过 Set-Cookie 下发给浏览器；浏览器之后每次请求都带上 Cookie: PHPSESSID=xxx；服务器据此识别用户。Session 数据存在服务器端（内存/文件/数据库），Cookie 只存 ID；也可把少量非敏感数据直接存 Cookie。会话机制若被窃取或伪造，就产生 Session/Cookie 欺骗攻击。","formula":"","example":"登录论坛后关闭重开浏览器仍保持登录——就是浏览器在自动发送保存在 Cookie 里的 SessionID。","keywords":["cookie","session","会话","sessionid","会话管理"],"related":["w3-22","w3-23","w1-7"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w1-7","ch":"w1","tag":"websec","t":"GET和POST请求有什么区别？","answer":"GET：参数附在 URL 查询串上（?a=1&b=2），会被浏览器历史、日志、Referer 记录，长度有限制，用于查询类操作；POST：参数放请求体中，不会出现在 URL/历史里，长度限制宽松，用于提交数据。注意：POST 并不比 GET 更安全——抓包一样能看到明文参数，只是“不太显眼”。从攻击角度，GET 型注入（暴库）参数在 URL，POST 型注入参数在请求体，都能被注入工具修改。","formula":"","example":"搜索引擎用 GET 以便分享链接；登录表单用 POST 减少敏感参数进历史记录，但抓包依然可见。","keywords":["get","post","请求方法","参数传递","区别"],"related":["w1-5","w2-10","w2-11"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-8","ch":"w2","tag":"websec","t":"SQL注入攻击的原理是什么？","answer":"SQL 注入的根源：程序把用户输入直接拼接进 SQL 语句，且未做过滤，用户输入的“数据”被当成了“SQL代码”执行。例如 $sql=\"SELECT * FROM users WHERE name='$name'\"，输入 name 为 a' OR '1'='1，语句变成 WHERE name='a' OR '1'='1'，恒为真，绕过了验证。注入者可利用此漏洞：绕过登录、暴库（读出所有数据库/表/列/数据）、增删改、写入 WebShell。防御核心：参数化查询 + 输入校验 + 最小权限。","formula":"拼接：SELECT * FROM users WHERE name='$name'","example":"用户名输入 `admin'--`，注释掉后面查询条件，就能以 admin 身份登录——经典“万能密码”变体。","keywords":["sql注入","原理","拼接","恶意sql","sql injection"],"related":["w2-9","w2-12","w2-18"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-9","ch":"w2","tag":"websec","t":"万能密码登录（Post型注入）怎么攻击和防护？","answer":"万能密码：登录表单（POST 提交）把用户名直接拼进 SQL，攻击者在用户名/密码框输入 `' OR '1'='1'--` 之类构造，让 WHERE 条件恒真，绕过密码校验直接登录。防护三板斧：①输入校验（正则只允许合法字符）；②转义函数（addslashes 已弱，推荐 mysqli_real_escape_string 但有局限性）；③参数化查询（MySQLi 预处理 / PDO 绑定参数）——把用户输入当数据处理，永远不当代码执行，是根治方案。","formula":"","example":"用户名输入 `' OR '1'='1'#`：SQL 变成 SELECT ... WHERE name='' OR '1'='1'#...，条件恒真，无需密码即可登录。","keywords":["万能密码","post注入","登录绕过","or 1=1","参数化"],"related":["w2-8","w2-18","w2-19"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-10","ch":"w2","tag":"websec","t":"Get型注入（数据库暴库）如何攻击？","answer":"Get 型注入：注入点在 URL 参数（如 news.php?id=1），攻击者用联合查询 UNION 或报错函数，通过 information_schema 元数据库逐步暴出：数据库名 → 表名 → 列名 → 数据。典型手法：先 `order by` 测列数，再用 UNION SELECT 对齐列数回显数据；若页面不回显，则用布尔盲注/时间盲注逐字符猜。防护：参数化查询 + 白名单校验（id 只允许数字）。","formula":"UNION 注入：id=1 UNION SELECT username,password FROM users","example":"输入 ?id=1 UNION SELECT 1,group_concat(table_name) FROM information_schema.tables -- 就能列出库中所有表名，继续暴列暴数据。","keywords":["get注入","暴库","information_schema","脱库","联合查询"],"related":["w2-8","w2-12","w2-13"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-11","ch":"w2","tag":"websec","t":"什么是二阶SQL注入？","answer":"二阶注入：第一次输入时被转义/过滤“安全地”存进了数据库（如注册用户名 `admin'--` 被转义存储），但取出时未再过滤，被用于另一个 SQL 语句拼接，此时恶意代码生效。特点是“存的时候安全，取出来用的时候才爆发”，常规过滤（只过滤输入）防不住——必须对“从数据库取出的数据”同样按不可信处理。典型场景：改密码功能用存库的用户名拼 SQL。","formula":"","example":"注册用户名 `a' OR 1=1#` 成功存入（存储时转义）；改密码时 SELECT ... WHERE user='a' OR 1=1#，条件恒真，把别人的密码改了。","keywords":["二阶注入","二次注入","存储型注入","延时注入","second order"],"related":["w2-8","w2-18"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-12","ch":"w2","tag":"websec","t":"Cookie注入攻击是什么？","answer":"Cookie 注入：注入点不在参数而在 Cookie 头。网站若用 Cookie 值（如 userid）直接拼 SQL 查询，攻击者用工具修改请求中的 Cookie 值构造注入语句，即可绕过“仅过滤 GET/POST 参数”的防护。有些系统只过滤了表单参数而忘了 Cookie，这是常见疏漏。防护：把 Cookie 数据同样当不可信输入处理、参数化查询；重要状态数据不要放 Cookie 或要签名防篡改。","formula":"","example":"后台用 $_COOKIE[\"userid\"] 拼 SQL 查购物车，攻击者改 Cookie 为 `1 UNION SELECT ...` 即可拖数据。","keywords":["cookie注入","cookie注入","会话cookie","sql注入cookie"],"related":["w2-8","w3-23","w1-6"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-13","ch":"w2","tag":"websec","t":"HTTP头部注入是什么？","answer":"HTTP 头部注入：网站把请求头（User-Agent、Referer、X-Forwarded-For 等）记录到数据库或拼进 SQL，若头值未过滤，就成了注入点。比如记录“访问者浏览器信息”的功能把 User-Agent 直接 insert 进 SQL，攻击者把 UA 改成注入语句即可攻击。防护：所有头字段按不可信输入处理、参数化、限制长度。","formula":"","example":"日志功能 INSERT INTO logs(ua) VALUES('$_SERVER[\"HTTP_USER_AGENT\"]')，攻击者把 UA 改成 `a' UNION SELECT password FROM users#` 即暴库。","keywords":["http头注入","头部注入","referer注入","user-agent注入","header"],"related":["w2-8","w2-18"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-14","ch":"w2","tag":"websec","t":"什么是报错注入、布尔盲注、时间盲注？","answer":"当页面不回显查询结果时用“盲注”逐位猜数据：报错注入——用 extractvalue、updatexml 等函数让 SQL 报错并把数据带进错误信息；布尔盲注——用 AND 1=1 / AND 1=2 判断条件真假，逐字符二分猜出内容；时间盲注——用 IF(条件, SLEEP(5), 0) 通过响应延迟判断条件真假。它们都慢但有效，属于“不回显注入”的常用手法。防护仍是参数化查询。","formula":"","example":"?id=1 AND substr((SELECT password FROM users LIMIT 1),1,1)='a' -- 若页面正常说明第一位是 a，逐位测完全密码。","keywords":["报错注入","盲注","布尔盲注","时间盲注","extractvalue","sleep"],"related":["w2-10","w2-8"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-15","ch":"w2","tag":"websec","t":"什么是宽字节注入？","answer":"宽字节注入：在 GBK 等双字节编码下，攻击者用 %df%27 等组合绕过转义。原理：转义函数把单引号变成 '（0x5C 27），但若数据库/连接字符集是 GBK，攻击者构造 %df%27，转义后成为 %df%5C%27，其中 %df%5C 拼成一个汉字“運”，剩下的 %27 是裸单引号——转义被“吃”掉，注入成功。防护：统一使用 utf8 字符集、设置连接字符集与库一致、参数化查询。","formula":"%df%5C → 一个 GBK 汉字，'逃逸'","example":"老 PHP 站点（GBK 编码）输入 %df%27，addslashes 转义后变 %df%5C%27，单引号依然裸奔，注入继续有效。","keywords":["宽字节注入","gbk","编码绕过","转义绕过","字符集"],"related":["w2-8","w2-19"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-16","ch":"w2","tag":"websec","t":"SQL注入防护最佳实践是什么？","answer":"SQL 注入防护的最佳实践（按优先级）：①参数化查询/预处理语句（PDO、MySQLi prepare）——用户输入永远是参数，与 SQL 结构分离，从根上杜绝注入；②输入校验——类型、长度、白名单（如 id 只允许数字）；③最小权限——数据库账号只授予应用必需权限（不用 root、不开放 FILE 权限），降低脱库危害；④隐藏错误信息——不把 SQL 报错暴露给用户；⑤WAF 纵深防御；⑥定期代码审计与渗透测试。","formula":"","example":"PDO: $stmt=$pdo->prepare(\"SELECT * FROM users WHERE id=?\"); $stmt->execute([$id]); ——无论 $id 是什么都只是数据，无法改变查询结构。","keywords":["sql注入防护","参数化查询","预处理","白名单","最小权限"],"related":["w2-18","w2-19","w2-8"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-17","ch":"w2","tag":"websec","t":"MySQLi参数化查询怎么写？","answer":"MySQLi 预处理：$stmt = $mysqli->prepare(\"SELECT * FROM users WHERE name=? AND pwd=?\"); 先用占位符 ? 定义 SQL 结构，再 $stmt->bind_param(\"ss\", $name, $pwd); 绑定参数，最后 $stmt->execute()。数据库先把 SQL 结构编译好，参数作为纯数据传入，与结构分离——无论输入多“坏”都只会被当字符串处理，注入失效。这是 PHP 中最推荐的注入防护方式之一（另一为 PDO）。","formula":"","example":"bind_param(\"ss\",...) 绑定两个字符串参数，输入 `admin' OR '1'='1` 只会被当作一个普通字符串去匹配，查不到任何记录。","keywords":["mysqli","prepare","bind_param","参数化","预处理"],"related":["w2-16","w2-18"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-18","ch":"w2","tag":"websec","t":"PDO参数化查询怎么写？","answer":"PDO（PHP Data Objects）是 PHP 的数据库抽象层，支持多种数据库。参数化写法：$pdo = new PDO(\"mysql:host=...;dbname=...;charset=utf8\", $u, $p); $stmt = $pdo->prepare(\"SELECT * FROM users WHERE id = :id\"); $stmt->execute([':id' => $id]); 用命名占位符 :id 或 ? 占位，execute 传参数。PDO 自动把参数当数据处理，同时解决注入和字符集问题，是当前 PHP 应用的首选数据库访问方式。","formula":"","example":"prepare(\"INSERT INTO news(title,content) VALUES(?,?)\") + execute([$title,$content])：用户输入再长再怪也只是普通字符串。","keywords":["pdo","预处理","绑定参数","数据库抽象层","占位符"],"related":["w2-17","w2-16"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w2-19","ch":"w2","tag":"websec","t":"转义函数和正则校验能防注入吗？","answer":"转义函数（addslashes、mysqli_real_escape_string）和正则过滤属于“过滤输入”思路，能挡大部分简单注入，但存在绕过：宽字节注入（GBK）、编码差异、过滤不完整、二次注入等。正则黑名单永远列不全攻击 payload。所以它们只能作为辅助防线，不能替代参数化查询——正确姿势：参数化为主，正则做格式校验（如邮箱格式、ID 只允许数字），转义做兼容，多一层纵深。","formula":"","example":"只过滤了单引号，攻击者改用 hex 编码、双写（SELECT → SELSELECTECT）、注释符变体，黑名单就失效了。","keywords":["转义","addslashes","正则","输入校验","黑名单","过滤"],"related":["w2-16","w2-15","w2-8"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w3-20","ch":"w3","tag":"websec","t":"Session欺骗攻击是什么？","answer":"Session 欺骗（会话劫持）：攻击者拿到合法用户的 SessionID（通过窃取 Cookie、XSS、网络嗅探、固定会话等方式），然后把自己的请求带上这个 ID，服务器就把他当成那个用户——直接继承其登录状态和权限，无需密码。防护：登录后重新生成 SessionID（session_regenerate_id）、设置较短有效期、绑定 User-Agent/IP 校验、Cookie 加 HttpOnly+Secure+SameSite、HTTPS 传输、检测异常切换时强制重新认证。","formula":"","example":"攻击者从公共 WiFi 抓到别人 Cookie 里的 PHPSESSID，放进自己的浏览器，直接以对方身份进入后台管理页。","keywords":["session欺骗","会话劫持","sessionid","窃取会话","伪造"],"related":["w3-21","w3-24","w1-6"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w3-21","ch":"w3","tag":"websec","t":"Cookie欺骗攻击是什么？","answer":"Cookie 欺骗：网站把登录状态、用户身份、权限等敏感信息直接放在 Cookie 里（如 userid=1, isadmin=0），攻击者用工具修改 Cookie 值（改 userid 为别人、isadmin 为 1）再提交，服务器不做校验就信任了。防护：①Cookie 不存敏感信息，只存随机会话 ID；②必须存时加签名/加密（HMAC 或加密防篡改）；③服务端二次校验；④设置 HttpOnly（防 JS 读取）。","formula":"","example":"网站把 level=0 存 Cookie 表示普通用户，攻击者改成 level=1 提交，就能访问管理员功能——服务器没验证 Cookie 真伪。","keywords":["cookie欺骗","修改cookie","伪造cookie","客户端数据","防篡改"],"related":["w3-20","w3-22","w1-6"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w3-22","ch":"w3","tag":"websec","t":"Session固定攻击是什么？","answer":"Session 固定攻击：攻击者先自己拿到一个合法 SessionID（访问目标网站获得），再诱导受害者使用这个 ID 登录（如把带 SessionID 的链接发给受害者），受害者登录后服务器若未更换 SessionID，攻击者就用自己已知的那个 ID 冒充受害者。防护：用户登录成功后必须调用 session_regenerate_id() 重新生成会话 ID，使“登录前”与“登录后”的会话隔离。","formula":"","example":"攻击者访问论坛拿到 SID=abc，发链接 http://bbs/login.php?SID=abc 给管理员，管理员用它登录后，攻击者直接用 SID=abc 进入管理员会话。","keywords":["session固定","session fixation","会话固定","登录前设置"],"related":["w3-20","w3-23"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w3-23","ch":"w3","tag":"websec","t":"XSS跨站脚本攻击的原理是什么？","answer":"XSS（跨站脚本）：网站把用户输入的内容未做转义就输出到页面，用户输入的 HTML/JavaScript 被浏览器当成代码执行。三类：反射型——恶意脚本在 URL 里，一次性“弹回”给点击链接的人；存储型——脚本存进数据库，所有访问该页面的人都被执行（危害最大，如留言板挂马）；DOM 型——通过修改页面 DOM 触发，纯前端。XSS 可窃取 Cookie/会话、钓鱼、键盘记录、篡改页面、挖矿。","formula":"","example":"留言板直接输出恶意脚本代码（例如把 document.cookie 发往攻击者服务器），每个看留言的人 Cookie 都被偷走。","keywords":["xss","跨站脚本","反射型","存储型","dom型","脚本注入"],"related":["w3-24","w3-25","w3-26"]},{"bk":"websec","bkt":"Web安全程序设计与实践（第二版）","id":"w3-24","ch":"w3","tag":"websec","t":"XSS攻击能造成哪些危害？","answer":"XSS 的危害：①窃取 Cookie/Session——把 document.cookie 发给攻击者服务器，实现会话劫持；②钓鱼——在页面伪造登录框骗取账号密码；③键盘记录——注入脚本监听用户输入；④篡改页面内容、植入恶意链接；⑤用受害者身份执行操作（改密码、转账）；⑥挖矿脚本、勒索弹窗。存储型 XSS 像“网页病毒”，每个访问者都可能中招；配合 CSRF 危害更大。","formula":"","example":"论坛植入“看视频”链
