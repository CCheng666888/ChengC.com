<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原画贴图与四肢扩展 · 审核</title><style>*{box-sizing:border-box}body{margin:0;background:#151922;color:#e6e6dd;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:auto;padding:30px 24px}a{color:#bbc4d7;font-size:12px;text-decoration:none}h1{font:600 27px "Songti SC",serif;margin:28px 0 12px}p{font-size:12px;color:#aab2c2;line-height:1.8}#board{position:relative;background:#1b2230;border:1px solid #65758944}canvas{display:block;width:100%;pointer-events:none}.name{position:absolute;pointer-events:none;font-size:12px;color:#ccd6e6;transform:translateX(-50%)}.name:first-of-type{color:#dec78f}</style></head><body><main><a href="../contact.html">← 返回会客室</a><h1>原版画面 · 小身体与四肢</h1><p>脸和发型直接保留原版贴图，补出能活动的身体、双臂和双腿。这里放大查看；会客室里会以更小尺寸活动。嬴政沿用先前单独设计的参考图。</p><div id="board" role="img" aria-label="十二位角色保留原画贴图、补出身体四肢的整组审核"></div></main><script type="module">
import * as T from '../js/vendor/three.module.min.js';import {characters} from '../js/character-data.js';import {createTextureCharacter,animateTextureCharacter} from '../js/character-extensions.js?v=extended-sd-20261003';
const host=document.getElementById('board'),renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setScissorTest(true);renderer.setClearColor(0x1b2230,1);host.append(renderer.domElement);
const entries=await Promise.all(characters.map(async c=>{const rig=await createTextureCharacter(c.id),scene=new T.Scene();scene.add(rig.root);const label=document.createElement('span');label.className='name';label.textContent=c.name;host.append(label);return {rig,scene,label};}));let width=0,height=0,cols=6,last=0;
function resize(){width=host.clientWidth;cols=width<650?3:6;height=Math.ceil(entries.length/cols)*(width/cols*1.38);renderer.setSize(width,height);entries.forEach((e,i)=>{e.label.style.left=((i%cols+.5)*width/cols)+'px';e.label.style.top=((Math.floor(i/cols)+1)*height/Math.ceil(entries.length/cols)-28)+'px';});}new ResizeObserver(resize).observe(host);resize();
function render(time){requestAnimationFrame(render);if(time-last<65)return;last=time;renderer.setScissor(0,0,width,height);renderer.clear();entries.forEach((entry,i)=>{const cw=width/cols,ch=cw*1.38,row=Math.floor(i/cols),camera=new T.OrthographicCamera(-.95,.95,1.32,-1.32,.1,20);camera.position.set(0,1.1,5);camera.lookAt(0,1.1,0);animateTextureCharacter(entry.rig,time/1000+i,false,(time/1000+i)%12>8);renderer.setViewport((i%cols)*cw,height-(row+1)*ch,cw,ch);renderer.setScissor((i%cols)*cw,height-(row+1)*ch,cw,ch);renderer.render(entry.scene,camera);});}requestAnimationFrame(render);
</script></body></html>
