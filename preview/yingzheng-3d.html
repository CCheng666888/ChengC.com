<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嬴政 · 三维模型审核</title><style>
*{box-sizing:border-box}body{margin:0;background:#18191e;color:#eee0bf;font-family:system-ui,"Microsoft YaHei",sans-serif}main{max-width:1120px;margin:auto;padding:36px 30px}a{color:#c9b78e;text-decoration:none;font-size:12px}h1{font:600 32px "Songti SC",serif;letter-spacing:.1em;margin:32px 0 10px}p{font-size:12px;color:#b6ae9d;line-height:1.9}#views{height:520px;border:1px solid #b49c673b;background:radial-gradient(ellipse at 50% 70%,#494237,#222126 75%)}canvas{display:block;width:100%;height:100%;pointer-events:none}.labels{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-size:11px;padding:16px;color:#bbaa85}.note{margin-top:28px}@media(max-width:680px){main{padding:24px 16px}#views{height:380px}h1{font-size:27px}}
</style></head><body><main><a href="../contact.html">← 返回会客室</a><h1>嬴政 · 三维重建稿</h1><p>黑金秦服、冕冠垂旒、简牍、佩剑。参照先前设计稿制作的独立模型，供单独审核。</p><div id="views" role="img" aria-label="嬴政三维模型的正面、侧面、背面"></div><div class="labels"><span>正面</span><span>侧面</span><span>背面</span></div><p class="note">十二个角色均以立体网格重建；此稿不是官方游戏模型。会客室内角色自行活动，无拖动或操控入口。</p><a href="../assets/contact/models/yingzheng.glb" download>下载嬴政三维模型 GLB ↓</a></main><script type="module">
import * as T from '../js/vendor/three.module.min.js';
import {createCharacter} from '../js/character-models.js?v=3d-20261003';
const host=document.getElementById('views'),renderer=new T.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setClearColor(0,0);renderer.setScissorTest(true);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;host.append(renderer.domElement);
const scenes=[0,Math.PI/2,Math.PI].map(angle=>{const scene=new T.Scene(),rig=createCharacter('yingzheng');rig.root.rotation.y=angle;scene.add(rig.root);rig.prop.visible=true;scene.add(new T.HemisphereLight(0xfff0d1,0x4a4351,2.4));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(-2,5,5);scene.add(sun);const rim=new T.DirectionalLight(0xc1b195,1.4);rim.position.set(2,3,-3);scene.add(rim);return scene;});
function draw(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);renderer.clear();scenes.forEach((scene,i)=>{const width=w/3,aspect=width/h,vertical=Math.max(2.7,1.38/aspect),camera=new T.OrthographicCamera(-vertical*aspect/2,vertical*aspect/2,vertical/2,-vertical/2,.1,30);camera.position.set(0,1.65,5);camera.lookAt(0,1,0);renderer.setViewport(i*width,0,width,h);renderer.setScissor(i*width,0,width,h);renderer.render(scene,camera);});}new ResizeObserver(draw).observe(host);draw();
</script></body></html>
