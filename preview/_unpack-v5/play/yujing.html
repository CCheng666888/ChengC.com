const W=1280,H=720,FLOOR=589,NET=640,NETTOP=369,GRAV=630;
let state='menu',mode='adventure',level=1,skin='stick',miracle=false,muted=false,audioCtx=null;
let player,enemy,shuttle,score=[0,0],lastHit='p',rally=0,serveSide='p',timer=0,pointFlash='',messageTime=0,clock=0,particles=[],trail=[],storyTarget=7;
const keys=new Set();
function tone(freq,len=.08){if(muted)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+len);o.start();o.stop(audioCtx.currentTime+len);}catch(e){}}
function show(html){overlay.innerHTML='<div class="panel">'+html+'</div>';overlay.classList.remove('hidden');}
function hide(){overlay.classList.add('hidden');}
function menu(){state='menu';keys.clear();show('<div class="eyebrow">CHOOSE YOUR MATCH · v'+VERSION+'</div><h2>今晚，如何开场？</h2><p>选择比赛模式。</p><div class="choices"><button class="mode" id="adventure"><em>01 / ADVENTURE</em><b>冒险模式</b><span>单场比赛 · 11 分制</span><span class="go">选择角色 ↗</span></button><button class="mode" id="story"><em>02 / STORY</em><b>故事模式</b><span>两章比赛 · 可选角色</span><span class="go">选择角色 ↗</span></button></div>');document.getElementById('adventure').onclick=()=>{mode='adventure';skin='stick';level=1;miracle=false;selectSkin();};document.getElementById('story').onclick=()=>{mode='story';skin='athlete';selectSkin();};updateHud();hint.textContent='';}
function selectSkin(){state='select';const choices=ROSTER.filter(r=>mode==='story'||!r.storyOnly);if(!choices.some(r=>r.id===skin))skin=choices[0].id;show('<div class="eyebrow">'+(mode==='story'?'STORY':'ADVENTURE')+' / 角色选择</div><h2>选择你的角色</h2><div class="roster">'+choices.map(({id,name})=>'<button class="skin '+(skin===id?'active':'')+'" id="'+id+'" aria-pressed="'+(skin===id)+'"><canvas class="model-preview" id="preview-'+id+'" width="300" height="210" aria-label="'+name+'模型"></canvas><span>'+name+'</span></button>').join('')+'</div><div class="row" style="margin-top:16px"><button class="action" id="begin">'+(mode==='story'?'进入第一章':'开始比赛')+'</button><button class="secondary" id="back">返回</button></div>');for(const {id} of choices){document.getElementById(id).onclick=()=>{skin=id;selectSkin();};const g=document.getElementById('preview-'+id).getContext('2d');g.clearRect(0,0,300,210);g.save();g.translate(140,191);drawCharacterModel(g,id,{walk:0,y:FLOOR,swing:0}, {hx:32,hy:-86},false);g.restore();}document.getElementById('begin').onclick=()=>{level=1;miracle=mode==='story'&&Math.random()<.01;storyTarget=4+Math.floor(Math.random()*3);opponentName='';if(mode==='story')chapter();else startMatch();};document.getElementById('back').onclick=menu;}
function chapter(){state='chapter';const second=level===2;show('<div class="eyebrow">CHAPTER 0'+level+'</div><h2>第'+(second?'二':'一')+'章</h2><p>'+(second?'100zz 球拍 · 65z4 羽毛球鞋':'普通球拍 · 普通羽毛球鞋')+'</p><div class="row"><button class="action" id="play">开始比赛</button><button class="secondary" id="back">返回菜单</button></div>');document.getElementById('play').onclick=startMatch;document.getElementById('back').onclick=menu;}
function actor(x){return{x,y:FLOOR,vy:0,swing:0,cool:0,walk:0,smash:false};}
function startMatch(){if(mode==='story'&&skin==='athlete')opponentName='cmc';else if(mode==='adventure'||level===1||!opponentName)opponentName=randomOpponentName();score=[0,0];player=actor(300);enemy=actor(995);particles=[];trail=[];timer=0;serveSide='p';resetRally();hide();updateHud();tone(500,.16);}
function resetRally(){state='serve';shuttle={x:player.x+45,y:player.y-100,vx:0,vy:0};lastHit='p';rally=0;trail=[];player.y=enemy.y=FLOOR;player.vy=enemy.vy=0;player.cool=enemy.cool=0;hint.textContent='';timer=serveSide==='p'?0:1.1;}
function updateHud(){document.getElementById('ps').textContent=score[0];document.getElementById('es').textContent=score[1];document.querySelector('.score span:first-child').textContent=state==='menu'?'你':characterName();document.querySelector('.score span:last-child').textContent=state==='menu'?'对手':opponentName||'对手';document.getElementById('modeLabel').textContent=state==='menu'?'中央球场 · 夜场':mode==='story'?'故事 · 第 '+level+' 章':'冒险 · 正常难度';document.getElementById('gearLabel').textContent=mode==='story'&&level===2?'100zz 球拍 + 65z4 球鞋':'普通装备 · 11 分制';}
function desiredWinner(){if(mode!=='story'||miracle)return null;if(level===2)return 'e';
// Deliberately uneven runs: 0:2, 2:2, 2:5, 4:5, 4:8, then 4–6:11.
const allowance=score[1]<2?0:score[1]<5?2:score[1]<9?4:storyTarget;
return score[0]<Math.min(storyTarget,allowance)?'p':'e';}
function launch(side,smash=false){lastHit=side;rally++;const target=side==='p'?910+Math.random()*245:140+Math.random()*380;const isSmash=smash&&shuttle.y<380;let duration=isSmash?.64:1.22+Math.random()*.19;shuttle.vx=(target-shuttle.x)/duration;shuttle.vy=(FLOOR-8-shuttle.y-.5*GRAV*duration*duration)/duration;
// Every shot clears the net. Lift low returns enough before crossing.
const cross=(NET-shuttle.x)/shuttle.vx;if(cross>0&&cross<duration){const atNet=shuttle.y+shuttle.vy*cross+.5*GRAV*cross*cross;if(atNet>NETTOP-18)shuttle.vy-=(atNet-NETTOP+28)/cross;}
const hitter=side==='p'?player:enemy;if(hitter.swing<=0)hitter.swing=.24;tone(isSmash?250:620,.07);for(let i=0;i<7;i++)particles.push({x:shuttle.x,y:shuttle.y,vx:(Math.random()-.5)*160,vy:(Math.random()-.5)*160,life:.4});hint.textContent='';}
function racketPose(a,side){const sign=side==='p'?1:-1,t=a.swing>0?1-Math.min(a.swing,.24)/.24:0;const hx=a.swing>0?48+18*Math.sin(t*Math.PI):32,hy=a.swing>0?-60-86*t:-86;const upgraded=side==='p'&&mode==='story'&&level===2;return{hx,hy,x:a.x+sign*(hx+29),y:a.y+hy-40,rx:upgraded?22:18,ry:upgraded?29:25,angle:sign*.5};}
function grounded(){return shuttle.y+4>=FLOOR;}
function contact(a,side){if(state!=='play'||a.swing<=0||grounded()||lastHit===side||shuttle.x<25||shuttle.x>1255)return false;if(side==='p'?shuttle.x>=NET-7:shuttle.x<=NET+7)return false;const r=racketPose(a,side),dx=shuttle.x-r.x,dy=shuttle.y-r.y,c=Math.cos(r.angle),s=Math.sin(r.angle);return Math.pow((dx*c+dy*s)/(r.rx+4),2)+Math.pow((-dx*s+dy*c)/(r.ry+4),2)<=1;}
function resolveGround(){if(state==='play'&&(grounded()||shuttle.x<25||shuttle.x>1255)){shuttle.y=Math.min(shuttle.y,FLOOR-4);point(shuttle.x<NET?'e':'p');return true;}return false;}
function swing(smash=false){if(state==='serve'&&serveSide==='p'){state='play';player.swing=.24;const r=racketPose(player,'p');shuttle.x=r.x;shuttle.y=r.y;launch('p',false);return;}if(state!=='play'||resolveGround()||player.cool>0)return;player.swing=.24;player.cool=.32;player.smash=smash;if(contact(player,'p'))launch('p',smash);else tone(160,.03);}
function point(winner){if(state!=='play')return;let scripted=desiredWinner();if(scripted)winner=scripted;score[winner==='p'?0:1]++;serveSide=winner;pointFlash=winner==='p'?'你得分':'对手得分';hint.textContent='';timer=1.5;state='point';updateHud();tone(winner==='p'?880:210,.22);}
function matchEnd(){state='result';keys.clear();const won=score[0]===11;
if(mode==='story'&&level===1){show('<section class="interlude" role="dialog" aria-modal="true" aria-label="课桌旁的对话"><div class="eyebrow">第一章结束 · '+score[0]+' : '+score[1]+'</div><h2>回到座位后……</h2><div class="dialogue"><p><b>'+characterName()+'：</b>“'+(won?'这局赢了，可我还有好多球没打好，想再打一场。':'我明明跑到位了，怎么还是输了？有几个球就差一点！越想越不甘心。')+'”</p><p><b>同桌：</b>“你刚才都念叨一路了。先喝口水，别急。”</p><p><b>'+characterName()+'：</b>“'+(won?'我想试试新装备，再认真打一局。':'我就是想不明白，练了这么久，怎么就拿不下来呢？')+'”</p><p><b>同桌：</b>“那就换上100zz和65z4，再去打一场。球场上见分晓。”</p></div><div class="interlude-footer"><button class="action" id="next">我不服</button></div></section>');document.getElementById('next').onclick=()=>{if(state!=='result'||level!==1)return;level=2;startMatch();};return;}
show('<div class="eyebrow">MATCH COMPLETE / '+(mode==='story'?'CHAPTER 0'+level:'ADVENTURE')+'</div><h2>'+(won?'比赛获胜':'比赛结束')+'</h2><div style="font-size:48px;color:#d8ff70;margin:12px 0">'+score[0]+' <span style="color:#697a63">:</span> '+score[1]+'</div><div class="row"><button class="action" id="next">再来一场</button><button class="secondary" id="exit">返回菜单</button></div>');document.getElementById('next').onclick=()=>{if(mode==='story'){level=1;selectSkin();}else startMatch();};document.getElementById('exit').onclick=menu;}
function showPauseMenu(){show('<div class="eyebrow">PAUSED · v'+VERSION+'</div><h2>比赛已暂停</h2><p>按 P 或点击“继续比赛”返回球场。</p><div class="row"><button class="action" id="resume">继续比赛</button><button class="secondary" id="pauseHome">回到主页面</button><button class="secondary" id="pauseExit">退出游戏</button></div>');document.getElementById('resume').onclick=pause;document.getElementById('pauseHome').onclick=()=>confirmLeave('home');document.getElementById('pauseExit').onclick=()=>confirmLeave('exit');}
function pause(){if(state==='paused'){state=pause.previous;hide();return;}if(!['play','serve','point'].includes(state))return;pause.previous=state;state='paused';keys.clear();showPauseMenu();}
