  <title>一念天下 · 历史卡牌策略</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23090b0a'/%3E%3Cpath d='M16 17h32v7H16zm5 12h22v20H21z' fill='none' stroke='%23b99654' stroke-width='4'/%3E%3Cpath d='M27 29v20m10-20v20' stroke='%23b99654' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#080a09;--ink2:#101410;--panel:rgba(14,17,14,.94);--panel2:#171c17;--bronze:#a98546;--gold:#d5b873;--jade:#739582;--cinnabar:#9d3b2e;--paper:#d7c7a3;--text:#eee7d7;--muted:#aaa28f;--line:rgba(213,184,115,.22);--shadow:0 22px 70px rgba(0,0,0,.55)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:var(--text);font-family:"Noto Serif SC","Songti SC",SimSun,serif}body{min-height:100vh;overflow-x:hidden}button{font:inherit;color:inherit}.hidden{display:none!important}.app{min-height:100vh;position:relative;background:linear-gradient(90deg,rgba(4,7,5,.96),rgba(4,7,5,.74) 52%,rgba(4,7,5,.88)),var(--game-art,none) center/cover fixed}.app:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.014) 1px,transparent 1px);background-size:5px 5px;mix-blend-mode:screen;opacity:.35}.screen{min-height:100vh;animation:reveal .42s ease both}@keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
    .menu{display:grid;grid-template-columns:minmax(300px,630px) 1fr;align-items:center;gap:8vw;padding:clamp(32px,6vw,90px);min-height:100vh}.seal{width:62px;height:62px;border:2px solid #b64b39;color:#d76b58;display:grid;place-items:center;font-size:26px;line-height:1;transform:rotate(-4deg);box-shadow:inset 0 0 0 4px #160b08}.kicker{margin:24px 0 9px;color:var(--gold);font:600 13px/1.5 system-ui,sans-serif;letter-spacing:.28em}.title{font-size:clamp(64px,10vw,130px);line-height:.92;letter-spacing:.12em;margin:0;text-shadow:0 4px 25px #000}.motto{margin:28px 0 42px;padding-left:18px;border-left:2px solid var(--bronze);max-width:560px;color:#c7bda8;font-size:clamp(17px,2vw,21px);line-height:1.9}.menu-actions{display:flex;gap:12px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:rgba(12,15,12,.78);min-height:48px;padding:11px 20px;cursor:pointer;letter-spacing:.08em;transition:.2s}.btn:hover:not(:disabled),.btn:focus-visible{border-color:var(--gold);background:#24271f;transform:translateY(-2px)}.btn.primary{background:linear-gradient(135deg,#8f6e36,#c29e59);color:#100d08;border-color:#d7ba7e;font-weight:800}.btn.danger{color:#d27b6c}.btn:disabled{opacity:.35;cursor:not-allowed}.menu-side{justify-self:end;width:min(390px,100%);padding:26px;border:1px solid var(--line);background:rgba(8,10,8,.72);backdrop-filter:blur(14px);box-shadow:var(--shadow)}.menu-side h2{margin:0 0 8px;font-size:22px}.menu-side p{color:var(--muted);line-height:1.75}.save-row,.fact-row{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-top:1px solid var(--line);font:14px/1.5 system-ui,sans-serif}.save-row span,.fact-row span{color:var(--muted)}
    .topbar{height:74px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:0 clamp(16px,3vw,44px);background:rgba(8,10,8,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}.brand{font-size:22px;letter-spacing:.18em;color:var(--gold);white-space:nowrap}.crumb{min-width:0;color:var(--muted);font:14px/1.5 system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-stats{margin-left:auto;display:flex;gap:9px}.pill{padding:7px 11px;border:1px solid var(--line);background:#151914;font:13px/1.2 system-ui,sans-serif;white-space:nowrap}.pill b{color:var(--gold)}.save-indicator{color:#88a993}.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:19px}
    .game-shell{display:grid;grid-template-columns:270px minmax(430px,1fr) 300px;gap:18px;padding:18px clamp(14px,2vw,30px) 160px;max-width:1600px;margin:auto}.rail,.scene,.record{border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}.rail,.record{padding:20px;height:max-content;position:sticky;top:92px}.section-label{font:700 12px/1.4 system-ui,sans-serif;color:var(--gold);letter-spacing:.18em}.rail h2,.record h2{font-size:19px;margin:8px 0 12px}.objective{color:#d4cbb8;line-height:1.7}.meter{margin:15px 0}.meter-head{display:flex;justify-content:space-between;font:13px/1.4 system-ui,sans-serif;color:var(--muted);margin-bottom:7px}.bar{height:5px;background:#252920}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bronze),var(--gold))}.relations{display:grid;gap:8px;margin-top:13px}.relation{display:grid;grid-template-columns:1fr auto;gap:5px;padding:10px;background:#141813;border-left:2px solid var(--jade);font:13px/1.4 system-ui,sans-serif}.relation small{grid-column:1/-1;color:var(--muted)}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.tag{padding:5px 8px;border:1px solid #7d673b;color:#d6bd82;font:12px/1.3 system-ui,sans-serif}.empty{color:#777160;font:13px/1.6 system-ui,sans-serif}
    .scene{min-height:650px}.scene-head{padding:clamp(22px,4vw,44px);border-bottom:1px solid var(--line);background:linear-gradient(140deg,rgba(147,108,48,.12),transparent 60%)}.chapter-line{display:flex;align-items:center;justify-content:space-between;gap:15px;color:var(--gold);font:13px/1.4 system-ui,sans-serif;letter-spacing:.1em}.status-badge{border:1px solid currentColor;padding:4px 8px;letter-spacing:.04em}.scene h1{font-size:clamp(32px,5vw,57px);line-height:1.12;margin:18px 0}.background{color:#c9c0ac;line-height:1.9;font-size:17px;margin:0;max-width:850px}.scene-body{padding:clamp(20px,4vw,42px)}.stage-title{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:18px}.stage-title:after{content:"";height:1px;background:var(--line);flex:1}.narrative{color:#c3b9a5;line-height:1.85}.intel{margin:18px 0;padding:16px 18px;border-left:3px solid var(--jade);background:rgba(63,94,75,.12);color:#cbd9cf;line-height:1.75}.plan{min-height:58px;margin:18px 0;padding:13px 15px;border:1px dashed var(--line);display:flex;align-items:center;gap:8px;flex-wrap:wrap}.plan-chip{padding:5px 8px;background:#29271d;color:#e2ca91;font:13px/1.3 system-ui,sans-serif}.hand-title{display:flex;justify-content:space-between;align-items:end;margin-top:28px}.hand-title h3{margin:0}.hand-title span{color:var(--muted);font:13px/1.4 system-ui,sans-serif}.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:11px;margin:14px 0 22px}.card{position:relative;text-align:left;min-height:194px;padding:14px;border:1px solid var(--line);background:linear-gradient(155deg,#1f241e,#10130f);cursor:pointer;transition:.2s;overflow:hidden}.card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--card-color)}.card:hover:not(:disabled){transform:translateY(-5px);border-color:var(--card-color)}.card.selected{outline:2px solid var(--gold);background:#292a20}.card:disabled{opacity:.35;cursor:not-allowed}.card-type{font:700 11px/1.4 system-ui,sans-serif;color:var(--card-color);letter-spacing:.14em}.card h4{font-size:18px;margin:16px 0 8px}.card p{color:var(--muted);font:13px/1.65 system-ui,sans-serif;margin:0}.card-cost{position:absolute;right:11px;top:11px;width:25px;height:25px;display:grid;place-items:center;border:1px solid var(--card-color);border-radius:50%;font:700 12px/1 system-ui,sans-serif}.card-person{--card-color:#b68d55}.card-authority{--card-color:#b94f3e}.card-intel{--card-color:#6a9b82}.card-resource{--card-color:#9b9166}.card-strategy{--card-color:#7d78ad}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:20px}.hint{color:var(--muted);font:13px/1.6 system-ui,sans-serif}.record-list{display:grid;gap:10px}.record-item{padding:12px;background:#131712;border-left:2px solid var(--bronze)}.record-item strong{display:block;font-size:14px}.record-item span{font:12px/1.5 system-ui,sans-serif;color:var(--muted)}.truth{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font:13px/1.7 system-ui,sans-serif;color:var(--muted)}.truth b{color:#c8b580}
    .result{width:min(760px,calc(100% - 30px));margin:7vh auto;padding:clamp(25px,5vw,54px);border:1px solid var(--line);background:rgba(10,12,10,.95);box-shadow:var(--shadow)}.result-mark{font-size:13px;letter-spacing:.2em;color:var(--gold)}.result h1{font-size:clamp(36px,7vw,70px);margin:15px 0}.grade{display:inline-block;padding:5px 10px;border:1px solid var(--gold);color:var(--gold)}.result-copy{font-size:18px;line-height:1.9;color:#cec5b2}.consequences{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:24px 0}.consequence{padding:13px;background:#151914;color:#c9c0ac;font:14px/1.5 system-ui,sans-serif}.history-note{padding:16px;border-left:3px solid var(--cinnabar);background:#1d1310;color:#cdb8ad;line-height:1.75}.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
    .chapter-select{max-width:1050px;margin:auto;padding:90px 24px}.chapter-select header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:30px}.chapter-select h1{font-size:clamp(42px,7vw,74px);margin:0}.chapter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.chapter-card{padding:24px;border:1px solid var(--line);background:var(--panel);min-height:280px;display:flex;flex-direction:column}.chapter-card.locked{opacity:.45}.chapter-card small{color:var(--gold)}.chapter-card h2{margin:14px 0 8px;font-size:26px}.chapter-card p{color:var(--muted);line-height:1.7}.chapter-card .btn{margin-top:auto;width:100%}
    .modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.76);backdrop-filter:blur(8px)}.modal-box{width:min(520px,100%);padding:28px;border:1px solid var(--line);background:#10130f;box-shadow:var(--shadow)}.modal-box h2{margin-top:0}.modal-box p{color:var(--muted);line-height:1.7}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}

    .scene-art{position:relative;aspect-ratio:16/7;margin:20px 0 22px;overflow:hidden;border:1px solid var(--line);background-position:center;background-size:cover;box-shadow:inset 0 -90px 80px rgba(0,0,0,.65)}.scene-art:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,3,.2),transparent 55%,rgba(3,5,3,.15))}.scene-art span{position:absolute;z-index:1;left:14px;bottom:12px;padding:5px 9px;background:rgba(6,8,6,.8);border-left:2px solid var(--gold);font:12px/1.4 system-ui,sans-serif;color:#d6ccb7}.intel{animation:reveal .25s ease}.plan-chip{animation:reveal .18s ease}.card{transition:transform .2s,border-color .2s,background .2s,opacity .2s}.card-art{height:92px;margin:-14px -14px 12px;background-image:linear-gradient(0deg,rgba(12,15,12,.55),transparent 60%),url('portraits.png');background-size:300% 100%;background-repeat:no-repeat;border-bottom:1px solid var(--line);filter:saturate(.78)}.card-glyph{width:44px;height:44px;margin:12px 0 2px;display:grid;place-items:center;border:1px solid var(--card-color);border-radius:50%;color:var(--card-color);font-size:20px;background:rgba(0,0,0,.18)}.chapter-card{padding:0 24px 24px;min-height:360px;overflow:hidden}.chapter-art{height:130px;margin:0 -24px 20px;background-position:center;background-size:cover;filter:saturate(.72);border-bottom:1px solid var(--line)}.coach{position:fixed;z-index:45;left:50%;bottom:18px;transform:translateX(-50%);width:min(720px,calc(100% - 28px));padding:18px 20px;border:1px solid #d0ad62;background:rgba(10,13,10,.97);box-shadow:0 20px 80px #000;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}.coach-step{width:54px;height:54px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font:700 13px/1 system-ui,sans-serif}.coach h3{margin:0 0 5px;font-size:18px}.coach p{margin:0;color:#c8bfad;font:14px/1.65 system-ui,sans-serif}.coach-types{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.coach-types b{padding:3px 7px;border:1px solid var(--line);font-size:12px;color:var(--gold)}.coach-focus{position:relative;z-index:46!important;outline:3px solid #e0bb68!important;box-shadow:0 0 0 7px rgba(224,187,104,.18),0 0 30px rgba(224,187,104,.35)!important}.tutorial-summary{margin:22px 0;padding:18px;border:1px solid var(--line);background:#141913}.tutorial-summary h2{margin:0 0 8px;font-size:20px}.tutorial-summary p{margin:0;color:var(--muted);line-height:1.75}
    @media(max-width:1100px){.game-shell{grid-template-columns:220px 1fr}.record{position:static;grid-column:1/-1}.record-list{grid-template-columns:repeat(3,1fr)}.menu{grid-template-columns:1fr}.menu-side{justify-self:start}.chapter-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:760px){.menu{padding:28px 20px;align-content:center}.title{font-size:62px}.menu-side{display:none}.topbar{height:auto;min-height:68px;flex-wrap:wrap;padding-block:10px}.crumb{order:3;width:100%}.top-stats{margin-left:0;flex:1}.game-shell{display:block;padding:12px 12px 230px}.rail,.record{position:static;margin-bottom:12px}.scene{min-height:0}.relations{grid-template-columns:1fr 1fr}.hand{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:185px}.actions{align-items:stretch;flex-direction:column}.actions .btn{width:100%}.record-list{grid-template-columns:1fr}.chapter-grid{grid-template-columns:1fr}.chapter-select header{align-items:flex-start;flex-direction:column}.consequences{grid-template-columns:1fr}.coach{grid-template-columns:auto 1fr;bottom:8px}.coach .btn{grid-column:1/-1;width:100%}.coach-step{width:44px;height:44px}}

    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
