 attendant:{id:'attendant',type:'person',name:'少年侍从',cost:1,text:'从近身见闻中辨认谁在真正发号施令。'},observe:{id:'observe',type:'intel',name:'观察朝堂',cost:1,text:'揭示当前事件的一条隐藏条件。',investigate:true},silence:{id:'silence',type:'strategy',name:'保持沉默',cost:1,text:'暂不表态，让更多人的立场暴露。'},identity:{id:'identity',type:'authority',name:'王的身份',cost:2,text:'提出明确要求；身份真实，执行力却仍有限。'},

{id:'handan',chapter:'第一章 · 邯郸归秦',year:'前257年前后',title:'赵国少年',objective:'在邯郸的危险环境中取得可靠信息，并决定信任谁。',background:'秦赵交兵的阴影笼罩邯郸。你是秦国质子之子，身份既可能换来保护，也可能招来报复。街巷里出现关于搜捕的传言，而秦国使者传来的消息与赵国伙伴所说并不一致。',truth:'史实：嬴政生于赵国邯郸，其父子楚曾为秦质子；围城与归秦过程见《史记》。本关少年伙伴、密信与搜捕细节为艺术加工。',source:'史实依据：《史记·吕不韦列传》',ap:4,authority:7,intel:'两份消息的时间对不上：使者口中的“今夜出城”，比城门换防早了整整一日。',cards:['zhaoFriend','qinEnvoy','observe','hide','probe','time'],relations:[['母亲',72,'共同求生'],['赵国伙伴',38,'尚未交心'],['秦国使者',30,'目的不明']],resolve(sel){if(sel.includes('observe')&&sel.includes('hide'))return R('隐线解法','你没有追问真假，而是先隐藏身份、观察换防。使者传的是试探性消息，真正的接应尚未抵达。','善于观察',[['隐藏情报',12],['风险',-8]],'你避开了一次过早行动，并记住：消息的价值取决于谁希望你相信它。');if(sel.includes('zhaoFriend')&&sel.includes('probe'))return R('关系解法','你用无关紧要的传闻试探伙伴。他没有把消息卖给巡卒，反而带你认出一条安全的市井路线。','重视关系',[['赵国伙伴',18],['情报',6]],'这段关系可能在未来成为邯郸旧识，也可能因你继续试探而破裂。');if(sel.includes('qinEnvoy')&&sel.includes('identity'))return R('高风险解法','你亮明身份要求使者立刻安排离城。对方被迫行动，搜捕也随之收紧。','主动出击',[['秦国网络',12],['风险',10]],'你得到了秦国方面的注意，但也让更多人知道了你的位置。');return R('保留机会','你收集到零散消息，却没有形成完整判断。危险没有爆发，可靠的关系也尚未建立。','谨慎求生',[['风险',-2]],'失败没有结束故事，但下一关的初始情报会更少。');}},

function R(grade,text,tag,deltas,epilogue){return{grade,text,tag,deltas,epilogue}}
function fresh(){return{version:VERSION,screen:'menu',level:0,unlocked:0,completed:[],tags:[],relations:{},stats:{王权:18,情报:0,风险:0,朝臣支持:35,相国影响:50},history:[],selected:[],revealed:false,bonusUsed:false,tutorialStep:0,savedAt:Date.now()}}
let state=load(),currentResult=null;
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===VERSION)return{...fresh(),...v,screen:'menu',selected:[]}}catch{}return fresh()}
function save(show=false){state.savedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify({...state,screen:'menu',selected:[]}));if(show)toast('进度已保存')}catch{toast('浏览器阻止了本地保存')}updateSaveLabel()}
function reset(){localStorage.removeItem(KEY);state=fresh();currentResult=null;render('menu',true);toast('进度已重置')}
function route(screen,push=true){state.screen=screen;if(push)history.pushState({screen},'',screen==='menu'?'#home':'#'+screen);render(screen)}
window.addEventListener('popstate',e=>render(e.state?.screen||'menu'));
function render(screen=state.screen,replace=false){state.screen=screen;const app=document.getElementById('app');app.innerHTML=screen==='menu'?menu():screen==='chapters'?chapters():screen==='game'?game():result();decorate(screen);window.scrollTo({top:0,behavior:replace?'auto':'smooth'});bind();if(replace)history.replaceState({screen},'',screen==='menu'?'#home':'#'+screen)}
function artFor(level){return level.id==='handan'?['handan.png','邯郸质居 · 游戏概念场景']:['qin-court.png',level.id==='tutorial'?'第一次面对朝臣 · 游戏概念场景':'少年秦王朝堂 · 游戏概念场景']}
function decorate(screen){if(screen==='game'){const l=getLevel(),a=artFor(l),title=document.querySelector('.scene-head h1');title?.insertAdjacentHTML('afterend',`<div class="scene-art" style="background-image:url('${a[0]}')"><span>${a[1]}</span></div>`);renderCoach()}if(screen==='chapters')document.querySelectorAll('.chapter-card').forEach((card,i)=>{const a=artFor(LEVELS[i]);card.insertAdjacentHTML('afterbegin',`<div class="chapter-art" style="background-image:linear-gradient(rgba(5,7,5,.08),rgba(5,7,5,.42)),url('${a[0]}')" aria-hidden="true"></div>`)});if(screen==='result'&&getLevel().id==='tutorial'){document.querySelector('.result-actions')?.insertAdjacentHTML('beforebegin','<section class="tutorial-summary"><h2>你已经掌握了核心循环</h2><p>先读局势与目标，再比较行动点和卡牌费用；用情报揭示隐藏条件，用人物、权柄或谋略组成方案。结算产生的标签、关系与资源变化会进入后续章节。游戏会在每次出牌和结算后自动保存。</p></section>')}}
const COACH=[
 {title:'先读局势，不急着出牌',text:'左侧是目标、权威和人物关系；中间是事件与手牌；右侧会保存重要选择。先弄清问题，再决定动用什么。'},
 {title:'五类卡牌代表五种政治资源',text:'人物提供能力但有自己的立场；权柄直接下令；情报揭示条件；资源决定执行能力；谋略改变解决方式。',types:['人物','权柄','情报','资源','谋略']},
 {title:'看懂费用与行动点',text:'卡牌右上角数字是费用，顶部“行动”是本关预算。费用不足的牌会变暗；组合更强，但不能把所有牌都打出去。',target:'.top-stats .pill'},
 {title:'第一步：借助人物',text:'点击“少年侍从”。人物牌能提供能力与信息，但人物并非永久忠诚，后续关系会随选择变化。',target:'[data-card="attendant"]',wait:true},
 {title:'第二步：调查隐藏条件',text:'点击“观察朝堂”。情报牌通常不直接解决事件，却会揭示更优方案需要的线索。',target:'[data-card="observe"]',wait:true},
 {title:'第三步：组成谋略连携',text:'点击“保持沉默”。它与“观察朝堂”组合，会形成一条比直接下令更适合少年秦王的解法。',target:'[data-card="silence"]',wait:true},
 {title:'第四步：学会撤回卡牌',text:'行动点有限。再次点击已选择的“少年侍从”将它撤回，把预算留给真正构成解法的卡牌。',target:'[data-card="attendant"]',wait:true},
 {title:'执行方案并接受长期影响',text:'现在执行方案。关卡没有唯一通关方式；结算会改变标签、人物关系与后续初始局势。每次操作都会自动保存。',target:'[data-resolve]',wait:true,action:true}
];
function renderCoach(){document.querySelector('.coach')?.remove();document.querySelectorAll('.coach-focus').forEach(x=>x.classList.remove('coach-focus'));if(getLevel().id!=='tutorial'||state.completed.includes('tutorial')||state.tutorialStep>=COACH.length)return;const step=state.tutorialStep,item=COACH[step],target=item.target?document.querySelector(item.target):null;target?.classList.add('coach-focus');document.body.insertAdjacentHTML('beforeend',`<aside class="coach" aria-live="polite"><div class="coach-step">${step+1}/${COACH.length}</div><div><h3>${item.title}</h3><p>${item.text}</p>${item.types?`<div class="coach-types">${item.types.map(x=>`<b>${x}牌</b>`).join('')}</div>`:''}</div>${item.action?'<button class="btn primary" data-coach-execute>执行方案</button>':item.wait?'':`<button class="btn primary" data-coach-next>下一步</button>`}</aside>`);document.querySelector('[data-coach-next]')?.addEventListener('click',()=>{state.tutorialStep++;save();renderCoach()});document.querySelector('[data-coach-execute]')?.addEventListener('click',resolve)}
function advanceTutorial(){if(getLevel().id!=='tutorial'||state.completed.includes('tutorial'))return;const s=state.tutorialStep;if(s===3&&state.selected.includes('attendant'))state.tutorialStep=4;else if(s===4&&state.selected.includes('observe'))state.tutorialStep=5;else if(s===5&&state.selected.includes('silence'))state.tutorialStep=6;else if(s===6&&!state.selected.includes('attendant')&&state.selected.includes('observe')&&state.selected.includes('silence'))state.tutorialStep=7;renderCoach();save()}
function menu(){const has=state.completed.length||state.level>0;return `<section class="screen menu"><div><div class="seal" aria-hidden="true">秦</div><p class="kicker">历史剧情 · 卡牌策略</p><h1 class="title">一念天下</h1><p class="motto">历史提供背景，卡牌代表权力，选择创造未来。</p><div class="menu-actions"><button class="btn primary" data-go="${has?'game':'chapters'}">${has?'继续游戏':'开始游戏'}</button><button class="btn" data-go="chapters">章节选择</button><button class="btn" data-modal="records">历史记录</button></div></div><aside class="menu-side"><p class="section-label">当前进度</p><h2>${LEVELS[state.level]?.chapter||'全部完成'}</h2><p>${LEVELS[state.level]?.title||'试玩章节已经走完，你可以重玩不同路线。'}</p><div class="save-row"><span>已完成</span><b>${state.completed.length} / ${LEVELS.length}</b></div><div class="save-row"><span>历史标签</span><b>${state.tags.length}</b></div><div class="save-row"><span>保存状态</span><b id="menuSave">本机自动保存</b></div><button class="btn danger" data-modal="reset" style="width:100%;margin-top:16px">重置进度</button></aside></section>`}
function chapters(){return `<section class="screen chapter-select"><header><div><p class="kicker">卷册</p><h1>章节选择</h1></div><button class="btn" data-go="menu">返回主菜单</button></header><div class="chapter-grid">${LEVELS.map((l,i)=>`<article class="chapter-card ${i>state.unlocked?'locked':''}"><small>${l.chapter}</small><h2>${l.title}</h2><p>${l.objective}</p><p class="section-label">${l.year} · ${state.completed.includes(l.id)?'已完成':'未完成'}</p><button class="btn ${i===state.level?'primary':''}" data-level="${i}" ${i>state.unlocked?'disabled':''}>${state.completed.includes(l.id)?'重玩本关':'进入本关'}</button></article>`).join('')}</div></section>`}
function getLevel(){return LEVELS[Math.min(state.level,LEVELS.length-1)]}
function game(){const l=getLevel(),used=cost(),maxAp=l.ap+(state.bonusUsed?1:0);return `<section class="screen"><header class="topbar"><div class="brand">一念天下</div><div class="crumb">${l.chapter} / ${l.title}</div><div class="top-stats"><span class="pill">行动 <b>${maxAp-used}</b> / ${maxAp}</span><span class="pill">王权 <b>${state.stats.王权}</b></span><span class="pill save-indicator" id="saveLabel">已保存</span></div><button class="icon-btn" data-modal="pause" aria-label="打开菜单">☰</button></header><div class="game-shell"><aside class="rail"><p class="section-label">当前目标</p><h2>${l.objective}</h2><div class="meter"><div class="meter-head"><span>政治权威</span><b>${l.authority}</b></div><div class="bar"><i style="width:${l.authority}%"></i></div></div><p class="section-label">人物关系</p><div class="relations">${l.relations.map(r=>`<div class="relation"><b>${r[0]}</b><span>${relationValue(r)}</span><small>${r[2]}</small></div>`).join('')}</div><p class="section-label" style="margin-top:22px">历史标签</p><div class="tags">${state.tags.length?state.tags.map(t=>`<span class="tag">${t}</span>`).join(''):'<span class="empty">尚未形成</span>'}</div></aside><article class="scene"><div class="scene-head"><div class="chapter-line"><span>${l.chapter} · ${l.year}</span><span class="status-badge">史实框架 / 艺术加工</span></div><h1>${l.title}</h1><p class="background">${l.background}</p></div><div class="scene-body"><h2 class="stage-title">行动阶段</h2><p class="narrative">从手牌中组合你当前能够调动的政治资源。并非所有牌都能直接解决问题；情报会改变你对局势的理解。</p>${state.revealed?`<div class="intel"><b>已揭示的情报</b><br>${l.intel}</div>`:''}<div class="plan"><span class="section-label">当前方案</span>${state.selected.length?state.selected.map(id=>`<span class="plan-chip">${CARDS[id].name}</span>`).join(''):'<span class="empty">选择卡牌组成行动方案</span>'}</div><div class="hand-title"><h3>可用卡牌</h3><span>点击选取，再次点击撤回</span></div><div class="hand">${l.cards.map(id=>card(CARDS[id],maxAp-used)).join('')}</div><div class="actions"><span class="hint">已用 ${used} 点行动力 · 结算后本关选择将写入历史记录</span><button class="btn primary" data-resolve ${state.selected.length?'':'disabled'}>执行方案</button></div></div></article><aside class="record"><p class="section-label">选择记录</p><h2>你的嬴政</h2><div class="record-list">${state.history.length?state.history.slice(-4).reverse().map(h=>`<div class="record-item"><strong>${h.title}</strong><span>${h.grade} · ${h.tag}</span></div>`).join(''):'<p class="empty">重要抉择会被记录，并影响后续章节。</p>'}</div><div class="truth"><b>史实与虚构</b><br>${l.source}<br><br>${l.truth}</div></aside></div></section>`}
function relationValue(r){return Math.max(0,Math.min(100,r[1]+(state.relations[r[0]]||0)))}
function card(c,left){const selected=state.selected.includes(c.id),disabled=!selected&&c.cost>left,portrait={attendant:'0%',zhaoFriend:'50%',lv:'100%'}[c.id],glyph={authority:'令',intel:'察',resource:'资',strategy:'谋',person:'人'}[c.type];return `<button class="card card-${c.type} ${selected?'selected':''}" data-card="${c.id}" ${disabled?'disabled':''} aria-pressed="${selected}">${portrait?`<span class="card-art" style="display:block;background-position:${portrait} center" aria-hidden="true"></span>`:`<span class="card-glyph" aria-hidden="true">${glyph}</span>`}<span class="card-type">${TYPE[c.type]}</span><span class="card-cost">${c.cost}</span><h4>${c.name}</h4><p>${c.text}</p></button>`}
function cost(){return state.selected.reduce((n,id)=>n+CARDS[id].cost,0)}
function result(){const l=getLevel(),r=currentResult||state.history.at(-1)?.result;if(!r)return menu();return `<section class="screen result"><p class="result-mark">关卡结算 · ${l.chapter}</p><span class="grade">${r.grade}</span><h1>${l.title}</h1><p class="result-copy">${r.text}</p><div class="consequences"><div class="consequence"><b>获得标签</b><br>${r.tag}</div>${r.deltas.map(d=>`<div class="consequence"><b>${d[0]}</b><br>${d[1]>0?'+':''}${d[1]}</div>`).join('')}</div><p class="history-note">${r.epilogue}</p><div class="truth"><b>史实边界</b><br>${l.truth}</div><div class="result-actions">${state.level<LEVELS.length-1?'<button class="btn primary" data-next>进入下一关</button>':'<button class="btn primary" data-go="chapters">查看全部章节</button>'}<button class="btn" data-replay>重新选择</button><button class="btn" data-go="menu">返回主菜单</button></div></section>`}
function selectCard(id){const c=CARDS[id],l=getLevel();if(c.single&&state.bonusUsed)return;if(state.selected.includes(id))state.selected=state.selected.filter(x=>x!==id);else if(cost()+c.cost<=l.ap+(state.bonusUsed?1:0)){state.selected.push(id);if(c.single)state.bonusUsed=true;if(c.investigate)state.revealed=true}save();syncGameUI();advanceTutorial()}
function syncGameUI(){const l=getLevel(),used=cost(),maxAp=l.ap+(state.bonusUsed?1:0),left=maxAp-used;const action=document.querySelector('.top-stats .pill');if(action)action.innerHTML=`行动 <b>${left}</b> / ${maxAp}`;const body=document.querySelector('.scene-body'),existing=body?.querySelector('.intel');if(state.revealed&&!existing)body?.querySelector('.narrative')?.insertAdjacentHTML('afterend',`<div class="intel"><b>已揭示的情报</b><br>${l.intel}</div>`);const plan=document.querySelector('.plan');if(plan)plan.innerHTML=`<span class="section-label">当前方案</span>${state.selected.length?state.selected.map(id=>`<span class="plan-chip">${CARDS[id].name}</span>`).join(''):'<span class="empty">选择卡牌组成行动方案</span>'}`;document.querySelectorAll('[data-card]').forEach(el=>{const c=CARDS[el.dataset.card],selected=state.selected.includes(c.id);el.classList.toggle('selected',selected);el.setAttribute('aria-pressed',String(selected));el.disabled=!selected&&c.cost>left||Boolean(c.single&&state.bonusUsed&&!selected)});const hint=document.querySelector('.actions .hint');if(hint)hint.textContent=`已用 ${used} 点行动力 · 结算后本关选择将写入历史记录`;const submit=document.querySelector('[data-resolve]');if(submit)submit.disabled=!state.selected.length}
function resolve(){const l=getLevel(),r=l.resolve(state.selected,state);currentResult=r;if(l.id==='tutorial')state.tutorialStep=COACH.length;if(!state.tags.includes(r.tag))state.tags.push(r.tag);for(const [k,v] of r.deltas){if(k in state.stats)state.stats[k]+=v;else state.relations[k]=(state.relations[k]||0)+v}state.history.push({level:l.id,title:l.title,selected:[...state.selected],grade:r.grade,tag:r.tag,result:r,at:Date.now()});if(!state.completed.includes(l.id))state.completed.push(l.id);state.unlocked=Math.max(state.unlocked,Math.min(LEVELS.length-1,state.level+1));state.selected=[];save();route('result')}
function next(){state.level=Math.min(LEVELS.length-1,state.level+1);state.selected=[];state.revealed=false;state.bonusUsed=false;currentResult=null;save();route('game')}
function replay(){state.selected=[];state.revealed=false;state.bonusUsed=false;if(getLevel().id==='tutorial')state.tutorialStep=0;currentResult=null;route('game')}
function startLevel(i){state.level=i;state.selected=[];state.revealed=false;state.bonusUsed=false;if(LEVELS[i].id==='tutorial')state.tutorialStep=0;currentResult=null;save();route('game')}
function modal(kind){const box=document.getElementById('modal');let body='';if(kind==='pause')body=`<div class="modal-box"><h2>暂停</h2><p>当前选择已自动保存。你可以继续，也可以回到章节选择。</p><div class="modal-actions"><button class="btn" data-close>继续</button><button class="btn" data-go="chapters">章节选择</button><button class="btn" data-go="menu">主菜单</button></div></div>`;if(kind==='reset')body=`<div class="modal-box"><h2>重置全部进度？</h2><p>这会清除本机保存的选择、标签和人物关系，无法撤销。</p><div class="modal-actions"><button class="btn" data-close>取消</button><button class="btn danger" data-reset>确认重置</button></div></div>`;if(kind==='records')body=`<div class="modal-box"><h2>历史记录</h2><p>${state.history.length?state.history.map(h=>`${h.title}：${h.grade} / ${h.tag}`).join('<br>'):'尚无记录。完成关卡后，每次关键选择会保存在这里。'}</p><div class="modal-actions"><button class="btn" data-close>关闭</button></div></div>`;box.innerHTML=body;box.classList.remove('hidden');bind(box)}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add('hidden'),1600)}
function updateSaveLabel(){const el=document.getElementById('saveLabel');if(el){el.textContent='刚刚保存';setTimeout(()=>{if(el.isConnected)el.textContent='已保存'},900)}}
function bind(root=document){root.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>{closeModal();route(x.dataset.go)});root.querySelectorAll('[data-level]').forEach(x=>x.onclick=()=>startLevel(+x.dataset.level));root.querySelectorAll('[data-card]').forEach(x=>x.onclick=()=>selectCard(x.dataset.card));root.querySelectorAll('[data-modal]').forEach(x=>x.onclick=()=>modal(x.dataset.modal));root.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal);root.querySelectorAll('[data-reset]').forEach(x=>x.onclick=()=>{closeModal();reset()});const res=root.querySelector('[data-resolve]');if(res)res.onclick=resolve;const n=root.querySelector('[data-next]');if(n)n.onclick=next;const rp=root.querySelector('[data-replay]');if(rp)rp.onclick=replay}
render('menu',true);
})();
</script>
</body>
</html>
