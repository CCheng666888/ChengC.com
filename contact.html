  <style>
    /* Contact architecture. Paper, ink, typography and spacing follow
       the site's personal-space page. The Firefly page is backed up separately. */
    :root {
      color-scheme: light;
      --paper: #f2f3ef;
      --ink: #131311;
      --muted: #626965;
      --rule: #d5d9d4;
      --blue: #244bff;
      --brand-red: #c91e36;
      --near-y: 0px;
      --far-y: 0px;
    }
    * { box-sizing: border-box; }
    html { min-width: 280px; background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    a, button { -webkit-tap-highlight-color: transparent; }
    :is(a, button):focus-visible { outline: 2px solid var(--blue); outline-offset: 6px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
    }
    .skip-link {
      position: fixed; top: 12px; left: 12px; z-index: 10; padding: 10px 16px;
      background: var(--ink); color: var(--paper); transform: translateY(-180%);
    }
    .skip-link:focus { transform: none; }
    .site-head {
      position: relative; z-index: 2; width: 87.5%; max-width: 1440px;
      min-height: 86px; margin: auto; display: flex; align-items: center;
      justify-content: space-between; gap: 24px;
      border-bottom: 1px solid var(--rule);
    }
    .brand {
      font: 28px/1.1 Georgia, "Times New Roman", serif;
      letter-spacing: -.05em; padding-block: 12px;
    }
    .brand span { color: var(--brand-red); }
    .back-link {
      display: inline-flex; min-height: 44px; align-items: center; gap: 12px;
      font-size: 12px; color: var(--muted);
      transition: color 160ms ease;
    }
    .back-link svg { width: 20px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.2; }
    .back-link:hover { color: var(--ink); }
    .architecture {
      position: fixed; inset: 0; z-index: 0; overflow: hidden;
      pointer-events: none; user-select: none; contain: paint;
    }
    .structure { display: block; width: 100%; height: 100%; }
    .structure-mobile { display: none; }
    .structure .line { fill: none; stroke: #cbd1ca; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .structure .near { transform: translateY(var(--near-y)); }
    .structure .far { transform: translateY(var(--far-y)); }
    .structure .reference { transform: translateY(var(--far-y)); }
    .contact-stage {
      position: relative; z-index: 1; min-height: calc(100svh - 86px);
      width: 87.5%; max-width: 1440px; margin: auto;
      padding: clamp(54px, 8vh, 100px) 0 80px;
    }
    .contact-content { width: min(510px, 48%); }
    h1 {
      margin: 0; font-family: Georgia, "Times New Roman", serif; font-weight: 400;
      font-size: clamp(62px, 6.4vw, 96px); letter-spacing: -.055em; line-height: 1.1;
    }
    .intro { margin: 22px 0 0; color: var(--muted); font-size: 14px; line-height: 1.9; }
    .contact-list { margin: 47px 0 0; padding: 0; }
    .contact-row { position: relative; padding: 0 0 22px; margin-bottom: 23px; }
    .contact-row::after {
      content: ""; position: absolute; bottom: 0; left: 0; height: 1px;
      width: 100%; background: var(--rule); pointer-events: none;
    }
    .contact-row:first-child::after {
      width: calc(100% + 15vw);
      background: linear-gradient(90deg, var(--rule) 0%, var(--rule) 58%, #d5d9d459 87%, transparent);
    }
    .contact-row:nth-child(3)::after {
      width: calc(100% + 6vw);
      background: linear-gradient(90deg, var(--rule) 0%, var(--rule) 74%, transparent);
    }
    .contact-row:last-child { margin-bottom: 0; }
    dt { margin: 0 0 8px; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: .18em; }
    dd { margin: 0; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .contact-value {
      min-width: 0; font-size: clamp(23px, 2.2vw, 31px); line-height: 1.4;
      font-weight: 400; letter-spacing: -.025em; overflow-wrap: anywhere;
    }
    .contact-row:first-child .contact-value { font-size: clamp(27px, 2.7vw, 38px); }
    .contact-value.is-placeholder { font-size: 25px; letter-spacing: .02em; }
    .contact-row:first-child .contact-value.is-placeholder { font-size: 29px; }
    a.contact-value { transition: color 160ms ease; }
    a.contact-value:hover { color: var(--blue); }
    .link-arrow { display: inline-block; margin-left: 9px; font-size: .58em; vertical-align: .18em; }
    .copy-action {
      flex: none; min-width: 64px; min-height: 44px; padding: 8px 0 8px 12px;
      border: 0; background: transparent; font-size: 11px; color: var(--muted);
      cursor: pointer; text-align: right; transition: color 160ms ease;
    }
    .copy-action:hover { color: var(--blue); }
    .copy-action[data-copied] { color: var(--ink); }
    .continuation { position: relative; z-index: 1; height: clamp(330px, 66svh, 660px); pointer-events: none; overflow: hidden; }
    .echo { width: 100%; height: 100%; display: block; }
    .echo .line { fill: none; stroke: #cbd1ca; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .site-foot {
      position: relative; z-index: 1; width: 87.5%; max-width: 1440px;
      margin: auto; padding: 24px 0 30px; border-top: 1px solid var(--rule);
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      color: var(--muted); font-size: 10px;
    }
    .site-foot a { display: inline-flex; align-items: center; min-height: 44px; }
    .site-foot a:hover { color: var(--ink); }
    @media (min-width: 1700px) {
      .contact-stage { padding-top: 100px; }
      .contact-content { width: 560px; }
      .contact-value { font-size: 32px; }
      .contact-row:first-child .contact-value { font-size: 40px; }
    }
    @media (max-width: 1000px) {
      .site-head, .contact-stage, .site-foot { width: calc(100% - 64px); }
      .contact-content { width: min(490px, 65%); }
      .structure .tablet-hide { display: none; }
      h1 { font-size: 68px; }
    }
    @media (max-width: 600px) {
      .site-head, .contact-stage, .site-foot { width: calc(100% - 48px); }
      .site-head { min-height: 68px; gap: 14px; }
      .brand { font-size: 25px; }
      .back-link { gap: 8px; font-size: 11px; }
      .back-link svg { width: 16px; }
      .structure-desktop { display: none; }
      .structure-mobile { display: block; }
      .contact-stage { min-height: calc(100svh - 68px); padding: 36px 0 42px; }
      .contact-content { width: 100%; max-width: 430px; }
      h1 { font-size: clamp(45px, 12.8vw, 64px); line-height: 1.08; }
      .intro { font-size: 12px; line-height: 1.9; margin-top: 16px; max-width: 310px; }
      .contact-list { margin-top: 31px; }
      .contact-row { padding-bottom: 15px; margin-bottom: 17px; }
      dt { font-size: 9px; margin-bottom: 6px; letter-spacing: .16em; }
      .contact-value, .contact-row:first-child .contact-value { font-size: 22px; line-height: 1.45; }
      .contact-row:first-child .contact-value { font-size: clamp(18px, 5.65vw, 22px); }
      .contact-value.is-placeholder { font-size: 20px; }
      .contact-row:first-child .contact-value.is-placeholder { font-size: 23px; }
      .contact-row:first-child::after { width: calc(100% + 24px); }
      .contact-row:nth-child(3)::after { width: 100%; }
      .copy-action { min-width: 54px; font-size: 10px; }
      .continuation { height: 47svh; min-height: 270px; }
      .echo-desktop { display: none; }
      .site-foot { font-size: 9px; padding: 12px 0 18px; }
    }
    @media (min-width: 601px) { .echo-mobile { display: none; } }
    @media (max-height: 720px) and (min-width: 601px) {
      .contact-stage { padding-top: 38px; padding-bottom: 44px; }
      h1 { font-size: 66px; }
      .contact-list { margin-top: 28px; }
      .contact-row { padding-bottom: 15px; margin-bottom: 17px; }
    }
    @media (max-height: 480px) {
      .site-head { min-height: 60px; }
      .contact-stage { min-height: calc(100svh - 60px); padding: 12px 0 24px; }
      h1 { font-size: 38px; line-height: 1.08; }
      .intro { margin-top: 8px; font-size: 12px; line-height: 1.6; }
      .contact-list { margin-top: 12px; }
      .contact-row { padding-bottom: 6px; margin-bottom: 8px; }
      dt { font-size: 9px; margin-bottom: 4px; }
      .contact-value { font-size: 20px; line-height: 1.45; }
      .contact-row:first-child .contact-value { font-size: clamp(18px, 5.65vw, 22px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .structure .near, .structure .far, .structure .reference { transform: none !important; }
    }
  </style>

  <script data-theme-source="js/theme.js">(() => {
  'use strict';
  const system = matchMedia('(prefers-color-scheme: light)');
  let preference = null;
  try { preference = localStorage.getItem('theme'); } catch {}
  if (!['light', 'dark'].includes(preference)) preference = null;
  function apply(theme) {
    document.documentElement.classList.toggle('light', theme === 'light');
    document.documentElement.classList.toggle('dark', theme !== 'light');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = theme === 'light' ? '#f3f7f5' : '#0b2431';
    document.querySelectorAll('#themeToggle, #articleTheme').forEach(button => {
      button.setAttribute('aria-label', theme === 'light' ? '切换深色主题' : '切换浅色主题');
    });
  }
  apply(preference || (system.matches ? 'light' : 'dark'));
  document.documentElement.classList.add('js');
  system.addEventListener('change', () => { if (!preference) apply(system.matches ? 'light' : 'dark'); });
  function connect() {
    apply(preference || (system.matches ? 'light' : 'dark'));
    document.querySelectorAll('#themeToggle, #articleTheme').forEach(button => {
      button.addEventListener('click', () => {
        preference = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
        apply(preference);
        try { localStorage.setItem('theme', preference); } catch {}
      });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', connect);
  else connect();
})();</script>

  <script>
    (() => {
      'use strict';
      // This page keeps its paper surface while other pages retain the saved theme.
      function syncPaperChrome() {
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = '#f2f3ef';
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', syncPaperChrome, {once: true});
      else syncPaperChrome();
      matchMedia('(prefers-color-scheme: light)').addEventListener('change', syncPaperChrome);
      const list = document.getElementById('contact-list');
      const status = document.getElementById('copy-status');
      const timers = new WeakMap();
      let contacts = {};
      try { contacts = JSON.parse(document.getElementById('contact-data').textContent) || {}; } catch {}
      const text = value => typeof value === 'string' ? value.trim() : '';
      function destination(channel, contact, value) {
        if (channel === 'email' && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          return 'mailto:' + encodeURIComponent(value).replace(/%40/g, '@');
        }
        const candidate = text(contact?.href) || (channel === 'github' && /^(https?:\/\/)?github\.com\//i.test(value) ? value : '');
        if (!candidate) return '';
        try {
          const url = new URL(/^github\.com\//i.test(candidate) ? 'https://' + candidate : candidate);
          return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
        } catch { return ''; }
      }
      function fallbackCopy(value) {
        const active = document.activeElement;
        const selection = window.getSelection();
        const ranges = selection ? Array.from({length: selection.rangeCount}, (_, i) => selection.getRangeAt(i).cloneRange()) : [];
        const input = document.createElement('textarea');
        input.value = value; input.readOnly = true; input.tabIndex = -1;
        input.setAttribute('aria-hidden', 'true');
        input.style.cssText = 'position:fixed;left:-9999px;top:0;';
        document.body.append(input);
        input.select();
        let success = false;
        try { success = document.execCommand('copy'); } catch {}
        input.remove();
        if (active instanceof HTMLElement) active.focus({preventScroll: true});
        if (selection) { selection.removeAllRanges(); ranges.forEach(range => selection.addRange(range)); }
        return success;
      }
      function populate(row, channel, contact) {
        const value = text(contact && contact.value) || text(row.querySelector('.contact-value')?.firstChild?.textContent);
        if (!value) return;
        const label = row.querySelector('dt').textContent;
        const details = row.querySelector('dd');
        const href = destination(channel, contact, value);
        const valueNode = document.createElement(href ? 'a' : 'span');
        valueNode.className = 'contact-value'; valueNode.textContent = value;
        if (href) {
          valueNode.href = href;
          if (/^https?:/.test(href)) { valueNode.target = '_blank'; valueNode.rel = 'noopener noreferrer'; }
          const arrow = document.createElement('span');
          arrow.className = 'link-arrow'; arrow.textContent = '↗'; arrow.setAttribute('aria-hidden', 'true');
          valueNode.append(arrow);

        const button = document.createElement('button');
        button.type = 'button'; button.className = 'copy-action'; button.textContent = '复制';
        button.setAttribute('aria-label', '复制 ' + label);

          let copied = false;
          try {
            if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(value); copied = true; }
          } catch {}
          if (!copied) copied = fallbackCopy(value);
          clearTimeout(timers.get(button));
          if (!copied) {
            const range = document.createRange();
            range.selectNodeContents(valueNode.firstChild);
            const selection = window.getSelection();
            if (selection) { selection.removeAllRanges(); selection.addRange(range); }
          }
          button.textContent = copied ? 'Copied' : '手动复制';
          button.toggleAttribute('data-copied', copied);
          status.textContent = copied ? label + ' 已复制' : '自动复制暂不可用，已选中联系方式，请手动复制。';
          if (copied) timers.set(button, setTimeout(() => {
            button.textContent = '复制'; button.removeAttribute('data-copied'); status.textContent = '';
          }, 1500));
        });
        details.replaceChildren(valueNode, button);
        row.classList.add('has-value');
      }
      ['email', 'wechat', 'qq'].forEach(channel => populate(list.querySelector('[data-channel="' + channel + '"]'), channel, contacts[channel]));
      if (Array.isArray(contacts.other)) contacts.other.forEach(contact => {
        if (!text(contact && contact.value)) return;
        const row = document.createElement('div'); row.className = 'contact-row';
        const label = document.createElement('dt'); label.textContent = text(contact.label) || 'OTHER';

      let frame = 0;

        frame = 0;
        if (reduced.matches || document.hidden) { reset(); return; }
        const amount = Math.min(1, Math.max(0, scrollY / Math.max(innerHeight * 1.2, 1)));
        const strength = mobileMotion.matches ? .45 : 1;
        root.style.setProperty('--near-y', (-32 * amount * strength).toFixed(2) + 'px');
        root.style.setProperty('--far-y', (-11 * amount * strength).toFixed(2) + 'px');
      }
      function schedule() {
        if (!frame && !reduced.matches && !document.hidden) frame = requestAnimationFrame(update);
      }
      function motionChanged() {
        if (frame) { cancelAnimationFrame(frame); frame = 0; }
        if (reduced.matches) reset(); else schedule();
      }
      addEventListener('scroll', schedule, {passive: true});
      addEventListener('resize', schedule, {passive: true});
      addEventListener('pageshow', motionChanged);
      document.addEventListener('visibilitychange', motionChanged);
      reduced.addEventListener('change', motionChanged);
    })();
  </script>
